<x-dc>
<div
  style="display: flex; flex-direction: column; gap: 22px"
>
  <div
    style="display: flex; flex-direction: column; gap: 9px"
  >
    <span
      style="
        font-size: 12px;
        font-weight: 600;
        color: var(--gp-muted);
      "
      >1 · Ambiente de destino</span
    >
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <sc-for
        list="{{ correoAmbientes }}"
        as="a"
        hint-placeholder-count="3"
      >
        <button
          onClick="{{ a.pick }}"
          style="cursor:pointer;background:{{ a.bg }};border:1px solid {{ a.border }};color:{{ a.color }};border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:600;font-family:'JetBrains Mono',monospace"
          style-hover="border-color:rgba(53,192,240,.45)"
        >
          {{ a.code }}
        </button>
      </sc-for>
    </div>
    <sc-if
      value="{{ correoCarpetaFalta }}"
      hint-placeholder-val="{{ false }}"
    >
      <span
        style="
          font-size: 12px;
          color: #f5b544;
          line-height: 1.5;
        "
        >Este ambiente no tiene carpeta de despliegue.
        Edítalo en la sección Ambientes o el correo va a
        salir con el marcador sin resolver.</span
      >
    </sc-if>
  </div>

  <div
    style="display: flex; flex-direction: column; gap: 10px"
  >
    <span
      style="
        font-size: 12px;
        font-weight: 600;
        color: var(--gp-muted);
      "
      >2 · Proyectos</span
    >
    <sc-for
      list="{{ correoProyectos }}"
      as="p"
      hint-placeholder-count="3"
    >
      <div
        style="background:{{ p.bg }};border:1px solid {{ p.border }};border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:10px"
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
          "
        >
          <button
            onClick="{{ p.toggle }}"
            style="
              flex: 1;
              min-width: 140px;
              text-align: left;
              cursor: pointer;
              background: none;
              border: 0;
              padding: 0;
              display: flex;
              align-items: center;
              gap: 9px;
            "
          >
            <span
              style="flex:none;width:16px;height:16px;border-radius:5px;border:1px solid {{ p.boxBorder }};background:{{ p.boxBg }};display:flex;align-items:center;justify-content:center;color:#172033"
              ><svg width="11" height="11">
                <use href="{{ p.iconHref }}"></use></svg
            ></span>
            <span
              style="font-size:13px;font-weight:600;color:{{ p.color }}"
              >{{ p.nombre }}</span
            >
          </button>
          <sc-if
            value="{{ p.on }}"
            hint-placeholder-val="{{ false }}"
          >
            <span
              style="
                flex: none;
                display: inline-flex;
                background: var(--gp-field);
                border: 1px solid var(--gp-line-20);
                border-radius: 9px;
                padding: 2px;
                gap: 2px;
              "
            >
              <button
                onClick="{{ p.pickApi }}"
                style="
                  cursor: pointer;
                  background: none;
                  border: 0;
                  color: var(--gp-muted);
                  padding: 4px 10px;
                  border-radius: 7px;
                  font-size: 11.5px;
                  font-weight: 600;
                "
                style-hover="color:#35c0f0"
              >
                API
              </button>
              <button
                onClick="{{ p.pickGateway }}"
                style="
                  cursor: pointer;
                  background: none;
                  border: 0;
                  color: var(--gp-muted);
                  padding: 4px 10px;
                  border-radius: 7px;
                  font-size: 11.5px;
                  font-weight: 600;
                "
                style-hover="color:#35c0f0"
              >
                Gateway
              </button>
              <button
                onClick="{{ p.pickAmbos }}"
                style="
                  cursor: pointer;
                  background: none;
                  border: 0;
                  color: var(--gp-muted);
                  padding: 4px 10px;
                  border-radius: 7px;
                  font-size: 11.5px;
                  font-weight: 600;
                "
                style-hover="color:#35c0f0"
              >
                Ambos
              </button>
            </span>
          </sc-if>
        </div>
        <sc-if
          value="{{ p.on }}"
          hint-placeholder-val="{{ false }}"
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              gap: 5px;
              padding-left: 25px;
            "
          >
            <sc-if
              value="{{ p.sinComponentes }}"
              hint-placeholder-val="{{ false }}"
            >
              <span
                style="font-size: 11.5px; color: #f5b544"
                >Este proyecto no tiene componentes
                enlazados.</span
              >
            </sc-if>
            <sc-for
              list="{{ p.items }}"
              as="d"
              hint-placeholder-count="2"
            >
              <button
                onClick="{{ d.toggle }}"
                style="
                  text-align: left;
                  cursor: pointer;
                  background: none;
                  border: 0;
                  padding: 2px 0;
                  display: flex;
                  align-items: center;
                  gap: 8px;
                "
              >
                <span
                  style="flex:none;width:14px;height:14px;border-radius:4px;border:1px solid {{ d.boxBorder }};background:{{ d.boxBg }};display:flex;align-items:center;justify-content:center;color:#172033"
                  ><svg width="9" height="9">
                    <use href="{{ d.iconHref }}"></use></svg
                ></span>
                <span
                  style="font-size:12px;color:{{ d.color }};font-family:'JetBrains Mono',monospace"
                  >{{ d.titulo }}</span
                >
                <span
                  style="
                    font-size: 11px;
                    color: var(--gp-muted-2);
                    font-family:
                      &quot;JetBrains Mono&quot;, monospace;
                  "
                  >{{ d.servidor }}</span
                >
              </button>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"correoAmbientes":null,"correoCarpetaFalta":null,"correoProyectos":null}'>
class Component extends DCLogic {
}
</script>
