<x-dc>
<section
  style="
    min-width: 0;
    background: var(--gp-surface);
    border: 1px solid var(--gp-line-16);
    border-radius: 16px;
    padding: 16px 16px 18px;
  "
>
  <div style="overflow-x: auto">
    <div style="min-width: 880px; display: flex; flex-direction: column; gap: 6px">
      <div
        class="est-row"
        style="
          padding: 0 4px 8px;
          border-bottom: 1px solid var(--gp-line-18);
          font-size: 11px;
          font-weight: 600;
          color: var(--gp-muted);
          line-height: 1.25;
        "
      >
        <span>Tipo</span>
        <span>Concepto</span>
        <span style="text-align: right">Horas desarrollador</span>
        <span style="text-align: right">Optimista</span>
        <span style="text-align: right">Más probable</span>
        <span style="text-align: right">Pesimista</span>
        <span style="text-align: right; color: var(--gp-cyan)">Estimación estadística</span>
        <span></span>
        <span></span>
      </div>
      <sc-for list="{{ est.lines }}" as="l" hint-placeholder-count="6">
        <sc-if value="{{ l.isSection }}" hint-placeholder-val="{{ false }}">
          <div
            class="est-row"
            style="
              margin-top: 8px;
              padding: 6px 4px;
              background: var(--gp-line-12);
              border-radius: 10px;
            "
          >
            <input
              value="{{ l.concept }}"
              onInput="{{ l.onConcept }}"
              placeholder="{{ l.conceptPlaceholder }}"
              aria-label="Nombre de la sección"
              style="grid-column:1 / 9;width:100%;box-sizing:border-box;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:var(--gp-text);font-size:13.5px;font-weight:700;letter-spacing:.2px;outline:none"
              style-focus="border-color:var(--gp-cyan);background:var(--gp-field)"
              style-hover="border-color:var(--gp-line-22)"
            />
            <div style="position: relative; display: flex; gap: 4px; justify-content: flex-end">
              <button
                onClick="{{ l.openCounter }}"
                title="{{ l.insertTitle }}"
                aria-label="{{ l.insertTitle }}"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13"><use href="#ic-plus"></use></svg>
              </button>
              <sc-if value="{{ l.counterOpen }}" hint-placeholder-val="{{ false }}">
                <div onClick="{{ est.counter.close }}" style="position: fixed; inset: 0; z-index: 20"></div>
                <div
                  style="
                    position: absolute;
                    right: calc(100% + 8px);
                    top: 50%;
                    transform: translateY(-50%);
                    z-index: 21;
                    display: flex;
                    align-items: center;
                    gap: 8px;
                    white-space: nowrap;
                    background: var(--gp-surface);
                    border: 1px solid var(--gp-line-20);
                    border-radius: 11px;
                    padding: 7px 8px 7px 12px;
                    box-shadow: 0 16px 40px -12px var(--gp-black-45);
                    font-size: 12.5px;
                    color: var(--gp-muted);
                  "
                >
                  <span>Agregar</span>
                  <input
                    type="number"
                    min="1"
                    max="50"
                    value="{{ est.counter.count }}"
                    onInput="{{ est.counter.onCount }}"
                    onKeyDown="{{ est.counter.onKey }}"
                    onFocus="{{ est.counter.onFocus }}"
                    autoFocus="{{ true }}"
                    aria-label="Cantidad de actividades"
                    style="width:54px;box-sizing:border-box;background:var(--gp-field);border:1px solid var(--gp-line-22);border-radius:8px;padding:5px 7px;color:var(--gp-text);font-size:12.5px;font-family:&quot;JetBrains Mono&quot;,monospace;text-align:right;outline:none"
                    style-focus="border-color:var(--gp-cyan)"
                  />
                  <span>actividades</span>
                  <button
                    onClick="{{ est.counter.add }}"
                    disabled="{{ est.counter.disabled }}"
                    style="display:inline-flex;align-items:center;gap:6px;background:var(--gp-cyan-12);border:1px solid var(--gp-cyan-40);color:var(--gp-cyan);cursor:pointer;padding:5px 11px;border-radius:8px;font-size:12.5px;font-weight:600;opacity:{{ est.counter.opacity }}"
                    style-hover="background:var(--gp-cyan-20)"
                  >
                    <svg width="12" height="12"><use href="#ic-check"></use></svg>Agregar
                  </button>
                </div>
              </sc-if>
              <button
                onClick="{{ l.up }}"
                disabled="{{ l.upDisabled }}"
                title="Subir"
                aria-label="Subir"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:{{ l.upOpacity }}"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13" style="transform: rotate(-90deg)"><use href="#ic-chevron"></use></svg>
              </button>
              <button
                onClick="{{ l.down }}"
                disabled="{{ l.downDisabled }}"
                title="Bajar"
                aria-label="Bajar"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:{{ l.downOpacity }}"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13" style="transform: rotate(90deg)"><use href="#ic-chevron"></use></svg>
              </button>
              <button
                onClick="{{ l.remove }}"
                title="Quitar sección"
                aria-label="Quitar sección"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-red-25);color:var(--gp-red);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"
                style-hover="background:var(--gp-red-10)"
              >
                <svg width="12" height="12"><use href="#ic-x"></use></svg>
              </button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ l.isActivity }}" hint-placeholder-val="{{ true }}">
          <div class="est-row" style="padding: 0 4px">
            <select
              value="{{ l.typeId }}"
              onChange="{{ l.onType }}"
              aria-label="Tipo de actividad"
              style="width:100%;box-sizing:border-box;background:var(--gp-field);border:1px solid var(--gp-line-22);border-radius:8px;padding:6px 7px;color:var(--gp-text);font-size:12.5px"
            >
              <sc-for list="{{ l.typeOptions }}" as="o" hint-placeholder-count="6"
                ><option value="{{ o.value }}">{{ o.label }}</option></sc-for
              >
            </select>
            <textarea
              value="{{ l.concept }}"
              onInput="{{ l.onConcept }}"
              rows="1"
              placeholder="{{ l.conceptPlaceholder }}"
              aria-label="Concepto"
              style="display:block;width:100%;box-sizing:border-box;min-height:33px;background:var(--gp-field);border:1px solid var(--gp-line-22);border-radius:8px;padding:6px 9px;color:var(--gp-text);font-size:13px;line-height:1.45;font-family:inherit;outline:none;resize:none;overflow:hidden;field-sizing:content"
              style-focus="border-color:var(--gp-cyan)"
            ></textarea>
            <input
              value="{{ l.hours }}"
              onInput="{{ l.onHours }}"
              onKeyDown="{{ l.onHoursKey }}"
              title="{{ l.hoursTitle }}"
              inputMode="decimal"
              placeholder="—"
              aria-label="Horas desarrollador"
              style="width:100%;box-sizing:border-box;background:var(--gp-field);border:1px solid {{ l.hoursBorder }};border-radius:8px;padding:6px 9px;color:var(--gp-text);font-size:13px;font-family:&quot;JetBrains Mono&quot;,monospace;text-align:right;outline:none"
              style-focus="border-color:var(--gp-cyan)"
            />
            <span style="text-align:right;font-family:&quot;JetBrains Mono&quot;,monospace;font-size:12.5px;color:var(--gp-muted)">{{ l.optimistic }}</span>
            <span style="text-align:right;font-family:&quot;JetBrains Mono&quot;,monospace;font-size:12.5px;color:var(--gp-muted)">{{ l.mostProbable }}</span>
            <span style="text-align:right;font-family:&quot;JetBrains Mono&quot;,monospace;font-size:12.5px;color:var(--gp-muted)">{{ l.pessimistic }}</span>
            <span style="text-align:right;font-family:&quot;JetBrains Mono&quot;,monospace;font-size:13px;font-weight:700;color:var(--gp-cyan)">{{ l.statistical }}</span>
            <span
              title="{{ l.reviewTitle }}"
              style="width:8px;height:8px;border-radius:50%;background:{{ l.dotColor }};justify-self:center"
            ></span>
            <div style="display: flex; gap: 4px; justify-content: flex-end">
              <button
                onClick="{{ l.insert }}"
                title="{{ l.insertTitle }}"
                aria-label="{{ l.insertTitle }}"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13"><use href="#ic-plus"></use></svg>
              </button>
              <button
                onClick="{{ l.up }}"
                disabled="{{ l.upDisabled }}"
                title="Subir"
                aria-label="Subir"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:{{ l.upOpacity }}"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13" style="transform: rotate(-90deg)"><use href="#ic-chevron"></use></svg>
              </button>
              <button
                onClick="{{ l.down }}"
                disabled="{{ l.downDisabled }}"
                title="Bajar"
                aria-label="Bajar"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-line-18);color:var(--gp-muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:{{ l.downOpacity }}"
                style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
              >
                <svg width="13" height="13" style="transform: rotate(90deg)"><use href="#ic-chevron"></use></svg>
              </button>
              <button
                onClick="{{ l.remove }}"
                title="Quitar actividad"
                aria-label="Quitar actividad"
                style="width:24px;height:24px;border-radius:7px;background:transparent;border:1px solid var(--gp-red-25);color:var(--gp-red);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0"
                style-hover="background:var(--gp-red-10)"
              >
                <svg width="12" height="12"><use href="#ic-x"></use></svg>
              </button>
            </div>
          </div>
        </sc-if>
      </sc-for>
      <sc-if value="{{ est.linesEmpty }}" hint-placeholder-val="{{ false }}">
        <div style="padding: 26px; text-align: center; color: var(--gp-muted-2); font-size: 13px">
          Sin actividades. Agrega una sección o una actividad.
        </div>
      </sc-if>
    </div>
  </div>
  <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px">
    <button
      onClick="{{ est.addSection }}"
      style="
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px dashed var(--gp-line-25);
        color: var(--gp-muted);
        cursor: pointer;
        padding: 8px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 500;
      "
      style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-50)"
    >
      <svg width="13" height="13"><use href="#ic-plus"></use></svg>Nueva sección
    </button>
    <button
      onClick="{{ est.addActivity }}"
      style="
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px dashed var(--gp-line-25);
        color: var(--gp-muted);
        cursor: pointer;
        padding: 8px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 500;
      "
      style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-50)"
    >
      <svg width="13" height="13"><use href="#ic-plus"></use></svg>Nueva actividad
    </button>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"est":null}'>
class Component extends DCLogic {
}
</script>
