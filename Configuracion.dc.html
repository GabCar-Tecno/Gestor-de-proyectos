<x-dc>
<div style="animation: vwIn 0.3s ease">
  <div
    style="
      margin-bottom: 26px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    "
  >
    <sc-if
      value="{{ empresa.logo }}"
      hint-placeholder-val="{{ false }}"
      ><div
        style="
          height: 64px;
          padding: 6px 10px;
          border-radius: 14px;
          background: #fff;
          border: 1px solid var(--gp-line-14);
          display: flex;
          align-items: center;
          justify-content: center;
        "
      >
        <img
          src="{{ empresa.logo }}"
          alt="{{ empresa.nombre }}"
          style="
            height: 100%;
            width: auto;
            max-width: 160px;
            object-fit: contain;
            display: block;
          "
        /></div
    ></sc-if>
    <sc-if
      value="{{ !empresa.logo }}"
      hint-placeholder-val="{{ true }}"
      ><div
        style="width:48px;height:48px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;color:#fff;background:{{ empresa.color }}"
      >
        {{ empresa.mono }}
      </div></sc-if
    >
    <div>
      <h1
        style="
          margin: 0;
          font-size: clamp(20px, 3vw, 26px);
          font-weight: 700;
          letter-spacing: -0.5px;
        "
      >
        Configuración
      </h1>
      <p
        style="margin: 2px 0 0; color: var(--gp-muted); font-size: 13.5px"
      >
        {{ empresa.nombre }}
      </p>
    </div>
    <button
      onClick="{{ goProyectos }}"
      style="
        margin-left: auto;
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px solid var(--gp-line-24);
        color: var(--gp-text-2);
        cursor: pointer;
        padding: 8px 14px;
        border-radius: 10px;
        font-size: 12.5px;
        font-weight: 600;
      "
      style-hover="color:#35c0f0;border-color:rgba(53,192,240,.4)"
    >
      Volver a proyectos
    </button>
  </div>
  <sc-if
    value="{{ showAmbientes }}"
    hint-placeholder-val="{{ false }}"
  >
    <div style="margin-top: 4px">
      <div
        style="
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 14px;
          flex-wrap: wrap;
        "
      >
        <h2
          style="
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--gp-text);
          "
        >
          Ambientes
        </h2>
        <span style="font-size: 12px; color: var(--gp-muted-2)"
          >Exclusivos de esta empresa</span
        >
        <button
          onClick="{{ addAmbiente }}"
          style="
            margin-left: auto;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: 1px solid rgba(53, 192, 240, 0.4);
            color: #35c0f0;
            cursor: pointer;
            padding: 7px 13px;
            border-radius: 9px;
            font-size: 12.5px;
            font-weight: 600;
          "
          style-hover="background:rgba(53,192,240,.1)"
        >
          <svg width="13" height="13">
            <use href="#ic-plus"></use></svg
          >Nuevo ambiente
        </button>
      </div>
      <sc-if
        value="{{ ambientesEmpty }}"
        hint-placeholder-val="{{ false }}"
      >
        <div
          style="
            background: var(--gp-field);
            border: 1px dashed var(--gp-line-22);
            border-radius: 14px;
            padding: 20px;
            color: var(--gp-muted-2);
            font-size: 13px;
          "
        >
          Esta empresa aún no tiene ambientes. Crea al menos uno
          para poder registrar despliegues.
        </div>
      </sc-if>
      <div
        style="
          display: grid;
          grid-template-columns: repeat(
            auto-fill,
            minmax(240px, 1fr)
          );
          gap: 12px;
        "
      >
        <sc-for
          list="{{ ambientesList }}"
          as="a"
          hint-placeholder-count="3"
        >
          <div
            style="
              background: var(--gp-surface);
              border: 1px solid var(--gp-line-16);
              border-radius: 14px;
              padding: 15px 16px;
              display: flex;
              flex-direction: column;
              gap: 10px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: 10px;
              "
            >
              <span
                style="
                  font-family:
                    &quot;JetBrains Mono&quot;, monospace;
                  font-size: 14px;
                  font-weight: 600;
                  color: #35c0f0;
                "
                >{{ a.code }}</span
              >
              <span
                style="font-size:11px;font-weight:600;color:{{ a.stageColor }};background:{{ a.stageBg }};padding:3px 8px;border-radius:20px"
                >{{ a.stageLabel }}</span
              >
            </div>
            <div style="font-size: 13px; color: var(--gp-text-2)">
              {{ a.label }}
            </div>
            <div
              style="
                font-size: 11.5px;
                color: var(--gp-muted-2);
                font-family:
                  &quot;JetBrains Mono&quot;, monospace;
              "
            >
              {{ a.carpetaTexto }}
            </div>
            <div style="display: flex; gap: 8px; margin-top: 2px">
              <button
                onClick="{{ a.edit }}"
                style="
                  flex: 1;
                  background: none;
                  border: 1px solid var(--gp-line-22);
                  color: var(--gp-muted);
                  cursor: pointer;
                  padding: 6px;
                  border-radius: 8px;
                  font-size: 12px;
                "
                style-hover="color:#35c0f0;border-color:rgba(53,192,240,.4)"
              >
                Editar
              </button>
              <button
                onClick="{{ a.del }}"
                style="
                  flex: none;
                  background: none;
                  border: 1px solid rgba(249, 123, 123, 0.25);
                  color: #f97b7b;
                  cursor: pointer;
                  padding: 6px 10px;
                  border-radius: 8px;
                  font-size: 12px;
                "
                style-hover="background:rgba(249,123,123,.08)"
              >
                Eliminar
              </button>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>

  <sc-if
    value="{{ showParam }}"
    hint-placeholder-val="{{ false }}"
  >
    <dc-import name="ConfigServidores"
      addServidor="{{ addServidor }}" servidoresEmpty="{{ servidoresEmpty }}"
      servidoresList="{{ servidoresList }}"
    />

    <dc-import name="ConfigInstrucciones"
      addInstruccion="{{ addInstruccion }}" instruccionesEmpty="{{ instruccionesEmpty }}"
      instruccionesList="{{ instruccionesList }}"
    />

    <dc-import name="ConfigContactos"
      addContacto="{{ addContacto }}" contactosEmpty="{{ contactosEmpty }}"
      contactosList="{{ contactosList }}"
    />

    <dc-import name="ConfigDesplegables"
      addDesplegable="{{ addDesplegable }}" desplegablesEmpty="{{ desplegablesEmpty }}"
      desplegablesList="{{ desplegablesList }}"
    />
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empresa":null,"goProyectos":null,"showAmbientes":false,"addAmbiente":null,"ambientesEmpty":false,"ambientesList":[],"showParam":false,"addServidor":null,"servidoresEmpty":false,"servidoresList":[],"addInstruccion":null,"instruccionesEmpty":false,"instruccionesList":[],"addContacto":null,"contactosEmpty":false,"contactosList":[],"addDesplegable":null,"desplegablesEmpty":false,"desplegablesList":[]}'>
class Component extends DCLogic {
}
</script>
