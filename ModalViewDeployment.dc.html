<x-dc>
<div
  style="display: flex; flex-direction: column; gap: 16px"
>
  <div>
    <div
      style="
        font-family: &quot;JetBrains Mono&quot;, monospace;
        font-size: 15px;
        font-weight: 600;
        color: var(--gp-cyan);
      "
    >
      {{ verDespliegue.env }}
    </div>
    <div style="font-size: 12px; color: var(--gp-muted)">
      Ambiente
    </div>
  </div>
  <div
    style="display: flex; flex-direction: column; gap: 7px"
  >
    <span
      style="
        font-size: 12px;
        font-weight: 500;
        color: var(--gp-muted);
      "
      >Versión desplegada</span
    >
    <div
      style="
        background: var(--gp-field);
        border: 1px solid var(--gp-green-25);
        border-radius: 10px;
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 10px;
      "
    >
      <span
        style="
          flex: 1;
          min-width: 0;
          word-break: break-all;
          line-height: 1.4;
          font-family:
            &quot;JetBrains Mono&quot;, monospace;
          font-size: 14px;
          color: var(--gp-green);
        "
        >{{ verDespliegue.versionText }}</span
      >
      <button
        onClick="{{ verDespliegue.copyVersion }}"
        title="{{ verDespliegue.copyVersionTitle }}"
        style="flex:none;width:30px;height:30px;border-radius:8px;background:{{ verDespliegue.copyVersionBg }};border:1px solid {{ verDespliegue.copyVersionBorder }};color:{{ verDespliegue.copyVersionColor }};cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s"
        style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
      >
        <svg width="14" height="14">
          <use
            href="{{ verDespliegue.copyVersionIconHref }}"
          ></use>
        </svg>
      </button>
    </div>
  </div>
  <div
    style="display: flex; flex-direction: column; gap: 7px"
  >
    <span
      style="
        font-size: 12px;
        font-weight: 500;
        color: var(--gp-muted);
      "
      >URL del ambiente</span
    >
    <div
      style="
        background: var(--gp-field);
        border: 1px solid var(--gp-line-20);
        border-radius: 10px;
        padding: 12px 13px;
        display: flex;
        align-items: center;
        gap: 10px;
      "
    >
      <span
        style="
          flex: 1;
          min-width: 0;
          word-break: break-all;
          line-height: 1.5;
          font-family:
            &quot;JetBrains Mono&quot;, monospace;
          font-size: 12.5px;
          color: var(--gp-text-2);
        "
        >{{ verDespliegue.urlText }}</span
      >
      <button
        onClick="{{ verDespliegue.copyUrl }}"
        title="{{ verDespliegue.copyUrlTitle }}"
        style="flex:none;width:30px;height:30px;border-radius:8px;background:{{ verDespliegue.copyUrlBg }};border:1px solid {{ verDespliegue.copyUrlBorder }};color:{{ verDespliegue.copyUrlColor }};cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .15s,border-color .15s"
        style-hover="border-color:var(--gp-cyan-45);color:var(--gp-cyan)"
      >
        <svg width="14" height="14">
          <use
            href="{{ verDespliegue.copyUrlIconHref }}"
          ></use>
        </svg>
      </button>
    </div>
  </div>
  <div style="display: flex; gap: 10px; flex-wrap: wrap">
    <button
      onClick="{{ verDespliegue.openUrl }}"
      style="
        display: inline-flex;
        align-items: center;
        gap: 7px;
        height: 36px;
        background: var(--gp-surface-2);
        border: 1px solid var(--gp-line-20);
        color: var(--gp-text-2);
        cursor: pointer;
        padding: 0 15px;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 500;
      "
      style-hover="border-color:var(--gp-cyan-40)"
    >
      Abrir ambiente<svg width="13" height="13">
        <use href="#ic-ext"></use>
      </svg>
    </button>
    <sc-if
      value="{{ isDev }}"
      hint-placeholder-val="{{ true }}"
    >
      <button
        onClick="{{ verDespliegue.sendDiscord }}"
        style="
          display: inline-flex;
          align-items: center;
          gap: 7px;
          height: 36px;
          background: none;
          border: 1px solid var(--gp-line-24);
          color: var(--gp-muted);
          cursor: pointer;
          padding: 0 15px;
          border-radius: 9px;
          font-size: 13px;
          font-weight: 500;
        "
        style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"
      >
        <svg width="14" height="14">
          <use href="#ic-send"></use></svg
        >Enviar a Discord
      </button>
      <button
        onClick="{{ verDespliegue.editAll }}"
        style="
          height: 36px;
          background: none;
          border: 1px solid var(--gp-line-24);
          color: var(--gp-muted);
          cursor: pointer;
          padding: 0 15px;
          border-radius: 9px;
          font-size: 13px;
          font-weight: 500;
        "
        style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"
      >
        Editar despliegues
      </button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"verDespliegue":null,"isDev":false}'>
class Component extends DCLogic {
}
</script>
