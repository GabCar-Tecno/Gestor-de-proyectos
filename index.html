<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./config.js"></script>
    <script>
      (() => {
        const { cdn } = window.APP_CONFIG;
        cdn.preconnect.forEach(({ href, crossOrigin }) => {
          const link = document.createElement("link");
          link.rel = "preconnect";
          link.href = href;
          if (crossOrigin) link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        });
        const fonts = document.createElement("link");
        fonts.rel = "stylesheet";
        fonts.href = cdn.fonts;
        document.head.appendChild(fonts);
        const appendScript = (src, async) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = async;
          document.head.appendChild(script);
        };
        appendScript(cdn.supabase, false);
        appendScript(cdn.redoc, true);
      })();
    </script>
    <script src="./constants.js"></script>
    <script src="./support.js"></script>
    <script>
      try {
        const { THEME } = window.APP_CONSTANTS;
        const theme =
          localStorage.getItem(THEME.storageKey) ||
          localStorage.getItem(THEME.defaultStorageKey);
        if (theme === THEME.dark)
          document.documentElement.classList.add(THEME.darkClass);
      } catch (e) {}
    </script>
  </head>

            from {
              opacity: 0;
              transform: translateY(16px) scale(0.98);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes vwIn {
            from {
              opacity: 0;
              transform: translateY(8px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }

            to {
              transform: rotate(360deg);

            margin: -12px;
            padding: clamp(16px, 2.2vw, 26px);
            border-radius: 18px;
            background: var(--gp-white);
            color: var(--gp-charcoal);

          .master-board-light h1 {

            border: 1px solid var(--gp-cloud);
            box-shadow: 0 4px 14px var(--gp-navy-4_5);
          }

            background: var(--gp-vapor);
            color: var(--gp-black);
            font-size: 12px;
          }
          .master-board-light .master-row {
            color: var(--gp-charcoal);
            border-top: 1px solid var(--gp-haze);
          }
          .master-board-light .master-row:hover {
            background: var(--gp-frost);
          }
          .master-board-light .master-cell-sub {
            color: var(--gp-ash);
          }
          .master-board-light .master-cell-label {
            color: var(--gp-pewter);
          }
          @media (max-width: 760px) {
            .master-board-light .master-table {
              background: transparent;
            }
            .master-board-light .master-row {
              background: var(--gp-fog);
              border: 1px solid var(--gp-cloud);
              box-shadow: 0 2px 8px var(--gp-navy-3_5);
            }
            .master-board-light .master-row:hover {
              background: var(--gp-frost);
            }

          .master-metrics {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 19px;
          }
          .master-metric {
            --metric-color: var(--gp-sapphire);
            --metric-tint: var(--gp-glacier);
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-width: 0;
            min-height: 108px;
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 1px solid var(--gp-storm-14);
            border-radius: 16px;
            background: linear-gradient(125deg, var(--metric-tint), var(--gp-chalk));
            box-shadow: 0 3px 12px var(--gp-navy-4_5);
          }
          .master-metric::after {
            content: "";
            position: absolute;
            z-index: 0;
            width: 95px;
            height: 64px;
            right: -2px;
            bottom: -3px;
            border-radius: 70% 0 0 0;
            background: var(--metric-color);
            opacity: 0.075;
            transform: rotate(-8deg);
          }
          .master-metric-copy {
            position: relative;
            z-index: 1;
            min-width: 0;
            width: 100%;
          }
          .master-metric-label {
            display: block;
            color: var(--metric-color);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.25px;
            line-height: 1.35;
            text-transform: uppercase;
          }
          .master-metric-value {
            display: block;
            margin-top: 2px;
            color: var(--metric-color);
            font-size: 34px;
            font-weight: 700;
            line-height: 1.05;
          }
          .master-filter-bar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(
                210px,
                280px
              ) minmax(190px, 245px);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 8px;
            border: 1px solid var(--gp-porcelain);
            border-radius: 15px;
            background: var(--gp-snow);
            box-shadow: 0 3px 12px var(--gp-navy-3_5);
          }

            min-width: 0;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 14px;
            border: 1px solid var(--gp-dew);
            border-radius: 11px;
            background: var(--gp-milk);

            transition:
              border-color 0.16s,
              box-shadow 0.16s,
              background 0.16s;
          }
          .master-filter-control:focus-within {
            border-color: var(--gp-periwinkle);
            background: var(--gp-snow);
            box-shadow: 0 0 0 3px var(--gp-azure-9);
          }
          .master-filter-control > svg {
            flex: none;
            width: 20px;
            height: 20px;
            color: var(--gp-cement);
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .master-filter-control input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--gp-charcoal) !important;
            -webkit-text-fill-color: var(--gp-charcoal);
            caret-color: var(--gp-teal);
            opacity: 1;
            font:
              500 13.5px "Poppins",

              sans-serif;
          }
          .master-filter-control input::placeholder {
            color: var(--gp-stone);
            -webkit-text-fill-color: var(--gp-stone);
            opacity: 1;
          }
          .master-dropdown-control {
            position: relative;
            z-index: 1;
          }
          .master-dropdown-trigger {
            width: 100%;
            height: 100%;

      const { VIEW, REQ_TAB, API_TAB, PROJECTS_VIEW, FILTER_ALL, ROLE, SAVE_STATUS, SEND_STATUS, THEME, LOCALE, NARROW_MAX_WIDTH, PASSWORD_INPUT, ICON, PASSWORD_ICON, PASSWORD_MIN_LENGTH, ESTIMATION_PHASE, ESTIMATION_PHASE_ORDER, ESTIMATION_DECIMAL_OPTIONS, ESTIMATION_LINE_KIND, ESTIMATION_ACTIVITY_TYPE, ESTIMATION_DEFAULTS, ESTIMATION_MAX_DAILY_HOURS, MODAL, MODAL_MODE, FIELD_KIND, INPUT_TYPE, TABLE, STORAGE, FILE_NAME, NEW_TAB, LOCAL_DATE_SUFFIX, DELAY_MS, COPY_KEY, SHOW_PASS_KEY, TEXT_LIST_TYPE, EDGE_FUNCTION, AUTH_EVENT, ID_PREFIX, REQ_STATUS, BOARD_RANK, MASTER_STATUS_GROUP, STATUS_LABEL_HINT, REQ_CODE_FALLBACK, DEPLOYABLE_KIND, EMAIL_KIND_FILTER, EMAIL_FIELD, EMAIL_PANEL, MAILTO_WARN_LENGTH, CREDENTIAL_GROUP, DB_DEFAULT, SHORT_DAY_MONTH, MS_PER_DAY, EXCEL, PRINT_COLOR } = window.APP_CONSTANTS;
      function dropFloatNoise(value) {
        return Math.round(value * 1e8) / 1e8;
      }

      function excelRoundUp(value, decimals) {
        const factor = 10 ** decimals;
        return Math.ceil(dropFloatNoise(value * factor) - 1e-9) / factor;
      }

      function lineMetrics(hours, complexity, decimals, alertRatio) {
        if (hours === "" || hours == null || Number.isNaN(Number(hours))) return null;
        const h = Number(hours);
        const optimistic = h === 0 ? 0 : h - 1;
        const mostProbable = h;
        const pessimistic = h + 1;
        const weight = Number(complexity.optimistic_weight) + Number(complexity.most_probable_weight) + Number(complexity.pessimistic_weight);
        const weighted = (Number(complexity.optimistic_weight) * optimistic + Number(complexity.most_probable_weight) * mostProbable + Number(complexity.pessimistic_weight) * pessimistic) / weight;
        const statistical = excelRoundUp(weighted, decimals) + 1;
        const stddev = (pessimistic - optimistic) / 12;
        const needsReview = mostProbable > 0 && ((pessimistic - mostProbable) / mostProbable) > Number(alertRatio);
        return { optimistic, mostProbable, pessimistic, statistical, stddev, needsReview };
      }

      function activityWithHoursMetrics(line, complexity, params) {
        if (line.kind !== ESTIMATION_LINE_KIND.activity || !complexity) return null;
        return lineMetrics(line.hours, complexity, params.decimals, params.alertRatio);
      }

      function estimationTotals(lines, complexity, params) {
        const byType = {};
        let developer = 0, statistical = 0, review = 0;
        const metrics = lines.map((line) => {
          const m = activityWithHoursMetrics(line, complexity, params);
          if (m) {
            developer += m.mostProbable;
            statistical += m.statistical;
            if (m.needsReview) review++;
            byType[line.typeId] = (byType[line.typeId] || 0) + m.mostProbable;
          }
          return m;
        });
        const dedicated = Number(params.dailyHours) * Number(params.dedication);
        const canDeliver = dedicated > 0;
        return {
          metrics, developer, statistical, review, byType, dedicated,
          developerDays: canDeliver ? developer / dedicated : null,
          statisticalDays: canDeliver ? statistical / dedicated : null,
        };
      }

        async afterLogin(){
          const uid=this.state.session.user.id;
          const { data:prof } = await this._sb.from(TABLE.profiles).select('*').eq('id',uid).maybeSingle();
          const { data:profiles, error:profilesError } = await this._sb.from(TABLE.profiles).select('*');
          const profileRows=(profiles||[]).slice();
          if(prof&&!profileRows.some(x=>x.id===prof.id)) profileRows.push(prof);
          const labelOf=x=>{
            const first=x.first_name||x.firstname||x.nombres||'';

            return String(x.display_name||x.full_name||x.nombre_completo||x.name||x.nombre||x.user_name||x.username||([first,last].filter(Boolean).join(' '))||x.email||'').trim();
          };
          const profilesByRole=role=>profileRows.filter(x=>String(x.role_id||x.role||'').trim().toLowerCase()===role).map(x=>({id:x.id,label:labelOf(x)}))

        groupRowsBy(rows,key){ const groups=new Map(); (rows||[]).forEach(row=>{ const group=groups.get(row[key]); if(group) group.push(row); else groups.set(row[key],[row]); }); return groups; }

            const payload={ title:rp.titulo, owner:(rp.responsables||[]).join(', ')||DB_DEFAULT.owner, status:rp.estado, status_id:rp.estado, code:cleaned.codes[0]||'', change_description:rp.descripcionCambios||'', observations:rp.observaciones||'', user_delivery_date:rp.fechaEntregaUsuario||null, production_date:rp.fechaPasoProduccion||null, estimated_hours:rp.horas===''||rp.horas==null?null:Number(rp.horas), status_updated_at:nowIso };

              if(error) throw error;

        openDiscordStep({projectId, projectName, environmentId, envCode, version, artifactUrl, requirementTitle}){

          const nombre = projectName || (p&&p.nombre) || '';
          const amb = (((this.empresa()||{}).ambientes)||[]).find(a=>a.id===environmentId) || {};
          const embedColor = this.estMeta(amb.stage||'')[1];
          const allCreds = (((p&&p.recursos.credenciales))||[]);
          const mapCred = (c,group)=>({ id:c.id, label:c.label||'(sin etiqueta)', username:c.username||'', secret:c.secret||'', envLabel:c.envLabel||'', group });
          const envCreds = allCreds.filter(c=>c.environmentId && c.environmentId===environmentId).map(c=>mapCred(c,CREDENTIAL_GROUP.environment));
          const genCreds = allCreds.filter(c=>!c.environmentId).map(c=>mapCred(c,CREDENTIAL_GROUP.general));
          const creds = envCreds.concat(genCreds);
          const sel={}; envCreds.forEach(c=>{ sel[c.id]=true; });
          this.setState({
            modal:{ type:MODAL.discord, title:'Enviar aviso a Discord',

        async readEdgeFunctionErrorBody(error){
          const ctx = error && error.context;
          if(!ctx || typeof ctx.text!=='function') return error.message || String(error);
          let cuerpo='';
          try{ cuerpo = await ctx.text(); }catch(_){}
          let detalle=cuerpo;
          if(cuerpo){ try{ const j=JSON.parse(cuerpo); detalle = j.error || j.message || j.msg || cuerpo; }catch(_){} }
          console.error(EDGE_FUNCTION.discordNotify, ctx.status, cuerpo);
          return 'HTTP '+(ctx.status||'?')+' — '+(detalle || error.message || 'sin cuerpo de respuesta');
        }

          if(targetAmb){
            this.openPromoteConfirm({mode:MODAL_MODE.edit, id:req.id}, {titulo:req.titulo, responsables:req.responsables||this.parseOwners(req.responsable), codigos:this.reqFormCodes(req), estado:next}, targetAmb);

        openBatchPromote(){
          if(!this.isDev()) return;
          const proy=this.proyecto(); if(!proy) return;
          const flow=this.statusOrder().flow;
          const sel=this.state.reqSelected||{};
          const selReqs=(proy.requerimientos||[]).filter(r=>sel[r.id]);
          if(!selReqs.length) return;
          const promotable=[], skipped=[];
          selReqs.forEach(r=>{ const i=flow.indexOf(r.estado); if(i>=0 && i<flow.length-1) promotable.push({id:r.id, next:flow[i+1]}); else skipped.push(r); });
          if(!promotable.length){ this.setState({modal:{type:MODAL.notice,title:'Nada para promover',mensaje:'Ninguno de los requerimientos seleccionados se puede promover (ya están en el último estado o fuera del flujo).'}, form:{}}); return; }
          const distinctNext=[...new Set(promotable.map(p=>p.next))];
          const ambs=((this.empresa()||{}).ambientes)||[];
          let targetStatusId=null, amb=null, mixed=distinctNext.length>1;
          if(!mixed){ targetStatusId=distinctNext[0]; amb=ambs.find(a=>a.stage===targetStatusId)||null; }
          const stateOnly = mixed || !amb;
          this.setState({
            modal:{ type:MODAL.batchPromote, title:'Promover requerimientos',
              targetStatusId, targetEnv:amb?amb.code:'', targetEnvId:amb?amb.id:null, hasAmb:!!amb,
              estLabel: mixed?'':this.estMeta(targetStatusId)[0], mixed,
              nextById: promotable.reduce((a,p)=>{a[p.id]=p.next;return a;},{}),
              reqIds: promotable.map(p=>p.id), count:promotable.length, skippedCount:skipped.length, stateOnly },
            form:{}, modalErr:'',
          });
        }
        async confirmBatchPromote(updateDeployment){
          if(this._busy) return; this._busy=true;
          this.setState({saveStatus:SAVE_STATUS.saving, modalErr:''});
          const md=this.state.modal, sb=this._sb, nowIso=new Date().toISOString();
          const proy=this.proyecto();
          try{
            const reqs=(proy&&proy.requerimientos)||[];
            const envId=md.targetEnvId, envCode=md.targetEnv;
            for(const rid of md.reqIds){
              const next=md.nextById[rid]; if(!next) continue;
              const { error } = await sb.from(TABLE.requirements).update({ status:next, status_id:next, status_updated_at:nowIso }).eq('id', rid);
              if(error) throw error;
            }
            if(updateDeployment && envId){
              let batchWinner=null;
              for(const rid of md.reqIds){
                const r=reqs.find(x=>x.id===rid); if(!r) continue;
                const deps=(r.despliegues||[]).filter(d=>d.environmentId===envId);
                if(!deps.length) continue;
                const latest=deps.reduce((mx,d)=>(!mx||(d.updatedAt||'')>(mx.updatedAt||''))?d:mx, null);
                if(latest && (!batchWinner || (latest.updatedAt||'')>(batchWinner.updatedAt||''))) batchWinner={url:latest.url||'', version:latest.version||'', updatedAt:latest.updatedAt||''};
                let { error } = await sb.from(TABLE.requirementDeployments).delete().eq('requirement_id', rid).eq('environment_id', envId);
                if(error) throw error;
                ({ error } = await sb.from(TABLE.requirementDeployments).insert({ id:this.gid(ID_PREFIX.deployment), requirement_id:rid, environment_id:envId, env:envCode, url:latest.url||'', version:latest.version||'', updated_at:nowIso }));
                if(error) throw error;
              }
              if(batchWinner){
                let { error } = await sb.from(TABLE.projectDeployments).delete().eq('project_id', this.state.proyectoId).eq('environment_id', envId);
                if(error) throw error;
                ({ error } = await sb.from(TABLE.projectDeployments).insert({ id:this.gid(ID_PREFIX.deployment), project_id:this.state.proyectoId, environment_id:envId, env:envCode, url:batchWinner.url, version:batchWinner.version, updated_at:nowIso }));
                if(error) throw error;
              }
            }
            this.setState({saveStatus:SAVE_STATUS.saved, reqSelectMode:false, reqSelected:{}});
            this.closeModal();
            await this.loadData();
          }catch(e){
            this.setState({saveStatus:SAVE_STATUS.error, modalErr:'No se pudo promover el lote: '+e.message});
            console.error(e);
          } finally { this._busy=false; }
        }

          const p=this.proyecto(), reqs=(p&&p.requerimientos)||[];

            const prevCode=prev?(prev.codigo||'').trim():'', prevName=prev?(prev.titulo||'').trim():((p&&p.nombre)||'');
            const nextCode=next?(next.codigo||'').trim():'', nextName=next?(next.titulo||'').trim():((p&&p.nombre)||'');

        isFirstCompletionOfAutoNextRow(l,key){
          const h=this.parseDecimalCommaOrDot(l.hours);
          return l.autoNext&&(key==='concept'||key==='hours')&&String(l.concept||'').trim()&&typeof h==='number'&&!Number.isNaN(h);
        }
        insertBlankActivityBelowUnlessEmpty(lines,i,typeId){
          const next=lines[i+1], nextEmpty=next&&next.kind===ESTIMATION_LINE_KIND.activity&&!String(next.concept||'').trim()&&!String(next.hours||'').trim();

        focusNextEstConcept(i){

          const el=document.querySelectorAll('.est-row textarea[aria-label="Concepto"]')[k]; if(el) el.focus();

        addEstLine(kind,at){
          this.editEstDraft(d=>{
            const lines=d.lines.slice(), i=at==null?lines.length:at, prev=lines[i-1];

        estCounterValue(){ const n=Number(this.state.estCounter.count); return Number.isInteger(n)&&n>=1&&n<=50?n:0; }
        addEstActivitiesToSection(){
          const n=this.estCounterValue(), lineId=this.state.estCounter.lineId, typeId=this.estDefaultTypeId(); if(!n||!lineId) return;
          let activitiesBefore=0;
          this.editEstDraft(d=>{
            const s=d.lines.findIndex(l=>l.id===lineId); if(s<0) return null;
            const at=this.indexAfterLastOfTypeOrSectionEnd(d.lines,s,typeId);
            activitiesBefore=d.lines.slice(0,at).filter(l=>l.kind===ESTIMATION_LINE_KIND.activity).length;
            const lines=d.lines.slice();
            lines.splice(at,0,...Array.from({length:n},()=>({id:this.gid(ID_PREFIX.estimationLine),kind:ESTIMATION_LINE_KIND.activity,typeId,concept:'',hours:'',autoNext:true})));

        indexAfterLastOfTypeOrSectionEnd(lines,sectionIndex,typeId){
          let end=lines.findIndex((l,i)=>i>sectionIndex&&l.kind===ESTIMATION_LINE_KIND.section); if(end<0) end=lines.length;

        moveEstLine(i,dir){ this.editEstDraft(d=>{ const j=i+dir; if(j<0||j>=d.lines.length) return null; const lines=d.lines.slice(); [lines[i],lines[j]]=[lines[j],lines[i]]; return {...d,lines}; }); }
        removeEstLine(i){ this.editEstDraft(d=>({...d,lines:d.lines.filter((_,k)=>k!==i)})); }

        estDraftCalc(d){
          const complexity=(this.state.estComplexities||[]).find(c=>c.id===d.complexityId)||null;
          const roundedToColumnScale=(v,dec)=>{ const x=this.parseDecimalCommaOrDot(v); return x===''?NaN:Math.round(x*10**dec)/10**dec; };
          const params={ decimals:Number(d.roundingDecimals), alertRatio:roundedToColumnScale(d.alertRatio,4), dailyHours:roundedToColumnScale(d.dailyHours,2), dedication:Math.round(roundedToColumnScale(d.dedicationPct,2)/100*1e4)/1e4 };
          const hoursBad=l=>{ if(l.kind!==ESTIMATION_LINE_KIND.activity) return false; const h=this.parseDecimalCommaOrDot(l.hours); return h!==''&&(Number.isNaN(h)||h>999999.99||/[.,]\d{3,}\s*$/.test(String(l.hours))); };
          const lines=d.lines.map(l=>{ const bad=hoursBad(l), h=this.parseDecimalCommaOrDot(l.hours); return {id:l.id,kind:l.kind,typeId:l.typeId,concept:l.concept,hours:l.kind===ESTIMATION_LINE_KIND.activity&&!bad&&h!==''?h:'',bad}; });

          if(!(params.alertRatio>=0)) errors.push('El umbral de alerta debe ser un número igual o mayor que cero.');
          if(!(params.dailyHours>0&&params.dailyHours<ESTIMATION_MAX_DAILY_HOURS)) errors.push('Las horas diarias deben ser mayores que cero y menores que 100.');
          if(!(params.dedication>0&&params.dedication<=1)) errors.push('La dedicación debe ser mayor que 0 % y como máximo 100 %.');
          const badCount=lines.filter(l=>l.bad).length;
          if(badCount) errors.push('Revisa las horas de '+badCount+' actividad'+(badCount===1?'':'es')+': deben ser un número igual o mayor que cero, con máximo dos decimales.');

        async saveEstimacion(){
          if(!this.isDev()||this._busy) return;

          this._busy=true;
          this.setState({saveStatus:SAVE_STATUS.saving});
          const patchDraft=patch=>this.setState(s=>s.estDraft&&s.estDraft.id===d.id?{estDraft:{...s.estDraft,...patch}}:null);

              version_label:(d.versionLabel||'').trim(), complexity_id:d.complexityId, rounding_decimals:c.params.decimals,
              deviation_alert_ratio:c.params.alertRatio, daily_hours:c.params.dailyHours, dedication:c.params.dedication, updated_at:new Date().toISOString() };
            if(d.isNew){
              const { error } = await sb.from(TABLE.estimations).insert({ id:d.id, created_by:this.state.session.user.id, status:ESTIMATION_PHASE.created, ...header });
              if(error) throw error;
              patchDraft({isNew:false, estStatus:ESTIMATION_PHASE.created});
            } else {
              const { error } = await sb.from(TABLE.estimations).update(header).eq('id',d.id);
              if(error) throw error;
            }
            const idsOwnedEvenIfSaveFails=[...new Set([...d.savedLineIds,...d.lines.map(l=>l.id)])];
            patchDraft({savedLineIds:idsOwnedEvenIfSaveFails});
            await this.saveEstimationLines(d.id,c.lines,d.savedLineIds);
            if(requirementId&&d.updateReqHours){
              const { error } = await sb.from(TABLE.requirements).update({estimated_hours:Math.round(c.totals.developer*100)/100}).eq('id',requirementId);
              if(error) throw error;
            }
            this.setState(s=>{
              const cur=s.estDraft;
              if(!cur||cur.id!==d.id) return {saveStatus:SAVE_STATUS.saved};
              return {saveStatus:SAVE_STATUS.saved, estDraft:{...cur, isNew:false, estStatus:cur.estStatus||ESTIMATION_PHASE.created, savedLineIds:d.lines.map(l=>l.id), dirty:cur.rev!==d.rev}};
            });
            await this.loadData();
          }catch(e){ console.error(e); this.setState({saveStatus:SAVE_STATUS.error,modal:{type:MODAL.notice,title:'No se pudo guardar la estimación',mensaje:e.message||'Intenta de nuevo.'},form:{}}); }
          finally{ this._busy=false; }
        }
        async saveEstimationLines(estimationId,lines,knownIds){
          const sb=this._sb;
          const { data:dbRows, error:readError } = await sb.from(TABLE.estimationLines).select('id,sort_order').eq('estimation_id',estimationId);
          if(readError) throw readError;
          const removed=this.lineIdsThisEditorKnewAndDropped(dbRows||[],knownIds,lines);
          if(removed.length){ const { error } = await sb.from(TABLE.estimationLines).delete().in('id',removed); if(error) throw error; }
          if(!lines.length) return;
          const rows=lines.map((l,i)=>({ id:l.id, estimation_id:estimationId, sort_order:i+1, line_kind:l.kind,
            activity_type_id:l.kind===ESTIMATION_LINE_KIND.activity?l.typeId:null, concept:(l.concept||'').trim(), developer_hours:l.kind===ESTIMATION_LINE_KIND.activity&&l.hours!==''?l.hours:null }));
          await this.parkSortOrdersNegativeOnCollision(rows,(dbRows||[]).filter(r=>!removed.includes(r.id)));
          const { error } = await sb.from(TABLE.estimationLines).upsert(rows);
          if(error) throw error;
        }
        lineIdsThisEditorKnewAndDropped(dbRows,knownIds,lines){
          const known=new Set(knownIds), currentIds=new Set(lines.map(l=>l.id));
          return dbRows.filter(r=>known.has(r.id)&&!currentIds.has(r.id)).map(r=>r.id);

        async parkSortOrdersNegativeOnCollision(rows,kept){
          const holder={};
          kept.forEach(r=>{ holder[r.sort_order]=r.id; });
          if(!rows.some(r=>holder[r.sort_order]&&holder[r.sort_order]!==r.id)) return;
          const base=kept.reduce((m,r)=>Math.max(m,Math.abs(r.sort_order)),rows.length)+1;
          const { error } = await this._sb.from(TABLE.estimationLines).upsert(rows.map((r,i)=>({...r,sort_order:-(base+i)})));
          if(error) throw error;

              R.form.links=links.map((l,i)=>{
                const k=COPY_KEY.githubLinkRowPrefix+i, copied=s.copiedKey===k;
                return { label:l.label||'', url:l.url||'',
                  onLabel:(e)=>this.setGithubLinkRow(i,'label',e.target.value),
                  onUrl:(e)=>this.setGithubLinkRow(i,'url',e.target.value),
                  canRemove: links.length>1, remove:()=>this.removeGithubLinkRow(i),
                  hasUrl: !!(l.url&&l.url.trim()),
                  copy:()=>this.copyToClipboard(l.url,k),
                  copyTitle: copied?'Copiado':'Copiar URL',
                  copyIconHref: copied?ICON.check:ICON.copy,
                  copyColor: copied?'var(--gp-green)':'var(--gp-muted)',
                  open:()=>this.openExt(l.url) };
              });
              R.addGithubLinkRow=()=>this.addGithubLinkRow();
            }
            if(md.type===MODAL.credentials){
              const rows=s.form.credRows||[];
              const credEnvOptions=[{value:'',label:'— General (sin ambiente)'}].concat(ambienteOptions);
              R.form.credRows=rows.map((c,i)=>{
                const shown=!!s.modalShowPass[SHOW_PASS_KEY.credentialRowPrefix+i];
                return { label:c.label||'', environmentId:c.environmentId||'', username:c.username||'', secret:c.secret||'', url:c.url||'', notes:c.notes||'',
                  envOptions:credEnvOptions,
                  onLabel:(e)=>this.setCredRow(i,'label',e.target.value),
                  onEnv:(e)=>this.setCredRow(i,'environmentId',e.target.value),
                  onUsername:(e)=>this.setCredRow(i,'username',e.target.value),
                  onSecret:(e)=>this.setCredRow(i,'secret',e.target.value),
                  onUrl:(e)=>this.setCredRow(i,'url',e.target.value),
                  onNotes:(e)=>this.setCredRow(i,'notes',e.target.value),
                  secretType: this.passwordInputType(shown),
                  eyeHref: this.passwordToggleIcon(shown),
                  toggleSecret:()=>this.toggleModalShowPass(SHOW_PASS_KEY.credentialRowPrefix+i),
                  canRemove: rows.length>1, remove:()=>this.removeCredRow(i) };
              });
              R.addCredRow=()=>this.addCredRow();
            }
            if(md.type===MODAL.deployable){
              const sel=s.form.instruccionIds||[];
              const inss=(emp&&emp.instrucciones)||[];
              R.desplegableSinInstrucciones=!inss.length;
              R.desplegableInstrucciones=inss.map(i=>{
                const on=sel.includes(i.id);
                return { text:i.text, toggle:()=>this.toggleDesplegableInstruccion(i.id),
                         bg: on?'var(--gp-cyan-10)':'var(--gp-field)',
                         border: on?'var(--gp-cyan-45)':'var(--gp-line-20)',
                         boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)',
                         boxBg: on?'var(--gp-cyan)':'transparent',
                         iconHref: on?ICON.check:ICON.x,
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type===MODAL.components){
              const sel=s.form.desplegableIds||[];
              const opts=(emp&&emp.desplegables)||[];
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const kindMeta=(k)=> k===DEPLOYABLE_KIND.gateway ? ['Gateway','var(--gp-violet)','var(--gp-violet-16)']
                                 : k===DEPLOYABLE_KIND.app     ? ['App','var(--gp-amber)','var(--gp-amber-16)']
                                 :                 ['API','var(--gp-cyan)','var(--gp-cyan-16)'];
              R.componentesOpcionesEmpty=!opts.length;
              R.componentesOpciones=opts.map(d=>{
                const on=sel.includes(d.id), meta=kindMeta(d.kind), srv=srvById[d.serverId];
                return { titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                         kindLabel:meta[0], kindColor:meta[1], kindBg:meta[2],
                         toggle:()=>this.toggleProyDesplegable(d.id),
                         bg: on?'var(--gp-cyan-10)':'var(--gp-field)',
                         border: on?'var(--gp-cyan-45)':'var(--gp-line-20)',
                         boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)',
                         boxBg: on?'var(--gp-cyan)':'transparent',
                         iconHref: on?ICON.check:ICON.x,
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type===MODAL.email){
              const f=s.form||{};
              const ambs=(emp&&emp.ambientes)||[];
              const deps=(emp&&emp.desplegables)||[];
              const proys=(emp&&emp.proyectos)||[];
              const ctos=(emp&&emp.contactos)||[];
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const sel=f.itemIds||[];
              const ambSel=ambs.find(a=>a.id===f.envId);
              const box=(on)=>({ boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)', boxBg: on?'var(--gp-cyan)':'transparent',
                                 iconHref: on?ICON.check:ICON.x, color: on?'var(--gp-text)':'var(--gp-muted)',
                                 bg: on?'var(--gp-cyan-10)':'var(--gp-field)', border: on?'var(--gp-cyan-45)':'var(--gp-line-20)' });
              const itemRow=(d)=>{ const srv=srvById[d.serverId];
                return Object.assign({ titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                                       toggle:()=>this.toggleCorreoItem(d.id) }, box(sel.includes(d.id))); };

              R.correoAmbientes=ambs.map(a=>{ const on=a.id===f.envId;
                return { code:a.code, pick:()=>this.setCorreoAmbiente(a.id),
                         bg: on?'var(--gp-cyan-14)':'var(--gp-field)', border: on?'var(--gp-cyan)':'var(--gp-line-20)',
                         color: on?'var(--gp-cyan)':'var(--gp-muted)' }; });
              R.correoCarpetaFalta = !!(ambSel && !ambSel.deployFolder);

              const proySel=f.proyectoIds||[];
              R.correoProyectos=proys.map(p=>{
                const on=proySel.includes(p.id);
                const mios=deps.filter(d=>(p.desplegableIds||[]).includes(d.id));
                return Object.assign({ nombre:p.nombre, on, sinComponentes: on && !mios.length,
                                       toggle:()=>this.toggleCorreoProyecto(p.id),
                                       pickApi:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.api),
                                       pickGateway:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.gateway),
                                       pickAmbos:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.both),
                                       items: mios.map(itemRow) }, box(on));
              });

              const enAlgunProyecto=new Set();
              proys.forEach(p=>(p.desplegableIds||[]).forEach(id=>enAlgunProyecto.add(id)));
              const otros=deps.filter(d=>!enAlgunProyecto.has(d.id));
              R.correoOtrosEmpty=!otros.length;
              R.correoOtrosHay=!!otros.length;
              R.correoOtros=otros.map(d=>Object.assign(itemRow(d), {rowBg: sel.includes(d.id)?'var(--gp-cyan-10)':'transparent'}));

              const abiertos=s.correoOpen||{};
              const chevron=(on)=> on?'rotate(-90deg)':'rotate(90deg)';
              const otrosSel=otros.filter(d=>sel.includes(d.id));
              R.correoOtrosOpen=!!abiertos.otros;
              R.correoOtrosChevron=chevron(!!abiertos.otros);
              R.toggleCorreoOtros=()=>this.toggleCorreoPanel(EMAIL_PANEL.others);
              R.correoOtrosConteo=otrosSel.length+'/'+otros.length;
              R.correoOtrosResumen= otrosSel.length ? otrosSel.map(d=>d.name+(d.port?(':'+d.port):'')).join(', ') : 'Ninguno seleccionado';
              R.correoOtrosResumenColor= otrosSel.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoOtrosBorder= otrosSel.length?'var(--gp-cyan-45)':'var(--gp-line-22)';

              R.correoContactosEmpty=!ctos.length;
              R.correoContactosHay=!!ctos.length;
              const ctoRow=(k,field)=>{
                const on=(f[field===EMAIL_FIELD.to?'toIds':'ccIds']||[]).includes(k.id);
                return Object.assign({ name:k.name, email:k.email, toggle:()=>this.toggleExclusiveToOrCcRecipient(k.id,field),
                                       rowBg: on?(field===EMAIL_FIELD.to?'var(--gp-cyan-10)':'var(--gp-violet-10)'):'transparent' },
                                     box(on));
              };
              R.correoContactosTo=ctos.map(k=>ctoRow(k,EMAIL_FIELD.to));
              R.correoContactosCc=ctos.map(k=>ctoRow(k,EMAIL_FIELD.cc));
              const nombresDe=(ids)=>ctos.filter(k=>(ids||[]).includes(k.id)).map(k=>k.name);
              const nomTo=nombresDe(f.toIds), nomCc=nombresDe(f.ccIds);
              R.correoToOpen=!!abiertos.to; R.correoCcOpen=!!abiertos.cc;
              R.correoToChevron=chevron(!!abiertos.to); R.correoCcChevron=chevron(!!abiertos.cc);
              R.toggleCorreoTo=()=>this.toggleCorreoPanel(EMAIL_PANEL.to);
              R.toggleCorreoCc=()=>this.toggleCorreoPanel(EMAIL_PANEL.cc);
              R.correoToResumen= nomTo.length ? nomTo.join(', ') : 'Sin destinatarios';
              R.correoToResumenColor= nomTo.length?'var(--gp-text-2)':'var(--gp-amber)';
              R.correoToBorder= nomTo.length?'var(--gp-cyan-45)':'var(--gp-amber-45)';
              R.correoCcResumen= nomCc.length ? nomCc.join(', ') : 'Nadie en copia';
              R.correoCcResumenColor= nomCc.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoCcBorder= nomCc.length?'var(--gp-violet-45)':'var(--gp-line-22)';
              R.setCorreoNota=(e)=>this.setCorreoNota(e);

              const p=this.correoPayload();
              const url=this.correoMailtoUrl(p);
              const falta=[];
              if(!f.envId) falta.push('elige un ambiente');
              if(!p.itemsCount) falta.push('marca al menos un desplegable');
              if(!p.to.length) falta.push('agrega al menos un destinatario en Para');
              const puede=!falta.length;
              const copiado=s.copiedKey===COPY_KEY.emailBody;
              R.correoAsunto=p.subject;
              R.correoCuerpo=p.body;
              R.correoChars=url.length+' / 2048 caracteres';
              R.correoCharsColor= url.length>MAILTO_WARN_LENGTH ? 'var(--gp-amber)' : 'var(--gp-muted-2)';
              R.correoLargo= url.length>MAILTO_WARN_LENGTH;
              R.correoBloqueo= falta.length ? ('Para poder abrir el correo: '+falta.join(', ')+'.') : '';
              R.correoBloqueoShow=!!falta.length;
              R.correoNoPuede=!puede;
              R.correoBtnBg= puede ? 'linear-gradient(135deg,var(--gp-indigo),var(--gp-sky))' : 'var(--gp-line-14)';
              R.correoBtnColor= puede ? 'var(--gp-white)' : 'var(--gp-muted-2)';
              R.correoBtnCursor= puede ? 'pointer' : 'not-allowed';
              R.abrirCorreo=()=>this.abrirCorreo();
              R.copiarCorreoCuerpo=()=>this.copiarCorreoCuerpo();
              R.correoCopyLabel= copiado ? 'Copiado' : 'Copiar cuerpo';
              R.correoCopyIcon= copiado ? ICON.check : ICON.copy;
              R.correoCopyColor= copiado ? 'var(--gp-green)' : 'var(--gp-text-2)';
              R.setCorreoCuerpo=(e)=>this.setCorreoCuerpo(e);
            }
          }
          return R;
        }
      }
    </script>
  </body>
</html>
