<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="./config.js"></script>
    <script src="./support.js"></script>
    <script>
      try {
        // gp-theme: elección manual con el botón; gp-theme-default: el del rol en el último login
        const theme =
          localStorage.getItem("gp-theme") ||
          localStorage.getItem("gp-theme-default");
        if (theme === "dark")
          document.documentElement.classList.add("dark-mode");
      } catch (e) {}
    </script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
          rel="stylesheet"
        />
        <style>
          * {
            box-sizing: border-box;
          }
          html,
          body {
            margin: 0;
            height: 100%;
          }
          body {
            background: #ffffff;
            color: #263247;
            font-family: "Poppins", system-ui, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
          }
          /* Colores que cambian con el tema. Los valores de :root son los del modo claro;
             html.dark-mode los reemplaza con la paleta azul marino original. */
          :root {
            --gp-text: #263247;
            --gp-text-2: #354258;
            --gp-text-3: #47566c;
            --gp-muted: #59677a;
            --gp-muted-2: #647187;
            --gp-muted-3: #64748b;
            --gp-muted-4: #526176;
            --gp-muted-5: #536782;
            --gp-muted-6: #475569;
            --gp-faint: #a5b0bf;
            --gp-dot: #8492a8;
            --gp-surface: #eef1f5;
            --gp-field: #e3e8ef;
            --gp-surface-2: #e5eaf0;
            --gp-surface-3: #dce4ed;
            --gp-line-soft: #dce4ef;
            --gp-card-line: #c5cfdd;
            --gp-card-line-hover: #8da7c7;
            --gp-line-12: rgba(71, 91, 119, 0.12);
            --gp-line-14: rgba(71, 91, 119, 0.14);
            --gp-line-16: rgba(71, 91, 119, 0.16);
            --gp-line-18: rgba(71, 91, 119, 0.18);
            --gp-line-20: rgba(71, 91, 119, 0.2);
            --gp-line-22: rgba(71, 91, 119, 0.22);
            --gp-line-24: rgba(71, 91, 119, 0.24);
            --gp-line-25: rgba(71, 91, 119, 0.25);
            --gp-header-bg: rgba(237, 240, 245, 0.96);
            --gp-hover-bg: rgba(16, 42, 112, 0.045);
            --gp-hover-line: rgba(16, 42, 112, 0.4);
            --gp-btn-bg: #fff;
            --gp-avatar-bg: linear-gradient(135deg, #102a70, #087f9f);
            --gp-primary: #102a70;
            --gp-primary-hover: #16388f;
            --gp-ink: #102a70;
            --gp-ink-bg: #e3eaf7;
            --gp-tint: #edf4fc;
            --gp-tint-strong: #e8f1ff;
            --gp-link: #087f9f;
            --gp-code: #164bb8;
            --gp-success: #08764f;
            --gp-success-line: rgba(8, 118, 79, 0.4);
            --gp-tag-line: #c9d8ed;
            --gp-tag-text: #183c75;
            --gp-tag-avatar-bg: #d7e9ff;
            --gp-tag-avatar-text: #1557a5;
            --gp-metric-total: #1557b0;
            --gp-metric-total-tint: #edf5ff;
            --gp-metric-dev: #b95b00;
            --gp-metric-dev-tint: #fff5e9;
            --gp-metric-qa: #6246a5;
            --gp-metric-qa-tint: #f4f0ff;
            --gp-metric-prod-tint: #eafaf1;
            --gp-metric-block: #b42332;
            --gp-metric-block-tint: #fff0f1;
          }
          html.dark-mode {
            color-scheme: dark;
            --gp-text: #e9edf7;
            --gp-text-2: #c7d0ea;
            --gp-text-3: #b7c0dd;
            --gp-muted: #8a95b6;
            --gp-muted-2: #66739a;
            --gp-muted-3: #66739a;
            --gp-muted-4: #8a95b6;
            --gp-muted-5: #8a95b6;
            --gp-muted-6: #8a95b6;
            --gp-faint: #3a476b;
            --gp-dot: #5c678c;
            --gp-surface: #111a30;
            --gp-field: #0c1428;
            --gp-surface-2: #1a2340;
            --gp-surface-3: #22304f;
            --gp-line-soft: rgba(255, 255, 255, 0.12);
            --gp-card-line: rgba(255, 255, 255, 0.07);
            --gp-card-line-hover: rgba(53, 192, 240, 0.45);
            --gp-line-12: rgba(255, 255, 255, 0.04);
            --gp-line-14: rgba(255, 255, 255, 0.06);
            --gp-line-16: rgba(255, 255, 255, 0.07);
            --gp-line-18: rgba(255, 255, 255, 0.08);
            --gp-line-20: rgba(255, 255, 255, 0.1);
            --gp-line-22: rgba(255, 255, 255, 0.12);
            --gp-line-24: rgba(255, 255, 255, 0.14);
            --gp-line-25: rgba(255, 255, 255, 0.22);
            --gp-header-bg: rgba(10, 16, 32, 0.82);
            --gp-hover-bg: rgba(255, 255, 255, 0.05);
            --gp-hover-line: rgba(53, 192, 240, 0.4);
            --gp-btn-bg: transparent;
            --gp-avatar-bg: linear-gradient(135deg, #33436e, #1a2440);
            --gp-primary: #2b3bd6;
            --gp-primary-hover: #3646e0;
            --gp-ink: #35c0f0;
            --gp-ink-bg: rgba(53, 192, 240, 0.14);
            --gp-tint: rgba(53, 192, 240, 0.1);
            --gp-tint-strong: rgba(53, 192, 240, 0.14);
            --gp-link: #35c0f0;
            --gp-code: #35c0f0;
            --gp-success: #39d39b;
            --gp-success-line: rgba(57, 211, 155, 0.4);
            --gp-tag-line: rgba(53, 192, 240, 0.28);
            --gp-tag-text: #c7d0ea;
            --gp-tag-avatar-bg: rgba(53, 192, 240, 0.18);
            --gp-tag-avatar-text: #66d2f5;
            --gp-metric-total: #35c0f0;
            --gp-metric-total-tint: rgba(53, 192, 240, 0.1);
            --gp-metric-dev: #f5b544;
            --gp-metric-dev-tint: rgba(245, 181, 68, 0.1);
            --gp-metric-qa: #a78bfa;
            --gp-metric-qa-tint: rgba(167, 139, 250, 0.1);
            --gp-metric-prod-tint: rgba(57, 211, 155, 0.1);
            --gp-metric-block: #f97b7b;
            --gp-metric-block-tint: rgba(249, 123, 123, 0.1);
          }
          ::selection {
            background: rgba(53, 192, 240, 0.32);
          }
          a {
            color: #087f9f;
            text-decoration: none;
          }
          a:hover {
            color: #086b88;
          }
          ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
          }
          ::-webkit-scrollbar-thumb {
            background: #b9c4d2;
            border-radius: 8px;
            border: 2px solid #e7ebf0;
          }
          ::-webkit-scrollbar-thumb:hover {
            background: #9eacbd;
          }
          input,
          select,
          textarea,
          button {
            font-family: inherit;
          }
          button {
            color: inherit;
          }
          @keyframes ovIn {
            from {
              opacity: 0;
            }
            to {
              opacity: 1;
            }
          }
          @keyframes shIn {
            from {
              opacity: 0;
              transform: translateY(16px) scale(0.98);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes vwIn {
            from {
              opacity: 0;
              transform: translateY(8px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes spin {
            to {
              transform: rotate(360deg);
            }
          }
          /* Redoc embed: contenedor acotado que hace scroll internamente; el lateral sticky se ancla a este box */
          .redoc-embed {
            --redoc-h: 78vh;
            height: var(--redoc-h);
          }
          .redoc-embed:fullscreen {
            --redoc-h: 100vh;
            border-radius: 0 !important;
          }
          .redoc-scroll {
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
          }
          .redoc-embed .menu-content {
            height: var(--redoc-h) !important;
          }
          .app-header {
            background: rgba(237, 240, 245, 0.96) !important;
            border-bottom-color: #cbd3df !important;
            color: #263247 !important;
          }
          .master-board-light {
            margin: -12px;
            padding: clamp(16px, 2.2vw, 26px);
            border-radius: 18px;
            background: #ffffff;
            color: #263247;
          }
          .master-board-light h1 {
            color: #102a70;
          }
          .master-board-light .master-table {
            background: #eef1f5;
            border: 1px solid #cbd3df;
            box-shadow: 0 4px 14px rgba(16, 42, 112, 0.045);
          }
          .master-board-light .master-table-head {
            background: #dfe5ed;
            color: #000;
            font-size: 12px;
          }
          .master-board-light .master-row {
            color: #263247;
            border-top: 1px solid #d4dbe4;
          }
          .master-board-light .master-row:hover {
            background: #e5ebf2;
          }
          .master-board-light .master-cell-sub {
            color: #59677a;
          }
          .master-board-light .master-cell-label {
            color: #536782;
          }
          @media (max-width: 760px) {
            .master-board-light .master-table {
              background: transparent;
            }
            .master-board-light .master-row {
              background: #eef1f5;
              border: 1px solid #cbd3df;
              box-shadow: 0 2px 8px rgba(16, 42, 112, 0.035);
            }
            .master-board-light .master-row:hover {
              background: #e5ebf2;
            }
          }
          .master-metrics {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 19px;
          }
          .master-metric {
            --metric-color: #1557b0;
            --metric-tint: #edf5ff;
            position: relative;
            isolation: isolate;
            overflow: hidden;
            min-width: 0;
            min-height: 108px;
            display: flex;
            align-items: center;
            padding: 18px 20px;
            border: 1px solid rgba(71, 91, 119, 0.14);
            border-radius: 16px;
            background: linear-gradient(125deg, var(--metric-tint), #f7f9fc);
            box-shadow: 0 3px 12px rgba(16, 42, 112, 0.045);
          }
          .master-metric::after {
            content: "";
            position: absolute;
            z-index: 0;
            width: 95px;
            height: 64px;
            right: -2px;
            bottom: -3px;
            border-radius: 70% 0 0 0;
            background: var(--metric-color);
            opacity: 0.075;
            transform: rotate(-8deg);
          }
          .master-metric-copy {
            position: relative;
            z-index: 1;
            min-width: 0;
            width: 100%;
          }
          .master-metric-label {
            display: block;
            color: var(--metric-color);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.25px;
            line-height: 1.35;
            text-transform: uppercase;
          }
          .master-metric-value {
            display: block;
            margin-top: 2px;
            color: var(--metric-color);
            font-size: 34px;
            font-weight: 700;
            line-height: 1.05;
          }
          .master-filter-bar {
            display: grid;
            grid-template-columns: minmax(260px, 1fr) minmax(
                210px,
                280px
              ) minmax(190px, 245px);
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            padding: 8px;
            border: 1px solid #e0e6ee;
            border-radius: 15px;
            background: #f8fafc;
            box-shadow: 0 3px 12px rgba(16, 42, 112, 0.035);
          }
          .master-filter-control {
            min-width: 0;
            height: 50px;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 14px;
            border: 1px solid #dce4ed;
            border-radius: 11px;
            background: #f1f4f8;
            color: #526176;
            transition:
              border-color 0.16s,
              box-shadow 0.16s,
              background 0.16s;
          }
          .master-filter-control:focus-within {
            border-color: #9bb9df;
            background: #f8fafc;
            box-shadow: 0 0 0 3px rgba(53, 125, 190, 0.09);
          }
          .master-filter-control > svg {
            flex: none;
            width: 20px;
            height: 20px;
            color: #5c7089;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .master-filter-control input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #263247 !important;
            -webkit-text-fill-color: #263247;
            caret-color: #087f9f;
            opacity: 1;
            font:
              500 13.5px "Poppins",
              system-ui,
              sans-serif;
          }
          .master-filter-control input::placeholder {
            color: #6a7b91;
            -webkit-text-fill-color: #6a7b91;
            opacity: 1;
          }
          .master-dropdown-control {
            position: relative;
            z-index: 1;
          }
          .master-dropdown-trigger {
            width: 100%;
            height: 100%;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 0;
            border: 0;
            background: transparent;
            color: #263247;
            text-align: left;
            font:
              600 13px "Poppins",
              system-ui,
              sans-serif;
            cursor: pointer;
          }
          .master-dropdown-trigger:focus-visible,
          .master-dropdown-option:focus-visible {
            outline: 2px solid #8da7c7;
            outline-offset: 2px;
          }
          .master-dropdown-trigger > span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
          .master-dropdown-menu {
            position: absolute;
            z-index: 23;
            top: calc(100% + 8px);
            left: 0;
            right: 0;
            max-height: 320px;
            overflow-y: auto;
            padding: 6px;
            border: 1px solid #d7e0eb;
            border-radius: 12px;
            background: #fbfcfe;
            box-shadow: 0 14px 30px rgba(16, 42, 112, 0.16);
            animation: vwIn 0.12s ease;
          }
          .master-dropdown-option {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 11px;
            border: 0;
            border-radius: 8px;
            background: transparent;
            color: #354258;
            text-align: left;
            font:
              500 12.5px "Poppins",
              system-ui,
              sans-serif;
            cursor: pointer;
            transition:
              background 0.12s,
              color 0.12s;
          }
          .master-dropdown-option:hover {
            background: #edf4fc;
            color: #102a70;
          }
          .master-dropdown-option svg {
            flex: none;
            width: 15px;
            height: 15px;
            color: #087f9f;
          }
          .master-dropdown-option-dot {
            flex: none;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            box-shadow: 0 0 0 3px rgba(71, 91, 119, 0.08);
          }
          .master-dropdown-backdrop {
            position: fixed;
            inset: 0;
            z-index: 20;
            border: 0;
            background: transparent;
            cursor: default;
          }
          .master-filter-chevron {
            flex: none;
            width: 15px !important;
            height: 15px !important;
            color: #536782 !important;
          }
          @media (max-width: 1000px) {
            .master-metrics {
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .master-filter-bar {
              grid-template-columns: 1fr 1fr;
            }
            .master-search-control {
              grid-column: 1/-1;
            }
          }
          @media (max-width: 640px) {
            .master-metrics {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 10px;
            }
            .master-metric {
              min-height: 96px;
              padding: 14px;
            }
            .master-metric-label {
              font-size: 10px;
            }
            .master-metric-value {
              font-size: 29px;
            }
            .master-filter-bar {
              grid-template-columns: 1fr;
              padding: 7px;
            }
            .master-search-control {
              grid-column: auto;
            }
          }
          @media (max-width: 420px) {
            .master-metrics {
              grid-template-columns: 1fr 1fr;
            }
            .master-metric {
              padding: 12px 10px;
            }
            .master-metric-value {
              font-size: 27px;
            }
          }
          /* Acentos de estado legibles sobre fondos claros */
          [style*="color:#35c0f0"],
          [style*="color:#66d2f5"] {
            color: #087f9f !important;
          }
          [style*="color:#39d39b"] {
            color: #08764f !important;
          }
          [style*="color:#f97b7b"] {
            color: #b42332 !important;
          }
          [style*="color:#f5b544"] {
            color: #805b00 !important;
          }
          .project-card {
            background: #eef1f5 !important;
            border: 1px solid #c5cfdd !important;
            color: #263247 !important;
            box-shadow: 0 4px 14px rgba(16, 42, 112, 0.055);
            line-height: 1.5;
          }
          .project-card:hover {
            background: #e9edf2 !important;
            border-color: #8da7c7 !important;
            box-shadow: 0 8px 18px rgba(16, 42, 112, 0.09);
          }
          .project-card [style*="color:#59677a"],
          .project-card [style*="color:#47566c"] {
            color: #526176 !important;
          }
          .project-card [style*="background:#e3e8ef"] {
            background: #dce3ec !important;
          }
          .project-card [style*="font-size:17px"] {
            font-size: 18px !important;
            line-height: 1.4;
          }
          .project-card [style*="font-size:13px"] {
            font-size: 13.5px !important;
            line-height: 1.55;
          }
          .project-card [style*="font-size:12px"] {
            font-size: 12.5px !important;
          }
          .master-table {
            display: flex;
            flex-direction: column;
            background: #e3e8ef;
            border: 1px solid rgba(71, 91, 119, 0.18);
            border-radius: 14px;
            overflow: hidden;
          }
          .master-table-head,
          .master-row {
            display: grid;
            grid-template-columns: minmax(110px, 0.95fr) 78px minmax(
                210px,
                2fr
              ) 112px minmax(185px, 1.75fr) 105px 105px;
            gap: 12px;
            align-items: center;
          }
          .master-table-head {
            padding: 12px 16px;
            background: #eef1f5;
            color: #59677a;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.45px;
            text-transform: uppercase;
          }
          .master-row {
            width: 100%;
            text-align: left;
            cursor: pointer;
            background: transparent;
            border: 0;
            border-top: 1px solid rgba(71, 91, 119, 0.14);
            color: #263247;
            padding: 13px 16px;
            transition: background 0.15s;
          }
          .master-row:hover {
            background: rgba(53, 192, 240, 0.055);
          }
          .master-cell-label {
            display: none;
          }
          .master-cell-main {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .master-cell-sub {
            display: block;
            margin-top: 3px;
            color: #647187;
            font-size: 10.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
          }
          .master-cell-description .master-cell-sub {
            white-space: normal;
            overflow: visible;
            overflow-wrap: anywhere;
          }
          @media (max-width: 1000px) {
            .master-table-head,
            .master-row {
              grid-template-columns: minmax(100px, 0.9fr) 70px minmax(
                  175px,
                  1.7fr
                ) 100px minmax(150px, 1.5fr) 95px 100px;
              gap: 8px;
              padding-left: 12px;
              padding-right: 12px;
            }
          }
          /* ===== Móvil (<=760px: mismo corte que el estado `narrow` del JS) ===== */
          @media (max-width: 760px) {
            .master-table {
              background: transparent;
              border: 0;
              gap: 10px;
              overflow: visible;
            }
            .master-table-head {
              display: none;
            }
            .master-row {
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 11px 14px;
              background: #eef1f5;
              border: 1px solid rgba(71, 91, 119, 0.16);
              border-radius: 13px;
              padding: 14px;
            }
            .master-row:hover {
              background: #e9edf2;
            }
            .master-cell-label {
              display: block;
              margin-bottom: 4px;
              color: #647187;
              font-size: 9.5px;
              font-weight: 600;
              letter-spacing: 0.35px;
              text-transform: uppercase;
            }
            .master-cell-app,
            .master-cell-description,
            .master-cell-observations {
              grid-column: 1/-1;
            }
            /* La cabecera se salía ~23px del ancho: el avatar quedaba cortado. */
            .app-header {
              gap: 10px !important;
            }
            .brand-sub {
              display: none;
            }
            /* Las acciones de la empresa (correo + configuración + toggle) medían 424px
   dentro de un contenedor de 343px y provocaban scroll horizontal en toda la página. */
            .emp-actions {
              max-width: 100%;
              flex-wrap: wrap;
              justify-content: flex-end;
              row-gap: 10px;
            }
            /* El CTA "Ver requerimientos →" se partía en 3 líneas; ahora baja entero a su propia fila. */
            .hero-row {
              flex-wrap: wrap;
              row-gap: 10px;
            }
            .hero-cta {
              white-space: nowrap;
            }
            /* Los chips de filtro caían de a uno por fila porque competían con "Seleccionar". */
            .req-filter-chips {
              flex-basis: 100% !important;
            }
            .req-sel-btn {
              margin-left: auto;
            }

      // ---------- ESTIMACIONES: misma matemática que la vista estimation_line_metrics ----------
      // ROUNDUP del Excel. snapped evita que 2.2 * 10 = 22.000000000000004 suba a 2.3.
      function roundUp(value, decimals) {
        const factor = 10 ** decimals;
        const scaled = value * factor;
        const snapped = Math.round(scaled * 1e8) / 1e8;
        return Math.ceil(snapped - 1e-9) / factor;
      }

      function lineMetrics(hours, complexity, decimals, alertRatio) {
        if (hours === "" || hours == null || Number.isNaN(Number(hours))) return null;
        const h = Number(hours);
        const optimistic = h === 0 ? 0 : h - 1;
        const mostProbable = h;
        const pessimistic = h + 1;
        const weight = Number(complexity.optimistic_weight) + Number(complexity.most_probable_weight) + Number(complexity.pessimistic_weight);
        const weighted = (Number(complexity.optimistic_weight) * optimistic + Number(complexity.most_probable_weight) * mostProbable + Number(complexity.pessimistic_weight) * pessimistic) / weight;
        const statistical = roundUp(weighted, decimals) + 1;
        const stddev = (pessimistic - optimistic) / 12;
        const needsReview = mostProbable > 0 && ((pessimistic - mostProbable) / mostProbable) > Number(alertRatio);
        return { optimistic, mostProbable, pessimistic, statistical, stddev, needsReview };
      }

      // Totales de una estimación, como estimation_summaries. lines: [{kind, typeId, hours}].
      // Las secciones y las actividades sin horas no suman (en el Excel las filas vacías sumaban 1.2 h).
      function estimationTotals(lines, complexity, params) {
        const byType = {};
        let developer = 0, statistical = 0, review = 0;
        const metrics = lines.map((line) => {
          const m = line.kind === "activity" && complexity ? lineMetrics(line.hours, complexity, params.decimals, params.alertRatio) : null;
          if (m) {
            developer += m.mostProbable;
            statistical += m.statistical;
            if (m.needsReview) review++;
            byType[line.typeId] = (byType[line.typeId] || 0) + m.mostProbable;
          }
          return m;
        });
        const dedicated = Number(params.dailyHours) * Number(params.dedication);
        const canDeliver = dedicated > 0;
        return {
          metrics, developer, statistical, review, byType, dedicated,
          developerDays: canDeliver ? developer / dedicated : null,
          statisticalDays: canDeliver ? statistical / dedicated : null,
        };
      }

      class Component extends DCLogic {
        constructor(props){
          super(props);
          this.state = {
            view:'empresas', empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null,
            estComplexities:[], estActivityTypes:[], currentUserName:'', exportingEstimacion:false, estCounter:{lineId:null,count:'1'},
            reqTab:'documentos', filter:'todos', modal:null, form:{},
            projectsView:'grid', reqSelectMode:false, reqSelected:{},
            maestroSearch:'', maestroStatus:'todos', maestroProject:'todos', maestroProjectMenuOpen:false, maestroStatusMenuOpen:false, exportingExcel:false,
            apiTab:'url', apiUrlInput:'', apiJsonInput:'', apiErr:'', apiHasRender:false,
            session:null, authChecked:false, profileRole:null, devProfiles:[],
            loginEmail:'', loginPassword:'', loginError:'', loginNotice:'', loginLoading:false,
            recoveryMode:false, recoveryPass1:'', recoveryPass2:'', recoveryError:'', recoveryLoading:false,
            showLoginPass:false, showRecoveryPass1:false, showRecoveryPass2:false, modalShowPass:{},
            data:[], statuses:[], dataLoaded:false, loadError:'', copiedKey:'', userMenuOpen:false, apiFullscreen:false, credShown:{},
            documentFileName:'',
            correoOpen:{},
            narrow: (typeof window!=='undefined' && window.innerWidth<=760),
          };
        }

        // ---------- SUPABASE ----------
        componentDidMount(){
          this._sb = window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
          );
          this._sb.auth.getSession().then(({data})=>{
            this.setState({session:data.session, authChecked:true});
            if(data.session) this.afterLogin();
          });
          this._authSub = this._sb.auth.onAuthStateChange((evt, session)=>{
            if(evt==='PASSWORD_RECOVERY'){ this.setState({session, authChecked:true, recoveryMode:true}); return; }
            const had=this.state.session;
            this.setState({session, authChecked:true});
            if(session && !had && !this.state.recoveryMode){ this.afterLogin(); }
            else if(!session){ this.setState({data:[], dataLoaded:false, profileRole:null, devProfiles:[], view:'empresas', empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null}); }
          });
          this._onResize=()=>{
            const n=window.innerWidth<=760;
            if(n!==this.state.narrow) this.setState({narrow:n});
          };
          window.addEventListener('resize', this._onResize);
          this._onFsChange=()=>{ const fs=!!document.fullscreenElement; if(fs!==this.state.apiFullscreen) this.setState({apiFullscreen:fs}); };
          document.addEventListener('fullscreenchange', this._onFsChange);
          // Una estimación sin guardar no se pierde al cerrar o recargar la pestaña sin aviso.
          this._onBeforeUnload=(e)=>{ if(this.estDirty()){ e.preventDefault(); e.returnValue=''; } };
          window.addEventListener('beforeunload', this._onBeforeUnload);
          window.__app=this;
        }
        componentWillUnmount(){
          if(this._authSub && this._authSub.data) this._authSub.data.subscription.unsubscribe();
          window.removeEventListener('resize', this._onResize);
          document.removeEventListener('fullscreenchange', this._onFsChange);
          window.removeEventListener('beforeunload', this._onBeforeUnload);
        }

        async afterLogin(){
          const uid=this.state.session.user.id;
          const { data:prof } = await this._sb.from('profiles').select('*').eq('id',uid).maybeSingle();
          const { data:profiles, error:profilesError } = await this._sb.from('profiles').select('*');
          const profileRows=(profiles||[]).slice();
          if(prof&&!profileRows.some(x=>x.id===prof.id)) profileRows.push(prof);
          const labelOf=x=>{
            const first=x.first_name||x.firstname||x.nombres||'';
            const last=x.last_name||x.lastname||x.apellidos||'';
            return String(x.display_name||x.full_name||x.nombre_completo||x.name||x.nombre||x.user_name||x.username||([first,last].filter(Boolean).join(' '))||x.email||'').trim();
          };
          const devProfiles=profileRows.filter(x=>String(x.role_id||x.role||'').trim().toLowerCase()==='dev').map(x=>({id:x.id,label:labelOf(x)}))
            .filter(x=>x.id&&x.label).filter((x,i,a)=>a.findIndex(y=>y.label.toLowerCase()===x.label.toLowerCase())===i).sort((a,b)=>a.label.localeCompare(b.label,'es-CO'));
          if(profilesError) console.warn('No se pudieron cargar los perfiles de desarrollo:',profilesError.message);
          const profileRole=prof ? (prof.role_id || prof.role) : 'client';
          // devProfiles deja fuera al PM: el nombre del usuario actual se toma de su propio perfil.
          const currentUserName=(prof&&labelOf(prof))||this.state.session.user.email||'';
          this.setState({profileRole, devProfiles, currentUserName});
          this.applyRoleTheme(profileRole);
          await this.loadData();
        }

        // El PM tiene los mismos permisos que dev; además es el único que puede descargar el Excel del tablero.
        isDev(){ return this.state.profileRole==='dev'||this.isPM(); }
        isPM(){ return this.state.profileRole==='pm'; }

        async loadData(){
          this.setState({loadError:''});
          const sb=this._sb;
          const [co,pr,pd,gh,rq,rdoc,rdep,rblk,env,st,cred,srv,dep,pdep,ins,dins,cto,ecx,eat,est,eln,rcodes] = await Promise.all([
            sb.from('companies').select('*'),
            sb.from('projects').select('*'),
            sb.from('project_deployments').select('*'),
            sb.from('project_github_links').select('*'),
            sb.from('requirements').select('*'),
            sb.from('requirement_documents').select('*'),
            sb.from('requirement_deployments').select('*'),
            sb.from('requirement_blockers').select('*'),
            sb.from('environments').select('*'),
            sb.from('statuses').select('*'),
            sb.from('project_credentials').select('*'),
            sb.from('company_servers').select('*'),
            sb.from('deployables').select('*'),
            sb.from('project_deployables').select('*'),
            sb.from('deployment_instructions').select('*'),
            sb.from('deployable_instructions').select('*'),
            sb.from('company_contacts').select('*'),
            // Estimaciones: RLS solo devuelve filas a dev/pm; un cliente recibe listas vacías.
            sb.from('estimation_complexities').select('*'),
            sb.from('estimation_activity_types').select('*'),
            sb.from('estimations').select('*'),
            this.selectAll('estimation_lines'),
            this.selectAll('requirement_codes'),
          ]);
          const bad=[co,pr,pd,gh,rq,rdoc,rdep,rblk,env,st,cred,srv,dep,pdep,ins,dins,cto,ecx,eat,est,eln,rcodes].find(r=>r.error);
          if(bad){ this.setState({loadError: bad.error.message, dataLoaded:true}); return; }

          // catalogos parametricos
          const statuses=(st.data||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
          const estComplexities=(ecx.data||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
          const estActivityTypes=(eat.data||[]).slice().sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
          const envById={}; (env.data||[]).forEach(e=>{ envById[e.id]=e; });
          const envCode=d=>{ const e=envById[d.environment_id]; return (e&&e.code) || d.env || ''; };

          const byOrder=(a,b)=>(a.sort_order||0)-(b.sort_order||0);
          const codesByReq={};
          (rcodes.data||[]).forEach(c=>{ (codesByReq[c.requirement_id]||(codesByReq[c.requirement_id]=[])).push(c); });
          Object.keys(codesByReq).forEach(id=>codesByReq[id].sort(byOrder));
          const data = (co.data||[]).map(c=>{
            const ambientes=(env.data||[]).filter(e=>e.company_id===c.id)
              .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))
              .map(e=>({id:e.id, code:e.code, label:e.label||e.code, stage:e.stage||'', sortOrder:e.sort_order||0, deployFolder:e.deploy_folder||''}));
            return {

        // --- Wizard de correo de despliegue: selección (Tarea 9). La Tarea 10 extiende con vista previa/mailto. ---

        toggleCorreoPanel(key){

        _correoDesplegablesDe(pid){
          const emp=this.empresa()||{};
          const p=(emp.proyectos||[]).find(x=>x.id===pid)||{};

          return (emp.desplegables||[]).filter(d=>ids.includes(d.id));
        }
        // Ids de desplegables cubiertos por los proyectos marcados en `proyectoIds` (excluyendo `exceptPid` si se da).
        _correoCubiertosPorOtros(proyectoIds, exceptPid){
          const cubiertos=new Set();
          (proyectoIds||[]).forEach(otroPid=>{
            if(otroPid===exceptPid) return;
            this._correoDesplegablesDe(otroPid).forEach(d=>cubiertos.add(d.id));
          });
          return cubiertos;

        toggleCorreoProyecto(pid){
          this.setState(s=>{
            const proys=(s.form.proyectoIds||[]).slice();
            const items=new Set(s.form.itemIds||[]);
            const mios=this._correoDesplegablesDe(pid).map(d=>d.id);
            const i=proys.indexOf(pid);
            if(i>=0){
              proys.splice(i,1);
              // Solo se quita un item si ningún otro proyecto marcado lo sigue teniendo.
              const cubiertos=this._correoCubiertosPorOtros(proys);
              mios.forEach(id=>{ if(!cubiertos.has(id)) items.delete(id); });
              return {form:{...s.form, proyectoIds:proys, itemIds:[...items], cuerpoEditado:null}};
            }
            proys.push(pid);
            mios.forEach(id=>items.add(id));

        setCorreoProyectoKind(pid, kind){

            const items=new Set(s.form.itemIds||[]);
            const mios=this._correoDesplegablesDe(pid);
            const miosIds=mios.map(d=>d.id);
            const quiero=mios.filter(d=> kind==='ambos' ? true : kind==='gateway' ? d.kind==='gateway' : d.kind!=='gateway').map(d=>d.id);
            // Solo se quita un item propio si ningún otro proyecto marcado lo sigue teniendo.
            const cubiertos=this._correoCubiertosPorOtros(proys, pid);
            miosIds.forEach(id=>{ if(!cubiertos.has(id)) items.delete(id); });
            quiero.forEach(id=>items.add(id));

        correoPayload(){
          const emp=this.empresa()||{}, f=this.state.form||{};
          const amb=(emp.ambientes||[]).find(a=>a.id===f.envId)||{};
          const deps=emp.desplegables||[];
          const insById={}; (emp.instrucciones||[]).forEach(i=>{ insById[i.id]=i.text; });
          const sel=f.itemIds||[];
          const items=deps.filter(d=>sel.includes(d.id))
            .slice().sort((a,b)=>(a.sortOrder||0)-(b.sortOrder||0))
            .map(d=>({ name:d.name, port:d.port, serverId:d.serverId,
                       instructions:(d.instruccionIds||[]).map(i=>insById[i]).filter(Boolean) }));
          const nombres=(emp.proyectos||[]).filter(p=>(f.proyectoIds||[]).includes(p.id)).map(p=>p.nombre);
          const built=this.buildDeployEmail({
            envCode: amb.code||'', deployFolder: amb.deployFolder||'',
            projectNames: nombres, servers: emp.servidores||[], items,
            nota: f.nota||'', hour: new Date().getHours(),
          });
          const byId={}; (emp.contactos||[]).forEach(k=>{ byId[k.id]=k; });
          const mails=(ids)=>(ids||[]).map(id=>(byId[id]||{}).email).filter(Boolean);
          const cuerpo = (f.cuerpoEditado==null) ? built.body : f.cuerpoEditado;
          return { subject:built.subject, body:cuerpo, to:mails(f.toIds), cc:mails(f.ccIds), itemsCount:items.length };
        }
        correoMailtoUrl(p){
          const q=[];
          if(p.cc.length) q.push('cc='+p.cc.join(','));
          q.push('subject='+encodeURIComponent(p.subject));
          q.push('body='+encodeURIComponent(p.body));
          return 'mailto:'+p.to.join(',')+'?'+q.join('&');
        }
        setCorreoCuerpo(e){ const v=e.target.value; this.setState(s=>({form:{...s.form, cuerpoEditado:v}})); }
        abrirCorreo(){
          const p=this.correoPayload();
          if(!p.to.length || !p.itemsCount) return;
          // En pestaña nueva: si el mailto lo atiende un webmail no se pierde la app, y si lo atiende
          // Outlook de escritorio el navegador igual dispara el handler sin navegar esta pestaña.
          const a=document.createElement('a');
          a.href=this.correoMailtoUrl(p); a.target='_blank'; a.rel='noopener noreferrer';
          document.body.appendChild(a); a.click(); a.remove();
        }

          const envCreds = allCreds.filter(c=>c.environmentId && c.environmentId===environmentId).map(c=>mapCred(c,'env'));
          const genCreds = allCreds.filter(c=>!c.environmentId).map(c=>mapCred(c,'general'));
          const creds = envCreds.concat(genCreds);
          const sel={}; envCreds.forEach(c=>{ sel[c.id]=true; });
          this.setState({
            modal:{ type:'discord', title:'Enviar aviso a Discord',

        // supabase.functions.invoke devuelve "Edge Function returned a non-2xx status code" y esconde
        // el cuerpo real de la respuesta en error.context. Sin esto no hay forma de saber qué falló.
        async fnErrorText(error){
          const ctx = error && error.context;
          if(!ctx || typeof ctx.text!=='function') return error.message || String(error);
          let cuerpo='';
          try{ cuerpo = await ctx.text(); }catch(_){}
          let detalle=cuerpo;
          if(cuerpo){ try{ const j=JSON.parse(cuerpo); detalle = j.error || j.message || j.msg || cuerpo; }catch(_){} }
          console.error('discord-notify', ctx.status, cuerpo);
          return 'HTTP '+(ctx.status||'?')+' — '+(detalle || error.message || 'sin cuerpo de respuesta');
        }

        // ---------- PROMOCIÓN MÚLTIPLE (batch) ----------
        openBatchPromote(){
          if(!this.isDev()) return;
          const proy=this.proyecto(); if(!proy) return;
          const flow=this.statusOrder().flow;
          const sel=this.state.reqSelected||{};
          const selReqs=(proy.requerimientos||[]).filter(r=>sel[r.id]);
          if(!selReqs.length) return;
          const promotable=[], skipped=[];
          selReqs.forEach(r=>{ const i=flow.indexOf(r.estado); if(i>=0 && i<flow.length-1) promotable.push({id:r.id, next:flow[i+1]}); else skipped.push(r); });
          if(!promotable.length){ this.setState({modal:{type:'aviso',title:'Nada para promover',mensaje:'Ninguno de los requerimientos seleccionados se puede promover (ya están en el último estado o fuera del flujo).'}, form:{}}); return; }
          const distinctNext=[...new Set(promotable.map(p=>p.next))];
          const ambs=((this.empresa()||{}).ambientes)||[];
          let targetStatusId=null, amb=null, mixed=distinctNext.length>1;
          if(!mixed){ targetStatusId=distinctNext[0]; amb=ambs.find(a=>a.stage===targetStatusId)||null; }
          const stateOnly = mixed || !amb;
          this.setState({
            modal:{ type:'batchPromote', title:'Promover requerimientos',
              targetStatusId, targetEnv:amb?amb.code:'', targetEnvId:amb?amb.id:null, hasAmb:!!amb,
              estLabel: mixed?'':this.estMeta(targetStatusId)[0], mixed,
              nextById: promotable.reduce((a,p)=>{a[p.id]=p.next;return a;},{}),
              reqIds: promotable.map(p=>p.id), count:promotable.length, skippedCount:skipped.length, stateOnly },
            form:{}, modalErr:'',
          });

        async confirmBatchPromote(updateDeployment){
          if(this._busy) return; this._busy=true;
          this.setState({saveStatus:'saving', modalErr:''});
          const md=this.state.modal, sb=this._sb, nowIso=new Date().toISOString();
          const proy=this.proyecto();
          try{
            const reqs=(proy&&proy.requerimientos)||[];
            const envId=md.targetEnvId, envCode=md.targetEnv;
            // 1) Avanzar el estado de cada requerimiento a su siguiente estado del flujo.
            for(const rid of md.reqIds){
              const next=md.nextById[rid]; if(!next) continue;
              const { error } = await sb.from('requirements').update({ status:next, status_id:next, status_updated_at:nowIso }).eq('id', rid);
              if(error) throw error;
            }
            // 2) Actualizar despliegues solo si se pidió y hay un ambiente destino único.
            if(updateDeployment && envId){
              let batchWinner=null;
              for(const rid of md.reqIds){
                const r=reqs.find(x=>x.id===rid); if(!r) continue;
                const deps=(r.despliegues||[]).filter(d=>d.environmentId===envId);
                if(!deps.length) continue; // sin despliegue a ese ambiente: solo estado, no aporta link
                const latest=deps.reduce((mx,d)=>(!mx||(d.updatedAt||'')>(mx.updatedAt||''))?d:mx, null);
                if(latest && (!batchWinner || (latest.updatedAt||'')>(batchWinner.updatedAt||''))) batchWinner={url:latest.url||'', version:latest.version||'', updatedAt:latest.updatedAt||''};
                let { error } = await sb.from('requirement_deployments').delete().eq('requirement_id', rid).eq('environment_id', envId);
                if(error) throw error;
                ({ error } = await sb.from('requirement_deployments').insert({ id:this.gid('x'), requirement_id:rid, environment_id:envId, env:envCode, url:latest.url||'', version:latest.version||'', updated_at:nowIso }));
                if(error) throw error;
              }
              if(batchWinner){
                let { error } = await sb.from('project_deployments').delete().eq('project_id', this.state.proyectoId).eq('environment_id', envId);
                if(error) throw error;
                ({ error } = await sb.from('project_deployments').insert({ id:this.gid('x'), project_id:this.state.proyectoId, environment_id:envId, env:envCode, url:batchWinner.url, version:batchWinner.version, updated_at:nowIso }));
                if(error) throw error;
              }
            }
            this.setState({saveStatus:'saved', reqSelectMode:false, reqSelected:{}});
            this.closeModal();
            await this.loadData();
          }catch(e){
            this.setState({saveStatus:'error', modalErr:'No se pudo promover el lote: '+e.message});
            console.error(e);
          } finally { this._busy=false; }
        }

            line('activity','manuales','Documentación del API','2'),
            line('activity','manuales','Manual de usuario','2'),
            line('activity','gestion','Gestión de proyecto, sesiones con cliente, seguimiento.'),
          ];
          const estDraft={ id:this.gid('est'), isNew:true, dirty:false, rev:0, savedLineIds:[],
            code:'', estimatedOn:this.todayIso(), clientName:(emp&&emp.nombre)||'', initiativeName:p.nombre||'', requesterName:'', pmName:this.state.currentUserName||'',
            versionLabel:'V1', complexityId:(cx.find(c=>c.id==='baja')||cx[0]||{}).id||'baja', estStatus:'creada', requirementId:'', updateReqHours:false,
            roundingDecimals:'1', alertRatio:'0.3', dailyHours:'8', dedicationPct:'62.5', lines };
          this.setState(s=>({view:'estimacion',estimacionId:estDraft.id,estDraft,estCounter:{...s.estCounter,lineId:null}}));
        }
        openEstimacion(id){
          if(!this.isDev()) return;
          const p=this.proyecto(), e=p&&(p.estimaciones||[]).find(x=>x.id===id); if(!e) return;
          const num=v=>this.fmtNum(Number(v));
          const estDraft={ id:e.id, isNew:false, dirty:false, rev:0, savedLineIds:e.lineas.map(l=>l.id),
            code:e.codigo, estimatedOn:e.fecha||this.todayIso(), clientName:e.cliente, initiativeName:e.iniciativa, requesterName:e.solicitante, pmName:e.pm,
            versionLabel:e.version, complexityId:e.complexityId, estStatus:e.estado||'creada', requirementId:e.requirementId, updateReqHours:!!e.requirementId,
            roundingDecimals:String(e.decimales), alertRatio:num(e.umbral), dailyHours:num(e.horasDia), dedicationPct:num(e.dedicacion*100),
            lines:e.lineas.map(l=>({id:l.id,kind:l.kind,typeId:l.typeId,concept:l.concepto,hours:l.horas==null?'':String(l.horas),autoNext:l.kind==='activity'&&!l.concepto})) };
          this.setState(s=>({view:'estimacion',estimacionId:id,estDraft,estCounter:{...s.estCounter,lineId:null}}));
        }
        editEstDraft(fn,done){ this.setState(s=>{ const d=s.estDraft; if(!d) return null; const next=fn(d); return next?{estDraft:{...next,dirty:true,rev:(d.rev||0)+1}}:null; },done); }
        setEstField(key,value){ this.editEstDraft(d=>({...d,[key]:value})); }
        // Código e iniciativa siguen al requerimiento mientras la persona no los haya cambiado a mano.
        setEstRequirement(id){
          const p=this.proyecto(), reqs=(p&&p.requerimientos)||[];
          this.editEstDraft(d=>{
            const prev=reqs.find(r=>r.id===d.requirementId), next=reqs.find(r=>r.id===id);
            const prevCode=prev?(prev.codigo||'').trim():'', prevName=prev?(prev.titulo||'').trim():((p&&p.nombre)||'');
            const nextCode=next?(next.codigo||'').trim():'', nextName=next?(next.titulo||'').trim():((p&&p.nombre)||'');
            const untouched=(cur,old)=>{ const c=(cur||'').trim(); return !c||c===old; };
            return {...d, requirementId:next?next.id:'', updateReqHours:!!next,
              code:untouched(d.code,prevCode)?nextCode:d.code,
              initiativeName:untouched(d.initiativeName,prevName)?nextName:d.initiativeName};
          });
        }
        // autoNext: la fila nació sin concepto (la está llenando la persona). Al completar concepto y horas
        // aparece una vacía debajo, una sola vez por fila y solo si la de abajo no está ya vacía.
        setEstLine(i,key,value){
          this.editEstDraft(d=>{
            const lines=d.lines.slice(); let l={...lines[i],[key]:value};
            const h=this.parseEstNumber(l.hours);
            if(l.autoNext&&(key==='concept'||key==='hours')&&String(l.concept||'').trim()&&typeof h==='number'&&!Number.isNaN(h)){
              l={...l,autoNext:false};
              const next=lines[i+1], nextEmpty=next&&next.kind==='activity'&&!String(next.concept||'').trim()&&!String(next.hours||'').trim();
              if(!nextEmpty) lines.splice(i+1,0,{id:this.gid('eln'),kind:'activity',typeId:l.typeId,concept:'',hours:'',autoNext:true});
            }
            lines[i]=l;
            return {...d,lines};
          });
        }
        // Enter en las horas pasa al concepto de la actividad siguiente.
        focusNextEstConcept(i){
          const k=(this.state.estDraft.lines||[]).slice(0,i+1).filter(l=>l.kind==='activity').length;
          const el=document.querySelectorAll('.est-row textarea[aria-label="Concepto"]')[k]; if(el) el.focus();
        }
        addEstLine(kind,at){
          this.editEstDraft(d=>{
            const lines=d.lines.slice(), i=at==null?lines.length:at, prev=lines[i-1];
            const typeId=kind==='activity'?((prev&&prev.kind==='activity'&&prev.typeId)||this.estDefaultTypeId()):'';
            lines.splice(i,0,{id:this.gid('eln'),kind,typeId,concept:'',hours:'',autoNext:kind==='activity'});
            return {...d,lines};
          });
        }
        // El + de una sección abre un contador para agregar varias actividades de desarrollo a esa sección.
        openEstCounter(lineId){ this.setState(s=>({estCounter:{...s.estCounter,lineId}})); }
        closeEstCounter(){ this.setState(s=>({estCounter:{...s.estCounter,lineId:null}})); }
        estCounterValue(){ const n=Number(this.state.estCounter.count); return Number.isInteger(n)&&n>=1&&n<=50?n:0; }
        // Quedan debajo de las de desarrollo que ya tiene la sección (antes de arquitectura y QA en la plantilla);
        // si no tiene ninguna, al final de la sección.
        addEstActivitiesToSection(){
          const n=this.estCounterValue(), lineId=this.state.estCounter.lineId, typeId=this.estDefaultTypeId(); if(!n||!lineId) return;
          let activitiesBefore=0;
          this.editEstDraft(d=>{
            const s=d.lines.findIndex(l=>l.id===lineId); if(s<0) return null;
            let end=d.lines.findIndex((l,i)=>i>s&&l.kind==='section'); if(end<0) end=d.lines.length;
            let at=end; for(let i=end-1;i>s;i--) if(d.lines[i].kind==='activity'&&d.lines[i].typeId===typeId){ at=i+1; break; }
            activitiesBefore=d.lines.slice(0,at).filter(l=>l.kind==='activity').length;
            const lines=d.lines.slice();
            lines.splice(at,0,...Array.from({length:n},()=>({id:this.gid('eln'),kind:'activity',typeId,concept:'',hours:'',autoNext:true})));
            return {...d,lines};
          },()=>{ const el=document.querySelectorAll('.est-row textarea[aria-label="Concepto"]')[activitiesBefore]; if(el) el.focus(); });
          this.closeEstCounter();
        }
        moveEstLine(i,dir){ this.editEstDraft(d=>{ const j=i+dir; if(j<0||j>=d.lines.length) return null; const lines=d.lines.slice(); [lines[i],lines[j]]=[lines[j],lines[i]]; return {...d,lines}; }); }
        removeEstLine(i){ this.editEstDraft(d=>({...d,lines:d.lines.filter((_,k)=>k!==i)})); }

        // Valores del borrador ya convertidos, totales y errores. Lo usan la pantalla, el guardado y la exportación.
        estDraftCalc(d){
          const complexity=(this.state.estComplexities||[]).find(c=>c.id===d.complexityId)||null;
          // Redondeados a la escala de cada columna, para calcular con lo mismo que queda guardado.
          const toNum=(v,dec)=>{ const x=this.parseEstNumber(v); return x===''?NaN:Math.round(x*10**dec)/10**dec; };
          const params={ decimals:Number(d.roundingDecimals), alertRatio:toNum(d.alertRatio,4), dailyHours:toNum(d.dailyHours,2), dedication:Math.round(toNum(d.dedicationPct,2)/100*1e4)/1e4 };
          const hoursBad=l=>{ if(l.kind!=='activity') return false; const h=this.parseEstNumber(l.hours); return h!==''&&(Number.isNaN(h)||h>999999.99||/[.,]\d{3,}\s*$/.test(String(l.hours))); };
          const lines=d.lines.map(l=>{ const bad=hoursBad(l), h=this.parseEstNumber(l.hours); return {id:l.id,kind:l.kind,typeId:l.typeId,concept:l.concept,hours:l.kind==='activity'&&!bad&&h!==''?h:'',bad}; });
          const totals=estimationTotals(lines,complexity,params);
          const errors=[];
          if(!complexity) errors.push('Elige la complejidad.');
          if(!d.estimatedOn) errors.push('La fecha es obligatoria.');
          if(!(params.alertRatio>=0)) errors.push('El umbral de alerta debe ser un número igual o mayor que cero.');
          if(!(params.dailyHours>0&&params.dailyHours<100)) errors.push('Las horas diarias deben ser mayores que cero y menores que 100.');
          if(!(params.dedication>0&&params.dedication<=1)) errors.push('La dedicación debe ser mayor que 0 % y como máximo 100 %.');
          const badCount=lines.filter(l=>l.bad).length;
          if(badCount) errors.push('Revisa las horas de '+badCount+' actividad'+(badCount===1?'':'es')+': deben ser un número igual o mayor que cero, con máximo dos decimales.');
          if(lines.some(l=>l.kind==='activity'&&!l.typeId)) errors.push('Cada actividad necesita un tipo.');
          return {complexity,params,lines,totals,errors};
        }

        async saveEstimacion(){
          if(!this.isDev()||this._busy) return;
          const d=this.state.estDraft, p=this.proyecto(); if(!d||!p) return;
          const c=this.estDraftCalc(d);
          if(c.errors.length){ this.setState({modal:{type:'aviso',title:'Revisa la estimación',mensaje:c.errors.join(' ')},form:{}}); return; }
          this._busy=true;
          this.setState({saveStatus:'saving'});
          const patchDraft=patch=>this.setState(s=>s.estDraft&&s.estDraft.id===d.id?{estDraft:{...s.estDraft,...patch}}:null);
          try{
            const sb=this._sb;
            const requirementId=d.requirementId||'';
            const header={ project_id:p.id, requirement_id:requirementId||null, code:(d.code||'').trim(), estimated_on:d.estimatedOn,
              client_name:(d.clientName||'').trim(), initiative_name:(d.initiativeName||'').trim(), requester_name:(d.requesterName||'').trim(), pm_name:(d.pmName||'').trim(),
              version_label:(d.versionLabel||'').trim(), complexity_id:d.complexityId, rounding_decimals:c.params.decimals,
              deviation_alert_ratio:c.params.alertRatio, daily_hours:c.params.dailyHours, dedication:c.params.dedication, updated_at:new Date().toISOString() };
            if(d.isNew){
              const { error } = await sb.from('estimations').insert({ id:d.id, created_by:this.state.session.user.id, status:'creada', ...header });
              if(error) throw error;
              patchDraft({isNew:false, estStatus:'creada'});
            } else {
              const { error } = await sb.from('estimations').update(header).eq('id',d.id);
              if(error) throw error;
            }
            // Si algo falla a mitad, las líneas que este editor alcanzó a escribir siguen contando como suyas.
            const knownIds=[...new Set([...d.savedLineIds,...d.lines.map(l=>l.id)])];
            patchDraft({savedLineIds:knownIds});
            await this.saveEstimationLines(d.id,c.lines,d.savedLineIds);
            if(requirementId&&d.updateReqHours){
              const { error } = await sb.from('requirements').update({estimated_hours:Math.round(c.totals.developer*100)/100}).eq('id',requirementId);
              if(error) throw error;
            }
            this.setState(s=>{
              const cur=s.estDraft;
              if(!cur||cur.id!==d.id) return {saveStatus:'saved'};
              return {saveStatus:'saved', estDraft:{...cur, isNew:false, estStatus:cur.estStatus||'creada', savedLineIds:d.lines.map(l=>l.id), dirty:cur.rev!==d.rev}};
            });
            await this.loadData();
          }catch(e){ console.error(e); this.setState({saveStatus:'error',modal:{type:'aviso',title:'No se pudo guardar la estimación',mensaje:e.message||'Intenta de nuevo.'},form:{}}); }
          finally{ this._busy=false; }
        }
        // Conserva el id de cada línea y borra solo las que este editor conocía y ya no están.
        // sort_order es único por estimación y Postgres lo valida fila por fila: si un orden nuevo choca
        // con el de otra línea (subir, bajar, insertar en medio), primero se pasan todas a valores negativos.
        async saveEstimationLines(estimationId,lines,knownIds){
          const sb=this._sb;
          const { data:dbRows, error:readError } = await sb.from('estimation_lines').select('id,sort_order').eq('estimation_id',estimationId);
          if(readError) throw readError;
          const currentIds=new Set(lines.map(l=>l.id));
          const removed=(dbRows||[]).filter(r=>knownIds.includes(r.id)&&!currentIds.has(r.id)).map(r=>r.id);
          if(removed.length){ const { error } = await sb.from('estimation_lines').delete().in('id',removed); if(error) throw error; }
          if(!lines.length) return;
          const rows=lines.map((l,i)=>({ id:l.id, estimation_id:estimationId, sort_order:i+1, line_kind:l.kind,
            activity_type_id:l.kind==='activity'?l.typeId:null, concept:(l.concept||'').trim(), developer_hours:l.kind==='activity'&&l.hours!==''?l.hours:null }));
          const kept=(dbRows||[]).filter(r=>!removed.includes(r.id)), holder={};
          kept.forEach(r=>{ holder[r.sort_order]=r.id; });
          if(rows.some(r=>holder[r.sort_order]&&holder[r.sort_order]!==r.id)){
            const base=kept.reduce((m,r)=>Math.max(m,Math.abs(r.sort_order)),rows.length)+1;
            const { error } = await sb.from('estimation_lines').upsert(rows.map((r,i)=>({...r,sort_order:-(base+i)})));
            if(error) throw error;
          }
          const { error } = await sb.from('estimation_lines').upsert(rows);
          if(error) throw error;
        }
        // Creada al guardar. Enviada es el paso siguiente. Aprobar abre el requerimiento para poner sus PBI.
        openRequirementFromEstimation(){
          const d=this.state.estDraft; if(!d||d.requirementId) return;
          const c=this.estDraftCalc(d);
          const hours=Math.round(c.totals.developer*100)/100;
          const title=(d.initiativeName||'').trim()||'Requerimiento';
          const pm=(d.pmName||'').trim();
          this.openModal({
            type:'requerimiento', mode:'crear', title:'Crear requerimiento', fromEstimacionId:d.id,
            form:{
              codigos:[''],
              titulo:title, descripcionCambios:title, observaciones:'',
              fechaEntregaUsuario:'', fechaPasoProduccion:'',
              horas:Number.isFinite(hours)?hours:'',
              responsables:pm?[pm]:[],
              estado:this.estimationStatusId(),
            },
          });
        }
        async advanceEstimacion(next){
          if(!this.isDev()||this._busy) return;
          const d=this.state.estDraft, p=this.proyecto(); if(!d||!p||d.isNew||d.dirty) return;
          const order=['creada','enviada','aprobada'];
          if(order.indexOf(next)!==order.indexOf(d.estStatus)+1) return;
          if(next==='aprobada' && !d.requirementId){ this.openRequirementFromEstimation(); return; }
          this._busy=true;
          this.setState({saveStatus:'saving'});
          try{
            const patch={ status:next, updated_at:new Date().toISOString() };
            const { error } = await this._sb.from('estimations').update(patch).eq('id', d.id);
            if(error) throw error;
            this.setState(s=>{
              const cur=s.estDraft;
              if(!cur||cur.id!==d.id) return {saveStatus:'saved'};
              return {saveStatus:'saved', estDraft:{...cur, estStatus:next}};
            });
            await this.loadData();
          }catch(e){ console.error(e); this.setState({saveStatus:'error', modal:{type:'aviso', title:'No se pudo cambiar el estado', mensaje:e.message||'Intenta de nuevo.'}, form:{}}); }
          finally{ this._busy=false; }
        }
        // Copia cabecera y líneas con ids nuevos. La copia nace en Creada, sin requerimiento, hasta que se apruebe.
        async dupEstimacion(id){
          if(!this.isDev()||this._busy) return;
          const p=this.proyecto(), e=p&&(p.estimaciones||[]).find(x=>x.id===id); if(!e) return;
          this._busy=true;
          this.setState({saveStatus:'saving'});
          try{
            const sb=this._sb, newId=this.gid('est');
            const family=x=>(x.codigo||x.iniciativa||'').trim().toLowerCase();
            const used=new Set(p.estimaciones.filter(x=>family(x)===family(e)).map(x=>(x.version||'').trim().toLowerCase()));
            let version=this.nextVersionLabel(e.version);
            while(used.has(version.toLowerCase())) version=this.nextVersionLabel(version);
            const { error } = await sb.from('estimations').insert({ id:newId, project_id:p.id, requirement_id:null, status:'creada', code:e.codigo, format_version:e.formatVersion,
              estimated_on:e.fecha||this.todayIso(), client_name:e.cliente, initiative_name:e.iniciativa, requester_name:e.solicitante, pm_name:e.pm,
              version_label:version, complexity_id:e.complexityId, rounding_decimals:e.decimales, deviation_alert_ratio:e.umbral, daily_hours:e.horasDia,
              dedication:e.dedicacion, created_by:this.state.session.user.id, updated_at:new Date().toISOString() });
            if(error) throw error;
            if(e.lineas.length){
              const { error:linesError } = await sb.from('estimation_lines').insert(e.lineas.map((l,i)=>({ id:this.gid('eln'), estimation_id:newId, sort_order:i+1,
                line_kind:l.kind, activity_type_id:l.kind==='activity'?l.typeId:null, concept:l.concepto, developer_hours:l.kind==='activity'?l.horas:null })));
              if(linesError){ await sb.from('estimations').delete().eq('id',newId); throw linesError; }
            }
            this.setState({saveStatus:'saved'});
            await this.loadData();
            this.openEstimacion(newId);
          }catch(err){ console.error(err); this.setState({saveStatus:'error',modal:{type:'aviso',title:'No se pudo duplicar la estimación',mensaje:err.message||'Intenta de nuevo.'},form:{}}); }
          finally{ this._busy=false; }
        }
        async delEstimacion(id){
          if(!this.isDev()||this._busy) return;
          if(!window.confirm('¿Eliminar esta estimación y todas sus actividades? Esta acción no se puede deshacer.')) return;
          this._busy=true;
          this.setState({saveStatus:'saving'});
          try{
            const { error } = await this._sb.from('estimations').delete().eq('id',id);
            if(error) throw error;
            this.setState({saveStatus:'saved'});
            await this.loadData();
          }catch(e){ console.error(e); this.setState({saveStatus:'error',modal:{type:'aviso',title:'No se pudo eliminar la estimación',mensaje:e.message||'Intenta de nuevo.'},form:{}}); }
          finally{ this._busy=false; }
        }
        // Lo que se exporta a Excel y PDF: lo que está en pantalla, aunque no se haya guardado,
        // sin las actividades vacías (sin concepto ni horas).
        estExportData(d){
          const c=this.estDraftCalc(d), types=this.state.estActivityTypes||[];
          const rows=c.lines.map((l,i)=>({...l,concept:(l.concept||'').trim(),typeLabel:(types.find(x=>x.id===l.typeId)||{}).label||l.typeId||'',m:c.totals.metrics[i]}))
            .filter(l=>l.kind==='section'||l.concept||l.hours!=='');
          const clean=v=>String(v||'').trim().replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'-');
          return {c,t:c.totals,types,rows,fileName:'estimacion-'+(clean(d.code)||clean(d.initiativeName)||'sin-nombre')+'-'+(clean(d.versionLabel)||'V1')};
        }
        async exportEstimacion(){
          if(!this.isDev()||this.state.exportingEstimacion) return;
          const d=this.state.estDraft; if(!d) return;
          this.setState({exportingEstimacion:true});
          try{
            const XLSX=await this.loadXlsx();
            const {c,t,types,rows,fileName}=this.estExportData(d);
            const n=v=>v==null||!Number.isFinite(v)?null:parseFloat(v.toFixed(4));
            const day=/^(\d{4})-(\d{2})-(\d{2})/.exec(d.estimatedOn||'');
            const dateCell=day?(Date.UTC(+day[1],+day[2]-1,+day[3])-Date.UTC(1899,11,30))/864e5:'';
            const aoa=[
              ['Estimación de esfuerzo'],[],
              ['Código',(d.code||'').trim()],['Fecha',dateCell],['Cliente',(d.clientName||'').trim()],['Iniciativa',(d.initiativeName||'').trim()],
              ['Solicitante',(d.requesterName||'').trim()],['PM',(d.pmName||'').trim()],['Versión',(d.versionLabel||'').trim()],['Complejidad',c.complexity?c.complexity.label:''],
              ['Decimales de redondeo',c.params.decimals],['Umbral de alerta',n(c.params.alertRatio)],['Horas diarias',n(c.params.dailyHours)],['Dedicación',n(c.params.dedication)],
              [],
            ];
            const fmts=[[3,1,'dd/mm/yyyy'],[13,1,'0.0%']];
            const merges=[];
            aoa.push(['Tipo','Concepto','Horas desarrollador','Optimista','Más probable','Pesimista','Estimación estadística']);
            rows.forEach(l=>{
              if(l.kind==='section'){ merges.push({s:{r:aoa.length,c:0},e:{r:aoa.length,c:6}}); aoa.push([l.concept]); return; }
              const m=l.m;
              aoa.push([l.typeLabel,l.concept,l.hours===''?null:l.hours,m?n(m.optimistic):null,m?n(m.mostProbable):null,m?n(m.pessimistic):null,m?n(m.statistical):null]);
            });
            aoa.push(['','Subtotal',n(t.developer),null,null,null,n(t.statistical)]);
            aoa.push([],['Totales']);
            aoa.push(['Subtotal horas desarrollador',n(t.developer)],['Subtotal estimación estadística',n(t.statistical)],['Horas dedicadas por día',n(t.dedicated)]);
            aoa.push(['Entrega estimada (días)',t.statisticalDays==null?null:parseFloat(t.statisticalDays.toFixed(2))]);
            aoa.push(['Días según horas de desarrollador',t.developerDays==null?null:parseFloat(t.developerDays.toFixed(2))]);
            aoa.push(['Actividades en alerta',t.review],[]);
            aoa.push(['Horas por tipo','Horas','% del subtotal desarrollador']);
            types.forEach(x=>{ const h=t.byType[x.id]||0; fmts.push([aoa.length,2,'0.0%']); aoa.push([x.label,n(h),t.developer>0?h/t.developer:0]); });
            const ws=XLSX.utils.aoa_to_sheet(aoa);
            fmts.forEach(([r,col,z])=>{ const cell=ws[XLSX.utils.encode_cell({r,c:col})]; if(cell&&cell.t==='n') cell.z=z; });
            ws['!merges']=merges;
            ws['!cols']=[{wch:32},{wch:62},{wch:20},{wch:11},{wch:13},{wch:11},{wch:22}];
            const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Estimación');
            XLSX.writeFile(wb,fileName+'.xlsx');
          }catch(e){ console.error(e); this.setState({modal:{type:'aviso',title:'No se pudo generar el Excel',mensaje:e.message||'Intenta de nuevo.'},form:{}}); }
          finally{ this.setState({exportingEstimacion:false}); }
        }
        // PDF sin librerías: una vista imprimible en otra ventana y el diálogo de impresión, donde se elige "Guardar como PDF".
        // El título de esa ventana es el nombre que el navegador propone para el archivo.
        exportEstimacionPdf(){
          if(!this.isDev()) return;
          const d=this.state.estDraft; if(!d) return;
          const w=window.open('','_blank');

                  copy:()=>this.copyToClipboard(l.url,k),
                  copyTitle: copied?'Copiado':'Copiar URL',
                  copyIconHref: copied?'#ic-check':'#ic-copy',
                  copyColor: copied?'#39d39b':'var(--gp-muted)',
                  open:()=>this.openExt(l.url) };
              });
              R.addGithubLinkRow=()=>this.addGithubLinkRow();
            }
            if(md.type==='credenciales'){
              const rows=s.form.credRows||[];
              const credEnvOptions=[{value:'',label:'— General (sin ambiente)'}].concat(ambienteOptions);
              R.form.credRows=rows.map((c,i)=>{
                const shown=!!s.modalShowPass['cred-'+i];
                return { label:c.label||'', environmentId:c.environmentId||'', username:c.username||'', secret:c.secret||'', url:c.url||'', notes:c.notes||'',
                  envOptions:credEnvOptions,
                  onLabel:(e)=>this.setCredRow(i,'label',e.target.value),
                  onEnv:(e)=>this.setCredRow(i,'environmentId',e.target.value),
                  onUsername:(e)=>this.setCredRow(i,'username',e.target.value),
                  onSecret:(e)=>this.setCredRow(i,'secret',e.target.value),
                  onUrl:(e)=>this.setCredRow(i,'url',e.target.value),
                  onNotes:(e)=>this.setCredRow(i,'notes',e.target.value),
                  secretType: shown?'text':'password',
                  eyeHref: shown?'#ic-eye-off':'#ic-eye',
                  toggleSecret:()=>this.toggleModalShowPass('cred-'+i),
                  canRemove: rows.length>1, remove:()=>this.removeCredRow(i) };
              });
              R.addCredRow=()=>this.addCredRow();
            }
            if(md.type==='desplegable'){
              const sel=s.form.instruccionIds||[];
              const inss=(emp&&emp.instrucciones)||[];
              R.desplegableSinInstrucciones=!inss.length;
              R.desplegableInstrucciones=inss.map(i=>{
                const on=sel.includes(i.id);
                return { text:i.text, toggle:()=>this.toggleDesplegableInstruccion(i.id),
                         bg: on?'rgba(53,192,240,.10)':'var(--gp-field)',
                         border: on?'rgba(53,192,240,.45)':'var(--gp-line-20)',
                         boxBorder: on?'#35c0f0':'var(--gp-line-25)',
                         boxBg: on?'#35c0f0':'transparent',
                         iconHref: on?'#ic-check':'#ic-x',
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type==='componentes'){
              const sel=s.form.desplegableIds||[];
              const opts=(emp&&emp.desplegables)||[];
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const kindMeta=(k)=> k==='gateway' ? ['Gateway','#a78bfa','rgba(167,139,250,.16)']
                                 : k==='app'     ? ['App','#f5b544','rgba(245,181,68,.16)']
                                 :                 ['API','#35c0f0','rgba(53,192,240,.16)'];
              R.componentesOpcionesEmpty=!opts.length;
              R.componentesOpciones=opts.map(d=>{
                const on=sel.includes(d.id), meta=kindMeta(d.kind), srv=srvById[d.serverId];
                return { titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                         kindLabel:meta[0], kindColor:meta[1], kindBg:meta[2],
                         toggle:()=>this.toggleProyDesplegable(d.id),
                         bg: on?'rgba(53,192,240,.10)':'var(--gp-field)',
                         border: on?'rgba(53,192,240,.45)':'var(--gp-line-20)',
                         boxBorder: on?'#35c0f0':'var(--gp-line-25)',
                         boxBg: on?'#35c0f0':'transparent',
                         iconHref: on?'#ic-check':'#ic-x',
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type==='correo'){
              // Wizard de correo de despliegue: selección (Tarea 9). La Tarea 10 agrega vista previa + mailto a este mismo bloque.
              const f=s.form||{};
              const ambs=(emp&&emp.ambientes)||[];
              const deps=(emp&&emp.desplegables)||[];
              const proys=(emp&&emp.proyectos)||[];
              const ctos=(emp&&emp.contactos)||[];
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const sel=f.itemIds||[];
              const ambSel=ambs.find(a=>a.id===f.envId);
              const box=(on)=>({ boxBorder: on?'#35c0f0':'var(--gp-line-25)', boxBg: on?'#35c0f0':'transparent',
                                 iconHref: on?'#ic-check':'#ic-x', color: on?'var(--gp-text)':'var(--gp-muted)',
                                 bg: on?'rgba(53,192,240,.10)':'var(--gp-field)', border: on?'rgba(53,192,240,.45)':'var(--gp-line-20)' });
              const itemRow=(d)=>{ const srv=srvById[d.serverId];
                return Object.assign({ titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                                       toggle:()=>this.toggleCorreoItem(d.id) }, box(sel.includes(d.id))); };

              R.correoAmbientes=ambs.map(a=>{ const on=a.id===f.envId;
                return { code:a.code, pick:()=>this.setCorreoAmbiente(a.id),
                         bg: on?'rgba(53,192,240,.14)':'var(--gp-field)', border: on?'#35c0f0':'var(--gp-line-20)',
                         color: on?'#35c0f0':'var(--gp-muted)' }; });
              R.correoCarpetaFalta = !!(ambSel && !ambSel.deployFolder);

              const proySel=f.proyectoIds||[];
              R.correoProyectos=proys.map(p=>{
                const on=proySel.includes(p.id);
                const mios=deps.filter(d=>(p.desplegableIds||[]).includes(d.id));
                return Object.assign({ nombre:p.nombre, on, sinComponentes: on && !mios.length,
                                       toggle:()=>this.toggleCorreoProyecto(p.id),
                                       pickApi:()=>this.setCorreoProyectoKind(p.id,'api'),
                                       pickGateway:()=>this.setCorreoProyectoKind(p.id,'gateway'),
                                       pickAmbos:()=>this.setCorreoProyectoKind(p.id,'ambos'),
                                       items: mios.map(itemRow) }, box(on));
              });

              const enAlgunProyecto=new Set();
              proys.forEach(p=>(p.desplegableIds||[]).forEach(id=>enAlgunProyecto.add(id)));
              const otros=deps.filter(d=>!enAlgunProyecto.has(d.id));
              R.correoOtrosEmpty=!otros.length;
              R.correoOtrosHay=!!otros.length;
              R.correoOtros=otros.map(d=>Object.assign(itemRow(d), {rowBg: sel.includes(d.id)?'rgba(53,192,240,.10)':'transparent'}));

              // Panel colapsable de "otros desplegables": resumen de lo marcado en el botón.
              const abiertos=s.correoOpen||{};
              const chevron=(on)=> on?'rotate(-90deg)':'rotate(90deg)';
              const otrosSel=otros.filter(d=>sel.includes(d.id));
              R.correoOtrosOpen=!!abiertos.otros;
              R.correoOtrosChevron=chevron(!!abiertos.otros);
              R.toggleCorreoOtros=()=>this.toggleCorreoPanel('otros');
              R.correoOtrosConteo=otrosSel.length+'/'+otros.length;
              R.correoOtrosResumen= otrosSel.length ? otrosSel.map(d=>d.name+(d.port?(':'+d.port):'')).join(', ') : 'Ninguno seleccionado';
              R.correoOtrosResumenColor= otrosSel.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoOtrosBorder= otrosSel.length?'rgba(53,192,240,.45)':'var(--gp-line-22)';

              R.correoContactosEmpty=!ctos.length;
              R.correoContactosHay=!!ctos.length;
              // Destinatarios en dos desplegables (Para / CC). toggleCorreoContacto ya impide que un
              // contacto quede en los dos campos a la vez.
              const ctoRow=(k,field)=>{
                const on=(f[field==='to'?'toIds':'ccIds']||[]).includes(k.id);
                return Object.assign({ name:k.name, email:k.email, toggle:()=>this.toggleCorreoContacto(k.id,field),
                                       rowBg: on?(field==='to'?'rgba(53,192,240,.10)':'rgba(167,139,250,.10)'):'transparent' },
                                     box(on));
              };
              R.correoContactosTo=ctos.map(k=>ctoRow(k,'to'));
              R.correoContactosCc=ctos.map(k=>ctoRow(k,'cc'));
              const nombresDe=(ids)=>ctos.filter(k=>(ids||[]).includes(k.id)).map(k=>k.name);
              const nomTo=nombresDe(f.toIds), nomCc=nombresDe(f.ccIds);
              R.correoToOpen=!!abiertos.to; R.correoCcOpen=!!abiertos.cc;
              R.correoToChevron=chevron(!!abiertos.to); R.correoCcChevron=chevron(!!abiertos.cc);
              R.toggleCorreoTo=()=>this.toggleCorreoPanel('to');
              R.toggleCorreoCc=()=>this.toggleCorreoPanel('cc');
              R.correoToResumen= nomTo.length ? nomTo.join(', ') : 'Sin destinatarios';
              R.correoToResumenColor= nomTo.length?'var(--gp-text-2)':'#f5b544';
              R.correoToBorder= nomTo.length?'rgba(53,192,240,.45)':'rgba(245,181,68,.45)';
              R.correoCcResumen= nomCc.length ? nomCc.join(', ') : 'Nadie en copia';
              R.correoCcResumenColor= nomCc.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoCcBorder= nomCc.length?'rgba(167,139,250,.45)':'var(--gp-line-22)';
              R.setCorreoNota=(e)=>this.setCorreoNota(e);

              // --- Vista previa y mailto (Tarea 10) ---
              const p=this.correoPayload();
              const url=this.correoMailtoUrl(p);
              const falta=[];
              if(!f.envId) falta.push('elige un ambiente');
              if(!p.itemsCount) falta.push('marca al menos un desplegable');
              if(!p.to.length) falta.push('agrega al menos un destinatario en Para');
              const puede=!falta.length;
              const copiado=s.copiedKey==='correo-cuerpo';
              R.correoAsunto=p.subject;
              R.correoCuerpo=p.body;
              R.correoChars=url.length+' / 2048 caracteres';
              R.correoCharsColor= url.length>1900 ? '#f5b544' : 'var(--gp-muted-2)';
              R.correoLargo= url.length>1900;
              R.correoBloqueo= falta.length ? ('Para poder abrir el correo: '+falta.join(', ')+'.') : '';
              R.correoBloqueoShow=!!falta.length;
              R.correoNoPuede=!puede;
              R.correoBtnBg= puede ? 'linear-gradient(135deg,#2b3bd6,#23a9e0)' : 'var(--gp-line-14)';
              R.correoBtnColor= puede ? '#fff' : 'var(--gp-muted-2)';
              R.correoBtnCursor= puede ? 'pointer' : 'not-allowed';
              R.abrirCorreo=()=>this.abrirCorreo();
              R.copiarCorreoCuerpo=()=>this.copiarCorreoCuerpo();
              R.correoCopyLabel= copiado ? 'Copiado' : 'Copiar cuerpo';
              R.correoCopyIcon= copiado ? '#ic-check' : '#ic-copy';
              R.correoCopyColor= copiado ? '#39d39b' : 'var(--gp-text-2)';
              R.setCorreoCuerpo=(e)=>this.setCorreoCuerpo(e);
            }
            // --- Fin wizard de correo de despliegue (Tarea 9/10). ---
          }
          return R;
        }
      }
    </script>
  </body>
</html>
