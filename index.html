<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles/base.css" />
    <link rel="stylesheet" href="./styles/controls.css" />
    <link rel="stylesheet" href="./styles/master-board.css" />

    <link rel="stylesheet" href="./styles/assignee.css" />
    <link rel="stylesheet" href="./styles/dark-mode.css" />
    <script src="./config.js"></script>
    <script>
      (() => {
        const { cdn } = window.APP_CONFIG;
        cdn.preconnect.forEach(({ href, crossOrigin }) => {
          const link = document.createElement("link");
          link.rel = "preconnect";
          link.href = href;
          if (crossOrigin) link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        });
        const fonts = document.createElement("link");
        fonts.rel = "stylesheet";
        fonts.href = cdn.fonts;
        document.head.appendChild(fonts);
        const appendScript = (src, async) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = async;
          document.head.appendChild(script);
        };
        appendScript(cdn.supabase, false);
        appendScript(cdn.redoc, true);
      })();
    </script>
    <script src="./constants.js"></script>
    <script src="./boardExtended.js"></script>
    <script src="./estimationMath.js"></script>
    <script src="./root/mixins.js"></script>
    <script src="./root/format.js"></script>
    <script src="./root/navigation.js"></script>
    <script src="./root/auth.js"></script>
    <script src="./root/data.js"></script>
    <script src="./root/maestro.js"></script>
    <script src="./root/empresaConfig.js"></script>
    <script src="./root/apiDoc.js"></script>
    <script src="./root/modal.js"></script>
    <script src="./root/promote.js"></script>
    <script src="./root/correo.js"></script>
    <script src="./root/requerimiento.js"></script>
    <script src="./root/archivos.js"></script>
    <script src="./support.js"></script>
    <script>
      try {
        const { THEME } = window.APP_CONSTANTS;
        const theme =
          localStorage.getItem(THEME.storageKey) ||
          localStorage.getItem(THEME.defaultStorageKey);
        if (theme === THEME.dark)
          document.documentElement.classList.add(THEME.darkClass);
      } catch (e) {}
    </script>

              x1="440"
              y1="290"

              y2="510"

                      font-size: 13px;

          </header>

          <sc-if value="{{ showSecondBar }}" hint-placeholder-val="{{ false }}">
            <div
              style="

                top: 64px;
                z-index: 39;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 clamp(16px, 3vw, 34px);
                height: 44px;

                backdrop-filter: blur(14px);

            >

                  align-items: center;

                  border: 0;
                  padding: 6px 4px;
                  color: var(--gp-muted);
                  font-size: 13px;
                  cursor: pointer;
                  white-space: nowrap;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  max-width: 45%;
                "
              >
                <svg
                  width="14"
                  height="14"

                >
                  <use href="#ic-chevron"></use>
                </svg>
                <span style="overflow: hidden; text-overflow: ellipsis"
                  >{{ backCrumbLabel }}</span

              </button>
              <span style="color: var(--gp-faint); flex: none">/</span>
              <span
                style="
                  flex: 1;
                  min-width: 0;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                  color: var(--gp-text);
                  font-size: 13.5px;
                  font-weight: 600;
                "
                >{{ currentCrumbLabel }}</span
              >
            </div>
          </sc-if>

          <main
            style="flex:1;padding:clamp(20px,3.2vw,40px) clamp(16px,3vw,44px) 80px;max-width:{{ mainMaxW }};width:100%;margin:0 auto"
          >

              <dc-import name="Empresas"
                empresasList="{{ empresasList }}"
              />
            </sc-if>

              />

              />

            <sc-if
              value="{{ viewRequerimiento }}"
              hint-placeholder-val="{{ true }}"

            <sc-if value="{{ viewEstimacion }}" hint-placeholder-val="{{ false }}">
              <dc-import name="Estimacion"

          <sc-if value="{{ modalOpen }}" hint-placeholder-val="{{ false }}">
            <div
              onClick="{{ overlayClick }}"
              onPointerDown="{{ overlayDown }}"
              class="modal-ov"
              style="
                position: fixed;
                inset: 0;
                z-index: 100;
                background: var(--gp-night-72);
                backdrop-filter: blur(4px);

                align-items: center;
                justify-content: center;
                padding: 20px;
                animation: ovIn 0.18s ease;

            >

                onClick="{{ stop }}"
                onPointerDown="{{ stop }}"

                style="width:100%;max-width:{{ modalWidth }};background:var(--gp-surface);border:1px solid var(--gp-line-20);border-radius:18px;box-shadow:0 30px 80px -20px var(--gp-black-70);animation:shIn .24s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow:auto"
              >

                    gap: 16px;
                    padding: 20px 22px 16px;
                    border-bottom: 1px solid var(--gp-line-16);
                    position: sticky;
                    top: 0;
                    background: var(--gp-surface);
                    z-index: 2;
                  "
                >
                  <div style="min-width: 0">

                      style="

                      hint-placeholder-val="{{ false }}"

                        style="

    <script type="text/x-dc" data-dc-script>
      const { VIEW, REQ_TAB, PROJECTS_VIEW, FILTER_ALL, SAVE_STATUS, SEND_STATUS, THEME, LOCALE, NARROW_MAX_WIDTH, PASSWORD_INPUT, ICON, ESTIMATION_PHASE, ESTIMATION_PHASE_ORDER, ESTIMATION_DECIMAL_OPTIONS, ESTIMATION_LINE_KIND, ESTIMATION_ACTIVITY_TYPE, ESTIMATION_DEFAULTS, ESTIMATION_MAX_DAILY_HOURS, MODAL, MODAL_MODE, FIELD_KIND, INPUT_TYPE, TABLE, REQUIREMENT_FILE, FILE_NAME, COPY_KEY, SHOW_PASS_KEY, AUTH_EVENT, ID_PREFIX, REQ_STATUS, MASTER_STATUS_GROUP, STATUS_LABEL_HINT, DEPLOYABLE_KIND, EMAIL_KIND_FILTER, EMAIL_FIELD, EMAIL_PANEL, MAILTO_WARN_LENGTH, CREDENTIAL_GROUP, DB_DEFAULT, EXCEL } = window.APP_CONSTANTS;
      const { dropFloatNoise, excelRoundUp, lineMetrics, activityWithHoursMetrics, estimationTotals } = window.ESTIMATION_MATH;

      class Component extends DCLogic {
        constructor(props){
          super(props);
          this.state = {
            view:VIEW.companies, empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null,
            estComplexities:[], estActivityTypes:[], currentUserName:'', exportingEstimacion:false, estUploading:false, exportHourScenario:'mostProbable', estCounter:{lineId:null,count:'1'},
            reqTab:REQ_TAB.documents, filter:FILTER_ALL, modal:null, form:{},
            projectsView:PROJECTS_VIEW.grid, reqSelectMode:false, reqSelected:{},
            maestroSearch:'', maestroStatus:FILTER_ALL, maestroProject:FILTER_ALL, maestroProjectMenuOpen:false, maestroStatusMenuOpen:false, maestroEstMenu:null, exportingExcel:false,
            apiUrlInput:'', apiErr:'', apiHasRender:false,
            session:null, authChecked:false, profileRole:null, devProfiles:[], pmProfiles:[],
            loginEmail:'', loginPassword:'', loginError:'', loginNotice:'', loginLoading:false,
            recoveryMode:false, recoveryPass1:'', recoveryPass2:'', recoveryError:'', recoveryLoading:false,
            showLoginPass:false, showRecoveryPass1:false, showRecoveryPass2:false, modalShowPass:{},
            data:[], statuses:[], dataLoaded:false, loadError:'', copiedKey:'', userMenuOpen:false, apiFullscreen:false, credShown:{},
            documentFileName:'',
            correoOpen:{},
            narrow: (typeof window!=='undefined' && window.innerWidth<=NARROW_MAX_WIDTH),
          };
        }

        componentDidMount(){
          this._sb = window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
          );
          this._sb.auth.getSession().then(({data})=>{
            this.setState({session:data.session, authChecked:true});
            if(data.session) this.afterLogin();
          });
          this._authSub = this._sb.auth.onAuthStateChange((evt, session)=>{
            if(evt===AUTH_EVENT.passwordRecovery){ this.setState({session, authChecked:true, recoveryMode:true}); return; }
            const had=this.state.session;
            this.setState({session, authChecked:true});
            if(session && !had && !this.state.recoveryMode){ this.afterLogin(); }
            else if(!session){ this.setState({data:[], dataLoaded:false, profileRole:null, devProfiles:[], pmProfiles:[], view:VIEW.companies, empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null}); }
          });
          this._onResize=()=>{
            const n=window.innerWidth<=NARROW_MAX_WIDTH;
            if(n!==this.state.narrow) this.setState({narrow:n});
          };
          window.addEventListener('resize', this._onResize);
          this._onFsChange=()=>{ const fs=!!document.fullscreenElement; if(fs!==this.state.apiFullscreen) this.setState({apiFullscreen:fs}); };
          document.addEventListener('fullscreenchange', this._onFsChange);
          this._onBeforeUnload=(e)=>this.warnBeforeUnloadIfEstimacionUnsaved(e);
          window.addEventListener('beforeunload', this._onBeforeUnload);
        }
        warnBeforeUnloadIfEstimacionUnsaved(e){ if(this.estDirty()){ e.preventDefault(); e.returnValue=''; } }
        componentWillUnmount(){
          if(this._authSub && this._authSub.data) this._authSub.data.subscription.unsubscribe();
          window.removeEventListener('resize', this._onResize);
          document.removeEventListener('fullscreenchange', this._onFsChange);
          window.removeEventListener('beforeunload', this._onBeforeUnload);
        }

        estDefaultTypeId(){ const types=this.state.estActivityTypes||[]; return (types.find(t=>t.id===ESTIMATION_DEFAULTS.activityTypeId)||types[0]||{}).id||ESTIMATION_DEFAULTS.activityTypeId; }
        estimationStatusId(){
          const list=this.state.statuses||[];
          const byId=list.find(st=>String(st.id||'').toLowerCase()===REQ_STATUS.estimation);
          if(byId) return byId.id;
          const byLabel=list.find(st=>String(st.label||'').toLocaleLowerCase(LOCALE).includes(STATUS_LABEL_HINT.estimationStrict));
          return byLabel?byLabel.id:REQ_STATUS.estimationFallback;
        }
        estPhaseMeta(status){
          if(status===ESTIMATION_PHASE.sent) return {label:'Enviada', color:'var(--gp-amber)', bg:'var(--gp-amber-14)'};
          if(status===ESTIMATION_PHASE.approved) return {label:'Aprobada', color:'var(--gp-green)', bg:'var(--gp-green-14)'};
          return {label:'Creada', color:'var(--gp-cyan)', bg:'var(--gp-cyan-14)'};
        }
        estDirty(){ const s=this.state; return s.view===VIEW.estimation&&!!(s.estDraft&&s.estDraft.dirty); }
        leaveEstimacion(go){ if(this.estDirty()&&!window.confirm('Hay cambios sin guardar en esta estimación. ¿Salir sin guardar?')) return; go(); }

        newEstimacion(){
          if(!this.isDev()) return;
          const emp=this.empresa(), p=this.proyecto(); if(!p) return;
          const cx=this.state.estComplexities||[];
          const line=(kind,typeId,concept,hours='')=>({id:this.gid(ID_PREFIX.estimationLine),kind,typeId,concept,hours,autoNext:kind===ESTIMATION_LINE_KIND.activity&&!concept});
          const lines=[
            line(ESTIMATION_LINE_KIND.section,'','Análisis'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.analysis,'Estimación del esfuerzo del desarrollo de la aplicación.','1'),
            line(ESTIMATION_LINE_KIND.section,'',''),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.development,''),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.architecture,'Arquitectura del requerimiento.'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.qa,'Pruebas, documento y evidencias de la funcionalidad.'),
            line(ESTIMATION_LINE_KIND.section,'','Despliegue del proyecto'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.development,'Despliegue de la aplicación en ambiente de pruebas y producción','3'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.manuals,'Documentación del API','2'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.manuals,'Manual de usuario','2'),
            line(ESTIMATION_LINE_KIND.activity,ESTIMATION_ACTIVITY_TYPE.management,'Gestión de proyecto, sesiones con cliente, seguimiento.'),
          ];
          const estDraft={ id:this.gid(ID_PREFIX.estimation), isNew:true, dirty:false, rev:0, savedLineIds:[],
            code:'', estimatedOn:this.todayIso(), clientName:(emp&&emp.nombre)||'', initiativeName:'', applicationName:p.nombre||'', requesterName:'', pmName:this.isPM()?(this.state.currentUserName||''):'',
            versionLabel:ESTIMATION_DEFAULTS.versionLabel, complexityId:(cx.find(c=>c.id===ESTIMATION_DEFAULTS.complexityId)||cx[0]||{}).id||ESTIMATION_DEFAULTS.complexityId, estStatus:ESTIMATION_PHASE.created, requirementId:'',
            roundingDecimals:ESTIMATION_DEFAULTS.roundingDecimals, alertRatio:ESTIMATION_DEFAULTS.alertRatio, dailyHours:ESTIMATION_DEFAULTS.dailyHours, dedicationPct:ESTIMATION_DEFAULTS.dedicationPct, additionalMarkdown:'', additionalFileName:'', lines };
          this.setState(s=>({view:VIEW.estimation,estimacionId:estDraft.id,estDraft,estCounter:{...s.estCounter,lineId:null}}));
        }
        openEstimacion(id){
          if(!this.isDev()) return;
          const p=this.proyecto(), e=p&&(p.estimaciones||[]).find(x=>x.id===id); if(!e) return;
          const estDraft=this.estDraftFromSaved(e,p);
          this.setState(s=>({view:VIEW.estimation,estimacionId:id,estDraft,estCounter:{...s.estCounter,lineId:null}}));
        }
        estDraftFromSaved(e,p){
          const num=v=>this.fmtNum(Number(v));
          return { id:e.id, isNew:false, dirty:false, rev:0, savedLineIds:e.lineas.map(l=>l.id),
            code:e.codigo, estimatedOn:e.fecha||this.todayIso(), clientName:e.cliente, initiativeName:e.iniciativa, applicationName:(e.aplicacion||'').trim()||p.nombre||'', requesterName:e.solicitante, pmName:e.pm,
            versionLabel:e.version, complexityId:e.complexityId, estStatus:e.estado||ESTIMATION_PHASE.created, requirementId:e.requirementId,
            roundingDecimals:String(e.decimales), alertRatio:num(e.umbral), dailyHours:num(e.horasDia), dedicationPct:num(e.dedicacion*100), additionalMarkdown:e.adicional||'', additionalFileName:'',
            lines:e.lineas.map(l=>({id:l.id,kind:l.kind,typeId:l.typeId,concept:l.concepto,hours:l.horas==null?'':String(l.horas),autoNext:l.kind===ESTIMATION_LINE_KIND.activity&&!l.concepto})) };
        }
        editEstDraft(fn,done){ this.setState(s=>{ const d=s.estDraft; if(!d) return null; const next=fn(d); return next?{estDraft:{...next,dirty:true,rev:(d.rev||0)+1}}:null; },done); }
        setEstField(key,value){ this.editEstDraft(d=>({...d,[key]:value})); }
        loadAdditionalMarkdown(e){
          const input=e.target, file=input.files&&input.files[0];
          if(!file) return;
          const reader=new FileReader();
          reader.onload=()=>{ this.editEstDraft(d=>({...d, additionalMarkdown:String(reader.result||''), additionalFileName:file.name})); input.value=''; };
          reader.onerror=()=>{ input.value=''; this.setState({modal:{type:MODAL.notice,title:'No se pudo leer el archivo',mensaje:'Elige un archivo de texto Markdown (.md).'},form:{}}); };
          reader.readAsText(file);
        }
        clearAdditionalMarkdown(){ this.editEstDraft(d=>({...d, additionalMarkdown:'', additionalFileName:''})); }
        async uploadEstimationFiles(e){
          const input=e.target, files=Array.from(input.files||[]); input.value='';
          const d=this.state.estDraft;
          if(!files.length||!d||!this.isDev()||this._busy) return;
          const notice=(title,mensaje)=>this.setState({modal:{type:MODAL.notice,title,mensaje},form:{}});
          if(d.isNew){ notice('Guarda la estimación','Guarda la estimación antes de adjuntar documentos.'); return; }
          try{ files.forEach(file=>this.requirementFileContentType(file)); }
          catch(err){ notice('Archivo no permitido',err.message); return; }
          this._busy=true;
          this.setState({estUploading:true,saveStatus:SAVE_STATUS.saving});
          const owner=this.estimationDocOwner(d.id);
          let uploaded=0;
          try{
            for(const file of files){ await this.uploadS3Document(owner,file); uploaded++; }
            this.setState({saveStatus:SAVE_STATUS.saved});
          }catch(err){

        additionalMarkdownBlocks(src){

            const line=lines[i];
            if(/^\s*```/.test(line)){
              const buf=[]; i++;
              while(i<lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; }
              if(i<lines.length) i++;
              blocks.push({type:'code', text:buf.join('\n')});
              continue;
            }
            if(/^\s*\|/.test(line) && i+1<lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
              const cells=row=>row.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim());

              i+=2;
              const rows=[];

              blocks.push({type:'table', headers, rows});
              continue;

            const heading=/^(#{1,6})\s+(.*)$/.exec(line);

                if(!item) break;
                items.push({depth:Math.floor(item[1].replace(/\t/g,'  ').length/2), text:item[2].trim()});

              }
              blocks.push({type:'ul', items});

            }
            if(!line.trim()){ i++; continue; }
            const buf=[line.trim()];
            i++;
            while(i<lines.length && lines[i].trim() && !/^(#{1,6})\s+/.test(lines[i]) && !/^(\s*)[-*]\s+/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^\s*\|/.test(lines[i])){

        markdownInlineHtml(text){
          const esc=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
          return String(text||'').split(/(`[^`]+`)/g).map(part=>{
            if(part.length>=2 && part.startsWith('`') && part.endsWith('`')) return '<code>'+esc(part.slice(1,-1))+'</code>';
            return esc(part).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
          }).join('');
        }
        markdownListHtml(items){
          if(!items.length) return '';
          const base=items[0].depth;
          let html='<ul>', i=0;
          while(i<items.length){
            if(items[i].depth<base) break;
            const text=items[i].text;
            i++;
            const children=[];
            while(i<items.length && items[i].depth>base){ children.push(items[i]); i++; }
            html+='<li>'+this.markdownInlineHtml(text)+this.markdownListHtml(children)+'</li>';
          }
          return html+'</ul>';
        }
        additionalMarkdownHtml(src){
          const blocks=this.additionalMarkdownBlocks(src);
          if(!blocks.length) return '';

            if(block.type==='h') return '<h'+Math.min(block.level+1,4)+'>'+this.markdownInlineHtml(block.text)+'</h'+Math.min(block.level+1,4)+'>';
            if(block.type==='p') return '<p>'+this.markdownInlineHtml(block.text)+'</p>';
            if(block.type==='ul') return this.markdownListHtml(block.items);
            if(block.type==='code') return '<pre>'+String(block.text).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))+'</pre>';
            const head='<tr>'+block.headers.map(cell=>'<th>'+this.markdownInlineHtml(cell)+'</th>').join('')+'</tr>';
            const rows=block.rows.map(row=>'<tr>'+block.headers.map((_,col)=>'<td>'+this.markdownInlineHtml(row[col]||'')+'</td>').join('')+'</tr>').join('');
            return '<table class="md"><thead>'+head+'</thead><tbody>'+rows+'</tbody></table>';
          }).join('');
          return '<section class="extra">'+body+'</section>';
        }

          });
          if(current) lines.push(current);
          return lines;
        }

                  envOptions:credEnvOptions,
                  onLabel:(e)=>this.setCredRow(i,'label',e.target.value),
                  onEnv:(e)=>this.setCredRow(i,'environmentId',e.target.value),
                  onUsername:(e)=>this.setCredRow(i,'username',e.target.value),
                  onSecret:(e)=>this.setCredRow(i,'secret',e.target.value),
                  onUrl:(e)=>this.setCredRow(i,'url',e.target.value),
                  onNotes:(e)=>this.setCredRow(i,'notes',e.target.value),
                  secretType: this.passwordInputType(shown),
                  eyeHref: this.passwordToggleIcon(shown),
                  toggleSecret:()=>this.toggleModalShowPass(SHOW_PASS_KEY.credentialRowPrefix+i),
                  canRemove: rows.length>1, remove:()=>this.removeCredRow(i) };
              });
              R.addCredRow=()=>this.addCredRow();
            }
            if(md.type===MODAL.deployable){
              const sel=s.form.instruccionIds||[];
              const inss=(emp&&emp.instrucciones)||[];
              R.desplegableSinInstrucciones=!inss.length;
              R.desplegableInstrucciones=inss.map(i=>{
                const on=sel.includes(i.id);
                return { text:i.text, toggle:()=>this.toggleDesplegableInstruccion(i.id),
                         bg: on?'var(--gp-cyan-10)':'var(--gp-field)',
                         border: on?'var(--gp-cyan-45)':'var(--gp-line-20)',
                         boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)',
                         boxBg: on?'var(--gp-cyan)':'transparent',
                         iconHref: on?ICON.check:ICON.x,
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type===MODAL.components){
              const sel=s.form.desplegableIds||[];
              const opts=(emp&&emp.desplegables)||[];
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const kindMeta=(k)=> k===DEPLOYABLE_KIND.gateway ? ['Gateway','var(--gp-violet)','var(--gp-violet-16)']
                                 : k===DEPLOYABLE_KIND.app     ? ['App','var(--gp-amber)','var(--gp-amber-16)']
                                 :                 ['API','var(--gp-cyan)','var(--gp-cyan-16)'];
              R.componentesOpcionesEmpty=!opts.length;
              R.componentesOpciones=opts.map(d=>{
                const on=sel.includes(d.id), meta=kindMeta(d.kind), srv=srvById[d.serverId];
                return { titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                         kindLabel:meta[0], kindColor:meta[1], kindBg:meta[2],
                         toggle:()=>this.toggleProyDesplegable(d.id),
                         bg: on?'var(--gp-cyan-10)':'var(--gp-field)',
                         border: on?'var(--gp-cyan-45)':'var(--gp-line-20)',
                         boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)',
                         boxBg: on?'var(--gp-cyan)':'transparent',
                         iconHref: on?ICON.check:ICON.x,
                         color: on?'var(--gp-text)':'var(--gp-muted)' };
              });
            }
            if(md.type===MODAL.email){
              const f=s.form||{};
              const ambs=(emp&&emp.ambientes)||[];
              const deps=(emp&&emp.desplegables)||[];
              const proys=(emp&&emp.proyectos)||[];
              const ctos=BOARD_EXT.emailableContacts(emp&&emp.contactos);
              const srvById={}; ((emp&&emp.servidores)||[]).forEach(x=>{ srvById[x.id]=x; });
              const sel=f.itemIds||[];
              const ambSel=ambs.find(a=>a.id===f.envId);
              const box=(on)=>({ boxBorder: on?'var(--gp-cyan)':'var(--gp-line-25)', boxBg: on?'var(--gp-cyan)':'transparent',
                                 iconHref: on?ICON.check:ICON.x, color: on?'var(--gp-text)':'var(--gp-muted)',
                                 bg: on?'var(--gp-cyan-10)':'var(--gp-field)', border: on?'var(--gp-cyan-45)':'var(--gp-line-20)' });
              const itemRow=(d)=>{ const srv=srvById[d.serverId];
                return Object.assign({ titulo: d.name + (d.port?(':'+d.port):''), servidor: srv?srv.code:'sin servidor',
                                       toggle:()=>this.toggleCorreoItem(d.id) }, box(sel.includes(d.id))); };

              R.correoAmbientes=ambs.map(a=>{ const on=a.id===f.envId;
                return { code:a.code, pick:()=>this.setCorreoAmbiente(a.id),
                         bg: on?'var(--gp-cyan-14)':'var(--gp-field)', border: on?'var(--gp-cyan)':'var(--gp-line-20)',
                         color: on?'var(--gp-cyan)':'var(--gp-muted)' }; });
              R.correoCarpetaFalta = !!(ambSel && !ambSel.deployFolder);

              const proySel=f.proyectoIds||[];
              R.correoProyectos=proys.map(p=>{
                const on=proySel.includes(p.id);
                const mios=deps.filter(d=>(p.desplegableIds||[]).includes(d.id));
                return Object.assign({ nombre:p.nombre, on, sinComponentes: on && !mios.length,
                                       toggle:()=>this.toggleCorreoProyecto(p.id),
                                       pickApi:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.api),
                                       pickGateway:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.gateway),
                                       pickAmbos:()=>this.setCorreoProyectoKind(p.id,EMAIL_KIND_FILTER.both),
                                       items: mios.map(itemRow) }, box(on));
              });

              const enAlgunProyecto=new Set();
              proys.forEach(p=>(p.desplegableIds||[]).forEach(id=>enAlgunProyecto.add(id)));
              const otros=deps.filter(d=>!enAlgunProyecto.has(d.id));
              R.correoOtrosEmpty=!otros.length;
              R.correoOtrosHay=!!otros.length;
              R.correoOtros=otros.map(d=>Object.assign(itemRow(d), {rowBg: sel.includes(d.id)?'var(--gp-cyan-10)':'transparent'}));

              const abiertos=s.correoOpen||{};
              const chevron=(on)=> on?'rotate(-90deg)':'rotate(90deg)';
              const otrosSel=otros.filter(d=>sel.includes(d.id));
              R.correoOtrosOpen=!!abiertos.otros;
              R.correoOtrosChevron=chevron(!!abiertos.otros);
              R.toggleCorreoOtros=()=>this.toggleCorreoPanel(EMAIL_PANEL.others);
              R.correoOtrosConteo=otrosSel.length+'/'+otros.length;
              R.correoOtrosResumen= otrosSel.length ? otrosSel.map(d=>d.name+(d.port?(':'+d.port):'')).join(', ') : 'Ninguno seleccionado';
              R.correoOtrosResumenColor= otrosSel.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoOtrosBorder= otrosSel.length?'var(--gp-cyan-45)':'var(--gp-line-22)';

              R.correoContactosEmpty=!ctos.length;
              R.correoContactosHay=!!ctos.length;
              const ctoRow=(k,field)=>{
                const on=(f[field===EMAIL_FIELD.to?'toIds':'ccIds']||[]).includes(k.id);
                return Object.assign({ name:k.name, email:k.email, toggle:()=>this.toggleExclusiveToOrCcRecipient(k.id,field),
                                       rowBg: on?(field===EMAIL_FIELD.to?'var(--gp-cyan-10)':'var(--gp-violet-10)'):'transparent' },
                                     box(on));
              };
              R.correoContactosTo=ctos.map(k=>ctoRow(k,EMAIL_FIELD.to));
              R.correoContactosCc=ctos.map(k=>ctoRow(k,EMAIL_FIELD.cc));
              const nombresDe=(ids)=>ctos.filter(k=>(ids||[]).includes(k.id)).map(k=>k.name);
              const nomTo=nombresDe(f.toIds), nomCc=nombresDe(f.ccIds);
              R.correoToOpen=!!abiertos.to; R.correoCcOpen=!!abiertos.cc;
              R.correoToChevron=chevron(!!abiertos.to); R.correoCcChevron=chevron(!!abiertos.cc);
              R.toggleCorreoTo=()=>this.toggleCorreoPanel(EMAIL_PANEL.to);
              R.toggleCorreoCc=()=>this.toggleCorreoPanel(EMAIL_PANEL.cc);
              R.correoToResumen= nomTo.length ? nomTo.join(', ') : 'Sin destinatarios';
              R.correoToResumenColor= nomTo.length?'var(--gp-text-2)':'var(--gp-amber)';
              R.correoToBorder= nomTo.length?'var(--gp-cyan-45)':'var(--gp-amber-45)';
              R.correoCcResumen= nomCc.length ? nomCc.join(', ') : 'Nadie en copia';
              R.correoCcResumenColor= nomCc.length?'var(--gp-text-2)':'var(--gp-muted-2)';
              R.correoCcBorder= nomCc.length?'var(--gp-violet-45)':'var(--gp-line-22)';
              R.setCorreoNota=(e)=>this.setCorreoNota(e);

              const p=this.correoPayload();
              const url=this.correoMailtoUrl(p);
              const falta=[];
              if(!f.envId) falta.push('elige un ambiente');
              if(!p.itemsCount) falta.push('marca al menos un desplegable');
              if(!p.to.length) falta.push('agrega al menos un destinatario en Para');
              const puede=!falta.length;
              const copiado=s.copiedKey===COPY_KEY.emailBody;
              R.correoAsunto=p.subject;
              R.correoCuerpo=p.body;
              R.correoChars=url.length+' / 2048 caracteres';
              R.correoCharsColor= url.length>MAILTO_WARN_LENGTH ? 'var(--gp-amber)' : 'var(--gp-muted-2)';
              R.correoLargo= url.length>MAILTO_WARN_LENGTH;
              R.correoBloqueo= falta.length ? ('Para poder abrir el correo: '+falta.join(', ')+'.') : '';
              R.correoBloqueoShow=!!falta.length;
              R.correoNoPuede=!puede;
              R.correoBtnBg= puede ? 'linear-gradient(135deg,var(--gp-indigo),var(--gp-sky))' : 'var(--gp-line-14)';
              R.correoBtnColor= puede ? 'var(--gp-white)' : 'var(--gp-muted-2)';
              R.correoBtnCursor= puede ? 'pointer' : 'not-allowed';
              R.abrirCorreo=()=>this.abrirCorreo();
              R.copiarCorreoCuerpo=()=>this.copiarCorreoCuerpo();
              R.correoCopyLabel= copiado ? 'Copiado' : 'Copiar cuerpo';
              R.correoCopyIcon= copiado ? ICON.check : ICON.copy;
              R.correoCopyColor= copiado ? 'var(--gp-green)' : 'var(--gp-text-2)';
              R.setCorreoCuerpo=(e)=>this.setCorreoCuerpo(e);
            }
          }
          return R;
        }
      }
      applyRootMixins(Component);
    </script>
  </body>
</html>
