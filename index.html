    <script>
      (() => {
        const { cdn } = window.APP_CONFIG;
        cdn.preconnect.forEach(({ href, crossOrigin }) => {
          const link = document.createElement("link");
          link.rel = "preconnect";
          link.href = href;
          if (crossOrigin) link.crossOrigin = "anonymous";
          document.head.appendChild(link);
        });
        const fonts = document.createElement("link");
        fonts.rel = "stylesheet";
        fonts.href = cdn.fonts;
        document.head.appendChild(fonts);
        const appendScript = (src, async) => {
          const script = document.createElement("script");
          script.src = src;
          script.async = async;
          document.head.appendChild(script);
        };
        appendScript(cdn.supabase, false);
        appendScript(cdn.redoc, true);
      })();
    </script>

    <script type="text/x-dc" data-dc-script>
      const { VIEW, REQ_TAB, PROJECTS_VIEW, FILTER_ALL, NARROW_MAX_WIDTH, ICON, AUTH_EVENT } = window.APP_CONSTANTS;

      class Component extends DCLogic {
        constructor(props){
          super(props);
          this.state = {
            view:VIEW.companies, empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null,
            estComplexities:[], estActivityTypes:[], currentUserName:'', exportingEstimacion:false, estUploading:false, exportHourScenario:'mostProbable', estCounter:{lineId:null,count:'1'},
            reqTab:REQ_TAB.documents, filter:FILTER_ALL, modal:null, form:{},
            projectsView:PROJECTS_VIEW.grid, reqSelectMode:false, reqSelected:{},
            maestroSearch:'', maestroStatus:FILTER_ALL, maestroProject:FILTER_ALL, maestroProjectMenuOpen:false, maestroStatusMenuOpen:false, maestroEstMenu:null, exportingExcel:false,
            apiUrlInput:'', apiErr:'', apiHasRender:false,
            session:null, authChecked:false, profileRole:null, devProfiles:[], pmProfiles:[],
            loginEmail:'', loginPassword:'', loginError:'', loginNotice:'', loginLoading:false,
            recoveryMode:false, recoveryPass1:'', recoveryPass2:'', recoveryError:'', recoveryLoading:false,
            showLoginPass:false, showRecoveryPass1:false, showRecoveryPass2:false, modalShowPass:{},
            data:[], statuses:[], dataLoaded:false, loadError:'', copiedKey:'', userMenuOpen:false, apiFullscreen:false, credShown:{},
            documentFileName:'',
            correoOpen:{},
            narrow: (typeof window!=='undefined' && window.innerWidth<=NARROW_MAX_WIDTH),
          };
        }

        componentDidMount(){
          this._sb = window.supabase.createClient(
            window.APP_CONFIG.supabaseUrl,
            window.APP_CONFIG.supabaseAnonKey
          );
          this._sb.auth.getSession().then(({data})=>{
            this.setState({session:data.session, authChecked:true});
            if(data.session) this.afterLogin();
          });
          this._authSub = this._sb.auth.onAuthStateChange((evt, session)=>{
            if(evt===AUTH_EVENT.passwordRecovery){ this.setState({session, authChecked:true, recoveryMode:true}); return; }
            const had=this.state.session;
            this.setState({session, authChecked:true});
            if(session && !had && !this.state.recoveryMode){ this.afterLogin(); }
            else if(!session){ this.setState({data:[], dataLoaded:false, profileRole:null, devProfiles:[], pmProfiles:[], view:VIEW.companies, empresaId:null, proyectoId:null, reqId:null, estimacionId:null, estDraft:null}); }
          });
          this._onResize=()=>{
            const n=window.innerWidth<=NARROW_MAX_WIDTH;
            if(n!==this.state.narrow) this.setState({narrow:n});
          };
          window.addEventListener('resize', this._onResize);
          this._onFsChange=()=>{ const fs=!!document.fullscreenElement; if(fs!==this.state.apiFullscreen) this.setState({apiFullscreen:fs}); };
          document.addEventListener('fullscreenchange', this._onFsChange);
          this._onBeforeUnload=(e)=>this.warnBeforeUnloadIfEstimacionUnsaved(e);
          window.addEventListener('beforeunload', this._onBeforeUnload);
        }
        warnBeforeUnloadIfEstimacionUnsaved(e){ if(this.estDirty()){ e.preventDefault(); e.returnValue=''; } }
        componentWillUnmount(){
          if(this._authSub && this._authSub.data) this._authSub.data.subscription.unsubscribe();
          window.removeEventListener('resize', this._onResize);
          document.removeEventListener('fullscreenchange', this._onFsChange);
          window.removeEventListener('beforeunload', this._onBeforeUnload);
        }

        renderVals(){
          const s=this.state, v=s.view;
          const isDev=this.isDev(), isPM=this.isPM();
          const emp=this.empresa(), proy=this.proyecto(), req=this.req();
          const ctx={ s, v, isDev, isPM, emp, proy, req, narrow:!!s.narrow };
          const head={
            ...this.navVals(ctx),
            stop:(e)=>this.stop(e), closeModal:()=>this.closeModal(),
            overlayDown:(e)=>this.markPressStartedOnBackdrop(e), overlayClick:(e)=>this.closeModalIfPressStartedAndEndedOnBackdrop(e),
            addDoc:()=>this.addDoc(), addDespliegue:()=>this.addDespliegue(), addBloqueante:()=>this.addBloqueante(),
            editReq:()=>this.editReq(), editDesplieguesProy:()=>this.editDesplieguesProy(), editCredenciales:()=>this.editCredenciales(),
            deleteReq:()=>req&&this.delReq(req.id),
            f_url:(e)=>this.setForm('url',e.target.value),
            icons:ICON,
            ...this.sessionVals(ctx),
            ...this.loginVals(ctx),
            ...this.themeVals(ctx),
            ...this.userMenuVals(ctx),
            ...this.recoveryVals(ctx),
          };

          if(!head.showApp) return head;

          const master=this.masterVals(ctx);
          return {
            ...head,
            ...this.saveVals(ctx),
            ...this.crumbsVals({ ...ctx, goHome:head.goHome }),
            ...this.primaryVals(ctx),
            ...master,
            ...this.apiDocVals({ ...ctx, maestroExtended:master.maestroExtended }),
            ...this.companiesVals(ctx),

            ...this.projectsVals(ctx),

            ...this.requirementVals(ctx),

          };
        }
      }
      applyRootMixins(Component);
    </script>
