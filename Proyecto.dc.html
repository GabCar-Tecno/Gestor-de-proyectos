<x-dc>
<div style="animation: vwIn 0.3s ease">
  <div style="margin-bottom: 24px">
    <h1
      style="
        margin: 0 0 4px;
        font-size: clamp(22px, 3vw, 29px);
        font-weight: 700;
        letter-spacing: -0.5px;
      "
    >
      {{ proyecto.nombre }}
    </h1>
    <p style="margin: 0; color: var(--gp-muted); font-size: 14px">
      {{ proyecto.descripcion }}
    </p>
  </div>

  <sc-if value="{{ isDev }}" hint-placeholder-val="{{ true }}">
    <button
      onClick="{{ goRequerimientos }}"
      style="
        width: 100%;
        text-align: left;
        cursor: pointer;
        background: linear-gradient(
          120deg,
          rgba(43, 59, 214, 0.22),
          rgba(35, 169, 224, 0.12)
        );
        border: 1px solid rgba(53, 192, 240, 0.28);
        border-radius: 18px;
        padding: 22px 24px;
        display: flex;
        align-items: center;
        gap: 22px;
        flex-wrap: wrap;
        margin-bottom: 16px;
        transition: border-color 0.18s;
      "
      style-hover="border-color:rgba(53,192,240,.55)"
    >
      <div
        style="
          flex: 1;
          min-width: 200px;
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 16px;
        "
      >
        <div
          class="hero-row"
          style="display: flex; align-items: center; gap: 10px"
        >
          <span style="font-size: 19px; font-weight: 600"
            >Requerimientos</span
          ><span
            style="
              background: var(--gp-line-18);
              padding: 2px 9px;
              border-radius: 20px;
              font-size: 12px;
              color: var(--gp-text-2);
            "
            >{{ proyecto.totalReq }}</span
          ><span
            class="hero-cta"
            style="
              margin-left: auto;
              display: inline-flex;
              align-items: center;
              gap: 8px;
              color: #35c0f0;
              font-weight: 600;
              font-size: 14px;
            "
            >Ver requerimientos →</span
          >
        </div>
        <div
          style="
            display: flex;
            gap: 3px;
            height: 7px;
            border-radius: 99px;
            overflow: hidden;
            background: var(--gp-line-14);
          "
        >
          <sc-for
            list="{{ proyecto.reqBarra }}"
            as="b"
            hint-placeholder-count="3"
            ><div
              style="flex:{{ b.f }};background:{{ b.color }}"
            ></div
          ></sc-for>
        </div>
        <div
          style="
            display: flex;
            flex-wrap: wrap;
            gap: 0 18px;
            align-items: center;
          "
        >
          <sc-for
            list="{{ proyecto.estadoChips }}"
            as="c"
            hint-placeholder-count="5"
            ><div
              style="display:flex;align-items:baseline;gap:7px;padding-right:{{ c.pr }};border-right:{{ c.bd }}"
            >
              <span
                style="font-size:15px;font-weight:700;color:{{ c.color }}"
                >{{ c.n }}</span
              ><span
                style="font-size:12.5px;color:{{ c.labelColor }}"
                >{{ c.label }}</span
              >
            </div></sc-for
          >
        </div>
      </div>
    </button>
  </sc-if>

  <dc-import name="ProyectoDesplegables"
    isDev="{{ isDev }}" editDesplieguesProy="{{ editDesplieguesProy }}"
    proyecto="{{ proyecto }}" openComponentesProy="{{ openComponentesProy }}"
    componentesProyEmpty="{{ componentesProyEmpty }}" componentesProy="{{ componentesProy }}"
  />

  <dc-import name="ProyectoCredenciales"
    isDev="{{ isDev }}" editCredenciales="{{ editCredenciales }}"
    proyecto="{{ proyecto }}" credsEmpty="{{ credsEmpty }}"
  />
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"proyecto":null,"isDev":false,"goRequerimientos":null,"editDesplieguesProy":null,"openComponentesProy":null,"componentesProyEmpty":false,"componentesProy":null,"editCredenciales":null,"credsEmpty":false}'>
class Component extends DCLogic {
}
</script>
