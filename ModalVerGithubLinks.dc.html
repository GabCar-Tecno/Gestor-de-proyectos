<x-dc>
<div
  style="display: flex; flex-direction: column; gap: 12px"
>
  <sc-for
    list="{{ verGithubLinksList }}"
    as="l"
    hint-placeholder-count="2"
  >
    <div
      style="
        background: var(--gp-field);
        border: 1px solid var(--gp-line-18);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      "
    >
      <div style="flex: 1; min-width: 0">
        <div
          style="
            font-size: 12px;
            color: var(--gp-muted);
            margin-bottom: 3px;
          "
        >
          {{ l.label }}
        </div>
        <div
          style="
            font-family:
              &quot;JetBrains Mono&quot;, monospace;
            font-size: 12.5px;
            color: var(--gp-text-2);
            word-break: break-all;
          "
        >
          {{ l.url }}
        </div>
      </div>
      <div style="display: flex; gap: 6px; flex: none">
        <button
          onClick="{{ l.copy }}"
          title="{{ l.copyTitle }}"
          style="flex:none;width:32px;height:32px;border-radius:8px;background:none;border:1px solid var(--gp-line-20);color:{{ l.copyColor }};cursor:pointer;display:flex;align-items:center;justify-content:center"
          style-hover="border-color:rgba(53,192,240,.4);color:#35c0f0"
        >
          <svg width="14" height="14">
            <use href="{{ l.copyIconHref }}"></use>
          </svg>
        </button>
        <button
          onClick="{{ l.open }}"
          title="Abrir en GitHub"
          style="
            flex: none;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: none;
            border: 1px solid var(--gp-line-20);
            color: var(--gp-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
          "
          style-hover="border-color:rgba(53,192,240,.4);color:#35c0f0"
        >
          <svg width="14" height="14">
            <use href="#ic-ext"></use>
          </svg>
        </button>
      </div>
    </div>
  </sc-for>
  <sc-if
    value="{{ verGithubLinksEmpty }}"
    hint-placeholder-val="{{ false }}"
    ><div
      style="
        text-align: center;
        padding: 30px;
        color: var(--gp-muted-2);
        font-size: 13px;
      "
    >
      Sin repositorios registrados.
    </div></sc-if
  >
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"verGithubLinksList":[],"verGithubLinksEmpty":false}'>
class Component extends DCLogic {
}
</script>
