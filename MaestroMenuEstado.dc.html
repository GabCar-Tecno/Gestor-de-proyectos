<x-dc>
<button
  type="button"
  class="master-dropdown-backdrop"
  aria-label="Cerrar estados"
  onClick="{{ closeMaestroStatusMenu }}"
></button>
<div
  class="master-dropdown-menu"
  role="listbox"
  aria-label="Estados disponibles"
>
  <sc-for
    list="{{ maestroStatusOptions }}"
    as="st"
    hint-placeholder-count="5"
    ><button
      type="button"
      class="master-dropdown-option"
      role="option"
      aria-selected="{{ st.selected }}"
      style="background:{{ st.bg }};color:{{ st.color }};font-weight:{{ st.weight }}"
      style-hover="background:var(--gp-tint);color:var(--gp-ink)"
      onClick="{{ st.choose }}"
    >
      <span
        style="
          display: flex;
          align-items: center;
          gap: 10px;
        "
        ><span
          class="master-dropdown-option-dot"
          style="background:{{ st.dot }}"
        ></span
        >{{ st.label }}</span
      ><sc-if
        value="{{ st.selected }}"
        hint-placeholder-val="{{ false }}"
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="m5 12 4 4L19 6" /></svg
      ></sc-if></button
  ></sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"closeMaestroStatusMenu":null,"maestroStatusOptions":null}'>
class Component extends DCLogic {
}
</script>
