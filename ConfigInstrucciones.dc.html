<x-dc>
<div style="margin-top: 32px">
  <div
    style="
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    "
  >
    <h2
      style="
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--gp-text);
      "
    >
      Instrucciones de despliegue
    </h2>
    <span style="font-size: 12px; color: var(--gp-muted-2)"
      >Frases que se repiten en los correos</span
    >
    <button
      onClick="{{ addInstruccion }}"
      style="
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px solid var(--gp-cyan-40);
        color: var(--gp-cyan);
        cursor: pointer;
        padding: 7px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
      "
      style-hover="background:var(--gp-cyan-10)"
    >
      <svg width="13" height="13">
        <use href="#ic-plus"></use></svg
      >Nueva instrucción
    </button>
  </div>
  <sc-if
    value="{{ instruccionesEmpty }}"
    hint-placeholder-val="{{ false }}"
  >
    <div
      style="
        background: var(--gp-field);
        border: 1px dashed var(--gp-line-22);
        border-radius: 14px;
        padding: 20px;
        color: var(--gp-muted-2);
        font-size: 13px;
      "
    >
      Sin instrucciones. Agrega las que repites, como "por
      favor conservar carpeta logs".
    </div>
  </sc-if>
  <div
    style="display: flex; flex-direction: column; gap: 8px"
  >
    <sc-for
      list="{{ instruccionesList }}"
      as="i"
      hint-placeholder-count="2"
    >
      <div
        style="
          background: var(--gp-surface);
          border: 1px solid var(--gp-line-16);
          border-radius: 12px;
          padding: 12px 14px;
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
        "
      >
        <span
          style="
            flex: 1;
            min-width: 200px;
            font-size: 13px;
            color: var(--gp-text-2);
          "
          >{{ i.text }}</span
        >
        <button
          onClick="{{ i.edit }}"
          style="
            flex: none;
            background: none;
            border: 1px solid var(--gp-line-22);
            color: var(--gp-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"
        >
          Editar
        </button>
        <button
          onClick="{{ i.del }}"
          style="
            flex: none;
            background: none;
            border: 1px solid var(--gp-red-25);
            color: var(--gp-red);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="background:var(--gp-red-8)"
        >
          Eliminar
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"addInstruccion":null,"instruccionesEmpty":false,"instruccionesList":[]}'>
class Component extends DCLogic {
}
</script>
