<x-dc>
<div
  style="
    display: grid;
    grid-template-columns: repeat(
      auto-fill,
      minmax(300px, 1fr)
    );
    gap: 16px;
  "
>
  <sc-for
    list="{{ proyectosList }}"
    as="p"
    hint-placeholder-count="2"
  >
    <button
      class="project-card"
      onClick="{{ p.open }}"
      style="
        text-align: left;
        cursor: pointer;
        background: var(--gp-surface);
        border: 1px solid var(--gp-card-line);
        border-radius: 16px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        transition:
          border-color 0.18s,
          transform 0.18s;
      "
      style-hover="border-color:var(--gp-card-line-hover);transform:translateY(-2px)"
    >
      <div>
        <div
          style="
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 5px;
          "
        >
          {{ p.nombre }}
        </div>
        <div
          style="
            font-size: 13px;
            color: var(--gp-muted);
            line-height: 1.45;
          "
        >
          {{ p.descripcion }}
        </div>
      </div>
      <div
        style="
          height: 6px;
          border-radius: 4px;
          display: flex;
          overflow: hidden;
          background: var(--gp-field);
        "
      >
        <sc-for
          list="{{ p.barra }}"
          as="b"
          hint-placeholder-count="3"
          ><div
            style="height:100%;width:{{ b.w }};background:{{ b.color }}"
          ></div
        ></sc-for>
      </div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for
          list="{{ p.estadoChips }}"
          as="c"
          hint-placeholder-count="3"
          ><span
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              font-size: 12px;
              color: var(--gp-text-3);
            "
            ><span
              style="width:8px;height:8px;border-radius:50%;background:{{ c.color }}"
            ></span
            >{{ c.n }} {{ c.label }}</span
          ></sc-for
        >
      </div>
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          font-size: 12px;
          color: var(--gp-muted);
        "
      >
        <span
          style="display:inline-flex;align-items:center;gap:6px;color:{{ p.bloqColor }}"
          ><span
            style="width:8px;height:8px;border-radius:50%;background:{{ p.bloqColor }}"
          ></span
          ><strong style="font-weight: 600"
            >{{ p.bloqCount }}</strong
          >
          bloqueantes</span
        >
        <span
          >Último despliegue · {{ p.ultimoDespliegue }}</span
        >
      </div>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"proyectosList":[]}'>
class Component extends DCLogic {
}
</script>
