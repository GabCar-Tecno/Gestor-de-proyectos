<x-dc>
<div style="animation: vwIn 0.3s ease">
  <div style="margin-bottom: 18px">
    <h1
      style="
        margin: 0 0 4px;
        font-size: clamp(22px, 3vw, 28px);
        font-weight: 700;
        letter-spacing: -0.5px;
      "
    >
      Documentación Técnica
    </h1>
    <p style="margin: 0; color: var(--gp-muted); font-size: 13.5px">
      {{ proyecto.nombre }}
    </p>
  </div>

  <sc-if value="{{ isDev }}" hint-placeholder-val="{{ true }}">
    <div
      style="
        background: var(--gp-surface);
        border: 1px solid var(--gp-line-16);
        border-radius: 14px;
        padding: 18px;
        margin-bottom: 16px;
      "
    >
      <div
        style="
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
          align-items: flex-end;
        "
      >
        <label
          style="
            flex: 1;
            min-width: 240px;
            display: flex;
            flex-direction: column;
            gap: 7px;
          "
          ><span
            style="
              font-size: 12px;
              font-weight: 500;
              color: var(--gp-muted);
            "
            >Ruta del archivo de la spec en el repo (JSON o YAML)</span
          >
          <input
            value="{{ apiUrlVal }}"
            onInput="{{ onApiUrl }}"
            placeholder="docs-tecnica/mi-proyecto.json"
            style="
              background: var(--gp-field);
              border: 1px solid var(--gp-line-22);
              border-radius: 10px;
              padding: 11px 12px;
              color: var(--gp-text);
              font-size: 13px;
              outline: none;
              font-family:
                &quot;JetBrains Mono&quot;, monospace;
            "
            style-focus="border-color:var(--gp-cyan)"
          />
          <span
            style="font-size: 12px; color: var(--gp-muted)"
            >Es la ruta del archivo dentro del repo, por ejemplo docs-tecnica/&lt;proyecto&gt;.json</span
          >
        </label>
        <button
          onClick="{{ saveApiUrl }}"
          style="
            background: linear-gradient(
              135deg,
              var(--gp-indigo),
              var(--gp-sky)
            );
            border: 0;
            color: var(--gp-white);
            cursor: pointer;
            padding: 11px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            height: fit-content;
          "
        >
          Guardar
        </button>
      </div>
      <sc-if
        value="{{ apiErrShow }}"
        hint-placeholder-val="{{ false }}"
        ><div
          style="
            color: var(--gp-red);
            font-size: 12.5px;
            margin-top: 12px;
            line-height: 1.5;
          "
        >
          {{ apiErr }}
        </div></sc-if
      >
    </div>
  </sc-if>

  <div
    ref="{{ redocContainerRef }}"
    class="redoc-embed"
    style="
      background: var(--gp-white);
      color: var(--gp-charcoal);
      color-scheme: light;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--gp-cloud);
      position: relative;
    "
  >
    <sc-if
      value="{{ showFullscreenBtn }}"
      hint-placeholder-val="{{ false }}"
    >
      <button
        onClick="{{ toggleFullscreen }}"
        title="{{ fullscreenTitle }}"
        style="
          position: absolute;
          top: 10px;
          right: 10px;
          z-index: 5;
          background: var(--gp-white);
          border: 1px solid var(--gp-haze);
          color: var(--gp-graphite);
          cursor: pointer;
          width: 34px;
          height: 34px;
          border-radius: 9px;
          display: flex;
          align-items: center;
          justify-content: center;
        "
        style-hover="border-color:var(--gp-cyan-50);color:var(--gp-cyan)"
      >
        <svg width="15" height="15">
          <use href="{{ fullscreenIconHref }}"></use>
        </svg>
      </button>
    </sc-if>
    <div class="redoc-scroll">
      <sc-if
        value="{{ apiEmptyShow }}"
        hint-placeholder-val="{{ true }}"
      >
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--gp-smoke);
            background: var(--gp-white);
            text-align: center;
            padding: 24px;
          "
        >
          <svg width="38" height="38" style="color: var(--gp-twilight)">
            <use href="#ic-api"></use>
          </svg>
          <div
            style="
              font-size: 15px;
              font-weight: 600;
              color: var(--gp-graphite);
            "
          >
            Aún no hay una spec cargada
          </div>
          <div
            style="
              font-size: 13px;
              max-width: 340px;
              line-height: 1.5;
            "
          >
            Indica arriba la ruta del archivo de su spec para
            documentar esta API con Redoc.
          </div>
        </div>
      </sc-if>
      <div
        ref="{{ redocRef }}"
        style="display:{{ redocDisplay }};width:100%"
      ></div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"proyecto":null,"isDev":false,"apiUrlVal":null,"onApiUrl":null,"saveApiUrl":null,"apiErrShow":false,"apiErr":null,"redocContainerRef":null,"showFullscreenBtn":false,"toggleFullscreen":null,"fullscreenTitle":null,"fullscreenIconHref":null,"apiEmptyShow":false,"redocRef":null,"redocDisplay":null}'>
class Component extends DCLogic {
}
</script>
