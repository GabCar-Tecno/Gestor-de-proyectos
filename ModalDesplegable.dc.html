<x-dc>
<div
  style="
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid var(--gp-line-16);
  "
>
  <span
    style="
      font-size: 12px;
      font-weight: 500;
      color: var(--gp-muted);
    "
    >Instrucciones que aplican</span
  >
  <sc-if
    value="{{ desplegableSinInstrucciones }}"
    hint-placeholder-val="{{ false }}"
  >
    <span style="font-size: 12.5px; color: var(--gp-muted-2)"
      >Esta empresa no tiene instrucciones en el catálogo
      todavía.</span
    >
  </sc-if>
  <sc-for
    list="{{ desplegableInstrucciones }}"
    as="i"
    hint-placeholder-count="2"
  >
    <button
      onClick="{{ i.toggle }}"
      style="text-align:left;cursor:pointer;background:{{ i.bg }};border:1px solid {{ i.border }};border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:10px"
      style-hover="border-color:rgba(53,192,240,.45)"
    >
      <span
        style="flex:none;width:16px;height:16px;border-radius:5px;border:1px solid {{ i.boxBorder }};background:{{ i.boxBg }};display:flex;align-items:center;justify-content:center;color:#172033"
        ><svg width="11" height="11">
          <use href="{{ i.iconHref }}"></use></svg
      ></span>
      <span style="font-size:12.5px;color:{{ i.color }}"
        >{{ i.text }}</span
      >
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"desplegableSinInstrucciones":null,"desplegableInstrucciones":null}'>
class Component extends DCLogic {
}
</script>
