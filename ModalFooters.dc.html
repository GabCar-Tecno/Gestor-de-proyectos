<x-dc>
<sc-helmet>
  <style>
    .modal-footers-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</sc-helmet>
<div class="modal-footers-row">
  <sc-if
    value="{{ modalPromoteConfirm }}"
    hint-placeholder-val="{{ false }}"
  >
    <button
      onClick="{{ closeModal }}"
      style="
        background: none;
        border: 1px solid var(--gp-line-24);
        color: var(--gp-text-2);
        cursor: pointer;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
      "
    >
      Cancelar
    </button>
    <button
      onClick="{{ promoteOnlyStatus }}"
      style="

        border: 1px solid var(--gp-line-24);
        color: var(--gp-muted);
        cursor: pointer;

        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
      "
      style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"

      Cambiar solo el estado
    </button>
    <button
      onClick="{{ promoteUpdateProject }}"

        color: var(--gp-white);

        font-size: 13px;
        font-weight: 500;
      "
      style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"

      Ahora no
    </button>
    <button
      onClick="{{ discord.send }}"

        border-radius: 10px;

        font-weight: 600;

        cursor: pointer;
        padding: 10px 16px;
        border-radius: 10px;
        font-size: 13px;
        font-weight: 500;
      "
    >
      Cancelar
    </button>
    <sc-if
      value="{{ batch.hasAmb }}"
      hint-placeholder-val="{{ true }}"
    >
      <button
        onClick="{{ batchOnlyStatus }}"
        style="
          background: none;
          border: 1px solid var(--gp-line-24);
          color: var(--gp-muted);
          cursor: pointer;

          border-radius: 10px;

          font-weight: 500;
        "
        style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"

      <button

          padding: 10px 18px;
          border-radius: 10px;
          font-size: 13px;
          font-weight: 600;
          box-shadow: 0 6px 18px -6px var(--gp-indigo-70);
        "

        Avanzar y actualizar ambiente
      </button>
    </sc-if>
    <sc-if
      value="{{ batch.stateOnly }}"
      hint-placeholder-val="{{ false }}"
    >
      <button
        onClick="{{ batchOnlyStatus }}"
        style="
          background: linear-gradient(135deg, var(--gp-indigo), var(--gp-sky));
          border: 0;
          color: var(--gp-white);
          cursor: pointer;
          padding: 10px 18px;
          border-radius: 10px;
          font-size: 13px;
          font-weight: 600;
          box-shadow: 0 6px 18px -6px var(--gp-indigo-70);

      modalSecondaryLabel="{{ modalSecondaryLabel }}"
      modalShowSave="{{ modalShowSave }}"
