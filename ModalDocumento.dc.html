<x-dc>
<label
  style="
    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-top: 16px;
  "
>
  <span
    style="
      font-size: 12px;
      font-weight: 500;
      color: var(--gp-muted);
    "
    >Adjuntar archivo privado</span
  >
  <input
    type="file"
    accept=".doc,.docx,.pdf"
    onChange="{{ onDocumentFile }}"
    style="
      background: var(--gp-field);
      border: 1px solid var(--gp-line-22);
      border-radius: 10px;
      padding: 10px 12px;
      color: var(--gp-text-2);
      font-size: 12px;
    "
  />
  <span style="font-size: 11px; color: var(--gp-muted-2)"
    >{{ documentFileName }}</span
  >
  <span style="font-size: 11px; color: var(--gp-muted-2)"
    >Puedes adjuntar Word o PDF (máximo 50 MB) o usar un enlace externo.</span
  >
</label>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onDocumentFile":null,"documentFileName":null}'>
class Component extends DCLogic {
}
</script>
