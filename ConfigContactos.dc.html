<x-dc>
<div style="margin-top: 32px">
  <div
    style="
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    "
  >
    <h2
      style="
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--gp-text);
      "
    >
      Contactos
    </h2>
    <span style="font-size: 12px; color: var(--gp-muted-2)"
      >Destinatarios de los correos de esta empresa</span
    >
    <button
      onClick="{{ addContacto }}"
      style="
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px solid var(--gp-cyan-40);
        color: var(--gp-cyan);
        cursor: pointer;
        padding: 7px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
      "
      style-hover="background:var(--gp-cyan-10)"
    >
      <svg width="13" height="13">
        <use href="#ic-plus"></use></svg
      >Nuevo contacto
    </button>
  </div>
  <sc-if
    value="{{ contactosEmpty }}"
    hint-placeholder-val="{{ false }}"
  >
    <div
      style="
        background: var(--gp-field);
        border: 1px dashed var(--gp-line-22);
        border-radius: 14px;
        padding: 20px;
        color: var(--gp-muted-2);
        font-size: 13px;
      "
    >
      Sin contactos. Agrega al menos uno para poder enviar
      correos de despliegue.
    </div>
  </sc-if>
  <div
    style="display: flex; flex-direction: column; gap: 8px"
  >
    <sc-for
      list="{{ contactosList }}"
      as="k"
      hint-placeholder-count="3"
    >
      <div
        style="
          background: var(--gp-surface);
          border: 1px solid var(--gp-line-16);
          border-radius: 12px;
          padding: 12px 14px;
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
        "
      >
        <span
          style="
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 2px;
          "
        >
          <span
            style="
              font-size: 13.5px;
              font-weight: 600;
              color: var(--gp-text);
            "
            >{{ k.name }}</span
          >
          <span
            style="
              font-size: 12px;
              color: var(--gp-muted);
              font-family:
                &quot;JetBrains Mono&quot;, monospace;
            "
            >{{ k.email }}</span
          >
        </span>
        <span
          style="flex:none;font-size:11px;font-weight:600;color:{{ k.badgeColor }};background:{{ k.badgeBg }};padding:3px 9px;border-radius:20px"
          >{{ k.badgeLabel }}</span
        >
        <button
          onClick="{{ k.edit }}"
          style="
            flex: none;
            background: none;
            border: 1px solid var(--gp-line-22);
            color: var(--gp-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="color:var(--gp-cyan);border-color:var(--gp-cyan-40)"
        >
          Editar
        </button>
        <button
          onClick="{{ k.del }}"
          style="
            flex: none;
            background: none;
            border: 1px solid var(--gp-red-25);
            color: var(--gp-red);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="background:var(--gp-red-8)"
        >
          Eliminar
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"addContacto":null,"contactosEmpty":false,"contactosList":[]}'>
class Component extends DCLogic {
}
</script>
