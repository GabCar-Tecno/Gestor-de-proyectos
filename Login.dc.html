<x-dc>
<div
  style="
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  "
>
  <form
    onSubmit="{{ doLogin }}"
    style="
      width: 100%;
      max-width: 360px;
      background: var(--gp-surface);
      border: 1px solid var(--gp-line-18);
      border-radius: 18px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    "
  >
    <div
      style="
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 6px;
      "
    >
      <svg
        width="30"
        height="30"
        viewBox="0 0 68.755 45.796"
        fill="none"
      >
        <path
          d="M22.921,45.8A22.92,22.92,0,0,1,21.348.009a4.184,4.184,0,0,1,.571,8.348,14.552,14.552,0,1,0,15.52,15.521,4.184,4.184,0,1,1,8.348.572A22.919,22.919,0,0,1,22.921,45.8"
          fill="var(--gp-cyan)"
        />
        <path
          d="M63.446,21.63a5.309,5.309,0,1,1,0-7.508,5.309,5.309,0,0,1,0,7.508"
          transform="translate(-25.807 -5.964)"
          fill="var(--gp-cyan)"
        />
      </svg>
      <div style="line-height: 1">
        <div
          style="
            font-weight: 700;
            font-size: 17px;
            letter-spacing: -0.3px;
          "
        >
          Tecno<span style="color: var(--gp-cyan)">Corp</span>
        </div>
        <div
          style="
            font-size: 9px;
            letter-spacing: 3px;
            color: var(--gp-muted-2);
            font-weight: 600;
            margin-top: 1px;
          "
        >
          GESTIÓN DE PROYECTOS
        </div>
      </div>
    </div>
    <label style="display: flex; flex-direction: column; gap: 7px">
      <span style="font-size: 12px; font-weight: 500; color: var(--gp-muted)"
        >Correo</span
      >
      <input
        type="email"
        value="{{ loginEmail }}"
        onInput="{{ onLoginEmail }}"
        placeholder="tu@tecno.co"
        style="
          background: var(--gp-field);
          border: 1px solid var(--gp-line-22);
          border-radius: 10px;
          padding: 11px 12px;
          color: var(--gp-text);
          font-size: 14px;
          outline: none;
        "
        style-focus="border-color:var(--gp-cyan)"
      />
    </label>
    <label style="display: flex; flex-direction: column; gap: 7px">
      <span style="font-size: 12px; font-weight: 500; color: var(--gp-muted)"
        >Contraseña</span
      >
      <div style="position: relative">
        <input
          type="{{ loginPassType }}"
          value="{{ loginPassword }}"
          onInput="{{ onLoginPassword }}"
          placeholder="••••••••"
          style="
            width: 100%;
            background: var(--gp-field);
            border: 1px solid var(--gp-line-22);
            border-radius: 10px;
            padding: 11px 38px 11px 12px;
            color: var(--gp-text);
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
          "
          style-focus="border-color:var(--gp-cyan)"
        />
        <button
          type="button"
          onClick="{{ toggleLoginPass }}"
          tabindex="-1"
          style="
            position: absolute;
            right: 9px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: 0;
            color: var(--gp-muted);
            cursor: pointer;
            display: flex;
            padding: 2px;
          "
          style-hover="color:var(--gp-cyan)"
        >
          <svg width="16" height="16">
            <use href="{{ loginEyeHref }}"></use>
          </svg>
        </button>
      </div>
    </label>
    <sc-if value="{{ loginErrShow }}" hint-placeholder-val="{{ false }}"
      ><div style="color: var(--gp-red); font-size: 12.5px; line-height: 1.5">
        {{ loginError }}
      </div></sc-if
    >
    <sc-if
      value="{{ loginNoticeShow }}"
      hint-placeholder-val="{{ false }}"
      ><div style="color: var(--gp-green); font-size: 12.5px; line-height: 1.5">
        {{ loginNotice }}
      </div></sc-if
    >
    <button
      type="submit"
      disabled="{{ loginLoading }}"
      style="
        background: linear-gradient(135deg, var(--gp-indigo), var(--gp-sky));
        border: 0;
        color: var(--gp-white);
        cursor: pointer;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 13.5px;
        font-weight: 600;
        margin-top: 4px;
      "
    >
      {{ loginBtnLabel }}
    </button>
    <button
      type="button"
      onClick="{{ forgotPassword }}"
      style="
        background: none;
        border: 0;
        color: var(--gp-muted-2);
        cursor: pointer;
        font-size: 12.5px;
        padding: 2px;
      "
      style-hover="color:var(--gp-cyan)"
    >
      ¿Olvidaste tu contraseña?
    </button>
  </form>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"doLogin":null,"loginEmail":null,"onLoginEmail":null,"loginPassType":null,"loginPassword":null,"onLoginPassword":null,"toggleLoginPass":null,"loginEyeHref":null,"loginErrShow":false,"loginError":null,"loginNoticeShow":false,"loginNotice":null,"loginLoading":false,"loginBtnLabel":null,"forgotPassword":null}'>
class Component extends DCLogic {
}
</script>
