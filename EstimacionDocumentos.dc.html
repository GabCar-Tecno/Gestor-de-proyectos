<x-dc>
<section
  style="
    margin-top: 18px;
    background: var(--gp-surface);
    border: 1px solid var(--gp-line-16);
    border-radius: 16px;
    padding: 18px 20px 20px;
  "
>
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
    <div style="font-weight: 600; font-size: 15px">Documentos</div>
    <sc-if value="{{ est.canUploadDocuments }}" hint-placeholder-val="{{ true }}">
      <label
        style="
          display: inline-flex;
          align-items: center;
          gap: 7px;
          background: var(--gp-surface-2);
          border: 1px solid var(--gp-line-20);
          color: var(--gp-text-2);
          border-radius: 10px;
          padding: 8px 12px;
          font-size: 12.5px;
          font-weight: 500;
          cursor: pointer;
        "
        style-hover="border-color:var(--gp-cyan-40);color:var(--gp-cyan)"
      >
        <svg width="14" height="14"><use href="#ic-plus"></use></svg>
        {{ est.uploadDocumentsLabel }}
        <input
          type="file"
          multiple
          accept=".doc,.docx,.pdf"
          onChange="{{ est.onDocumentFiles }}"
          style="display: none"
        />
      </label>
    </sc-if>
    <sc-if value="{{ est.uploadDocumentsDisabled }}" hint-placeholder-val="{{ false }}">
      <span
        style="
          display: inline-flex;
          align-items: center;
          gap: 7px;
          background: var(--gp-surface-2);
          border: 1px solid var(--gp-line-20);
          color: var(--gp-muted-2);
          border-radius: 10px;
          padding: 8px 12px;
          font-size: 12.5px;
          font-weight: 500;
          cursor: not-allowed;
        "
      >
        <svg width="14" height="14"><use href="#ic-plus"></use></svg>
        {{ est.uploadDocumentsLabel }}
      </span>
    </sc-if>
  </div>
  <p style="margin: 8px 0 12px; color: var(--gp-muted); font-size: 12.5px; line-height: 1.45">
    {{ est.documentsHint }}
  </p>

  <sc-if value="{{ est.documentsEmpty }}" hint-placeholder-val="{{ false }}">
    <div
      style="
        border: 1.5px dashed var(--gp-line-24);
        border-radius: 12px;
        padding: 18px;
        text-align: center;
        color: var(--gp-muted-2);
        font-size: 12.5px;
      "
    >
      Esta estimación no tiene documentos.
    </div>
  </sc-if>

  <sc-if value="{{ est.hasDocuments }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ est.documents }}" as="doc" hint-placeholder-count="2">
        <div
          style="
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--gp-field);
            border: 1px solid var(--gp-line-16);
            border-radius: 12px;
            padding: 10px 12px;
          "
        >
          <svg width="18" height="18" style="flex: none; color: var(--gp-muted)">
            <use href="{{ doc.iconHref }}"></use>
          </svg>
          <div style="flex: 1; min-width: 0">
            <div style="font-size: 13px; font-weight: 500; overflow-wrap: anywhere">{{ doc.nombre }}</div>
            <div style="font-size: 11px; color: var(--gp-muted-2)">{{ doc.tipo }}</div>
          </div>
          <button
            onClick="{{ doc.open }}"
            title="Abrir"
            aria-label="Abrir documento"
            style="background: none; border: 0; color: var(--gp-cyan); cursor: pointer; padding: 4px; display: flex"
          >
            <svg width="15" height="15"><use href="#ic-ext"></use></svg>
          </button>
          <button
            onClick="{{ doc.del }}"
            title="Eliminar"
            aria-label="Eliminar documento"
            style="background: none; border: 0; color: var(--gp-muted-2); cursor: pointer; padding: 4px; display: flex"
            style-hover="color:var(--gp-red)"
          >
            <svg width="15" height="15"><use href="#ic-x"></use></svg>
          </button>
        </div>
      </sc-for>
    </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"est":null}'>
class Component extends DCLogic {
}
</script>
