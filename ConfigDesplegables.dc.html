<x-dc>
<div style="margin-top: 32px">
  <div
    style="
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    "
  >
    <h2
      style="
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: var(--gp-text);
      "
    >
      Desplegables
    </h2>
    <span style="font-size: 12px; color: var(--gp-muted-2)"
      >APIs, apps y gateways de la empresa</span
    >
    <button
      onClick="{{ addDesplegable }}"
      style="
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: none;
        border: 1px solid rgba(53, 192, 240, 0.4);
        color: #35c0f0;
        cursor: pointer;
        padding: 7px 13px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
      "
      style-hover="background:rgba(53,192,240,.1)"
    >
      <svg width="13" height="13">
        <use href="#ic-plus"></use></svg
      >Nuevo desplegable
    </button>
  </div>
  <sc-if
    value="{{ desplegablesEmpty }}"
    hint-placeholder-val="{{ false }}"
  >
    <div
      style="
        background: var(--gp-field);
        border: 1px dashed var(--gp-line-22);
        border-radius: 14px;
        padding: 20px;
        color: var(--gp-muted-2);
        font-size: 13px;
      "
    >
      Sin desplegables. Crea las APIs, apps y gateways de esta
      empresa para poder armar correos.
    </div>
  </sc-if>
  <div
    style="display: flex; flex-direction: column; gap: 8px"
  >
    <sc-for
      list="{{ desplegablesList }}"
      as="d"
      hint-placeholder-count="4"
    >
      <div
        style="
          background: var(--gp-surface);
          border: 1px solid var(--gp-line-16);
          border-radius: 12px;
          padding: 12px 14px;
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
        "
      >
        <span
          style="
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 3px;
          "
        >
          <span
            style="
              font-size: 13.5px;
              font-weight: 600;
              color: var(--gp-text);
              font-family:
                &quot;JetBrains Mono&quot;, monospace;
            "
            >{{ d.titulo }}</span
          >
          <span style="font-size: 11.5px; color: var(--gp-muted-2)"
            >{{ d.detalle }}</span
          >
        </span>
        <span
          style="flex:none;font-size:11px;font-weight:600;color:{{ d.kindColor }};background:{{ d.kindBg }};padding:3px 9px;border-radius:20px"
          >{{ d.kindLabel }}</span
        >
        <button
          onClick="{{ d.edit }}"
          style="
            flex: none;
            background: none;
            border: 1px solid var(--gp-line-22);
            color: var(--gp-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="color:#35c0f0;border-color:rgba(53,192,240,.4)"
        >
          Editar
        </button>
        <button
          onClick="{{ d.del }}"
          style="
            flex: none;
            background: none;
            border: 1px solid rgba(249, 123, 123, 0.25);
            color: #f97b7b;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
          "
          style-hover="background:rgba(249,123,123,.08)"
        >
          Eliminar
        </button>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"addDesplegable":null,"desplegablesEmpty":false,"desplegablesList":[]}'>
class Component extends DCLogic {
}
</script>
