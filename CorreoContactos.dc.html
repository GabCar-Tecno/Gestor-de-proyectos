<x-dc>
<div
  style="
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-start;
  "
>
  <div
    style="
      flex: 1;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    "
  >
    <span
      style="
        font-size: 11.5px;
        font-weight: 600;
        color: var(--gp-muted-2);
      "
      >Para</span
    >
    <button
      onClick="{{ toggleCorreoTo }}"
      style="width:100%;text-align:left;cursor:pointer;background:var(--gp-field);border:1px solid {{ correoToBorder }};border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px"
      style-hover="border-color:rgba(53,192,240,.45)"
    >
      <span
        style="flex:1;min-width:0;font-size:12.5px;color:{{ correoToResumenColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        >{{ correoToResumen }}</span
      >
      <svg
        width="13"
        height="13"
        style="flex:none;color:var(--gp-muted-2);transform:{{ correoToChevron }}"
      >
        <use href="#ic-chevron"></use>
      </svg>
    </button>
    <sc-if
      value="{{ correoToOpen }}"
      hint-placeholder-val="{{ false }}"
    >
      <div
        style="
          background: var(--gp-field);
          border: 1px solid var(--gp-line-22);
          border-radius: 10px;
          padding: 6px;
          max-height: 220px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 2px;
        "
      >
        <sc-for
          list="{{ correoContactosTo }}"
          as="k"
          hint-placeholder-count="3"
        >
          <button
            onClick="{{ k.toggle }}"
            style="text-align:left;cursor:pointer;background:{{ k.rowBg }};border:0;border-radius:8px;padding:7px 9px;display:flex;align-items:center;gap:9px"
            style-hover="background:var(--gp-hover-bg)"
          >
            <span
              style="flex:none;width:15px;height:15px;border-radius:5px;border:1px solid {{ k.boxBorder }};background:{{ k.boxBg }};display:flex;align-items:center;justify-content:center;color:#172033"
              ><svg width="10" height="10">
                <use
                  href="{{ k.iconHref }}"
                ></use></svg
            ></span>
            <span
              style="
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 1px;
              "
            >
              <span
                style="font-size:12.5px;color:{{ k.color }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                >{{ k.name }}</span
              >
              <span
                style="
                  font-size: 11px;
                  color: var(--gp-muted-2);
                  font-family:
                    &quot;JetBrains Mono&quot;,
                    monospace;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                "
                >{{ k.email }}</span
              >
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div
    style="
      flex: 1;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    "
  >
    <span
      style="
        font-size: 11.5px;
        font-weight: 600;
        color: var(--gp-muted-2);
      "
      >CC</span
    >
    <button
      onClick="{{ toggleCorreoCc }}"
      style="width:100%;text-align:left;cursor:pointer;background:var(--gp-field);border:1px solid {{ correoCcBorder }};border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:9px"
      style-hover="border-color:rgba(167,139,250,.45)"
    >
      <span
        style="flex:1;min-width:0;font-size:12.5px;color:{{ correoCcResumenColor }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
        >{{ correoCcResumen }}</span
      >
      <svg
        width="13"
        height="13"
        style="flex:none;color:var(--gp-muted-2);transform:{{ correoCcChevron }}"
      >
        <use href="#ic-chevron"></use>
      </svg>
    </button>
    <sc-if
      value="{{ correoCcOpen }}"
      hint-placeholder-val="{{ false }}"
    >
      <div
        style="
          background: var(--gp-field);
          border: 1px solid var(--gp-line-22);
          border-radius: 10px;
          padding: 6px;
          max-height: 220px;
          overflow-y: auto;
          display: flex;
          flex-direction: column;
          gap: 2px;
        "
      >
        <sc-for
          list="{{ correoContactosCc }}"
          as="k"
          hint-placeholder-count="3"
        >
          <button
            onClick="{{ k.toggle }}"
            style="text-align:left;cursor:pointer;background:{{ k.rowBg }};border:0;border-radius:8px;padding:7px 9px;display:flex;align-items:center;gap:9px"
            style-hover="background:var(--gp-hover-bg)"
          >
            <span
              style="flex:none;width:15px;height:15px;border-radius:5px;border:1px solid {{ k.boxBorder }};background:{{ k.boxBg }};display:flex;align-items:center;justify-content:center;color:#172033"
              ><svg width="10" height="10">
                <use
                  href="{{ k.iconHref }}"
                ></use></svg
            ></span>
            <span
              style="
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 1px;
              "
            >
              <span
                style="font-size:12.5px;color:{{ k.color }};overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
                >{{ k.name }}</span
              >
              <span
                style="
                  font-size: 11px;
                  color: var(--gp-muted-2);
                  font-family:
                    &quot;JetBrains Mono&quot;,
                    monospace;
                  overflow: hidden;
                  text-overflow: ellipsis;
                  white-space: nowrap;
                "
                >{{ k.email }}</span
              >
            </span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"toggleCorreoTo":null,"correoToBorder":null,"correoToResumenColor":null,"correoToResumen":null,"correoToChevron":null,"correoToOpen":false,"correoContactosTo":null,"toggleCorreoCc":null,"correoCcBorder":null,"correoCcResumenColor":null,"correoCcResumen":null,"correoCcChevron":null,"correoCcOpen":false,"correoContactosCc":null}'>
class Component extends DCLogic {
}
</script>
