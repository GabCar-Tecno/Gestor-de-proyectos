<x-dc>
<div style="animation: vwIn 0.3s ease">
  <div style="margin-bottom: 26px">
    <h1
      style="
        margin: 0 0 5px;
        font-size: clamp(24px, 3.4vw, 32px);
        font-weight: 700;
        letter-spacing: -0.6px;
      "
    >
      Empresas
    </h1>
    <p style="margin: 0; color: var(--gp-muted); font-size: 14px">
      Selecciona una empresa para ver sus proyectos.
    </p>
  </div>
  <div
    style="
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(255px, 1fr)
      );
      gap: 16px;
    "
  >
    <sc-for
      list="{{ empresasList }}"
      as="e"
      hint-placeholder-count="3"
    >
      <button
        onClick="{{ e.open }}"
        style="
          text-align: left;
          cursor: pointer;
          background: var(--gp-surface);
          border: 1px solid var(--gp-line-16);
          border-radius: 16px;
          padding: 22px;
          display: flex;
          flex-direction: column;
          gap: 16px;
          transition:
            border-color 0.18s,
            transform 0.18s;
        "
        style-hover="border-color:var(--gp-cyan-45);transform:translateY(-3px)"
      >
        <div
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
          "
        >
          <sc-if
            value="{{ e.logo }}"
            hint-placeholder-val="{{ false }}"
            ><div
              style="
                height: 64px;
                padding: 6px 10px;
                border-radius: 14px;
                background: var(--gp-white);
                border: 1px solid var(--gp-line-14);
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <img
                src="{{ e.logo }}"
                alt="{{ e.nombre }}"
                style="
                  height: 100%;
                  width: auto;
                  max-width: 160px;
                  object-fit: contain;
                  display: block;
                "
              /></div
          ></sc-if>
          <sc-if
            value="{{ !e.logo }}"
            hint-placeholder-val="{{ true }}"
            ><div
              style="width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:21px;color:var(--gp-white);background:{{ e.color }}"
            >
              {{ e.mono }}
            </div></sc-if
          >
          <span style="font-size: 11px; color: var(--gp-muted-2)">›</span>
        </div>
        <div>
          <div
            style="
              font-size: 17px;
              font-weight: 600;
              margin-bottom: 3px;
            "
          >
            {{ e.nombre }}
          </div>
          <div style="font-size: 12.5px; color: var(--gp-muted)">
            {{ e.proyectosLabel }}
          </div>
        </div>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empresasList":[]}'>
class Component extends DCLogic {
}
</script>
